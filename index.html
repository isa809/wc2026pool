      if(d.noPick>0) html+='<div style="font-size:11px;color:var(--muted);margin-top:4px">'+d.noPick+' player'+(d.noPick!==1?'s':'')+': no pick yet</div>';
    } else {
      html+='<div style="font-size:12px;color:var(--muted);margin-top:6px;font-style:italic">No picks yet for this match.</div>';
    }
    html+='</div>';
  });
  html+='</div>';
  return html;
}

/* ---- Stage 2: Opportunity / swing scenarios (READ-ONLY) ---- */

/* Ordinal: 1->1st, 2->2nd, 3->3rd, 4->4th, 11->11th, 21->21st. */
function moveOrd(n){const s=["th","st","nd","rd"],v=n%100;return n+(s[(v-20)%10]||s[v]||s[0]);}

/* Current standings using full results (calcScore). Super admins excluded. */
function moveCurrentStandings(){
  return Object.entries(ST.users)
    .filter(([k,u])=>!isSuperAdminEntry(k,u))
    .map(([k,u])=>({key:k,name:u.displayName||k,score:calcScore(k)}))
    .sort((a,b)=>b.score-a.score)
    .map((s,i)=>({...s,rank:i+1}));
}

/* Points a player's pick would earn for one match under a HYPOTHETICAL outcome.
   Mirrors calcScore EXACTLY (group: correct=groupCorrect, correct draw=groupDraw,
   wrong=groupWrong; KO: base+bonus on a hit, 0 otherwise; no pick = 0).
   outcome: group -> "W"|"D"|"L"; ko -> the advancing team name. */
function moveHypoPoints(userKey,picks,it,outcome){
  if(it.kind==="group"){
    const p=picks.group[it.id];
    if(!p) return 0;
    return p===outcome ? (outcome==="D"?SC.groupDraw:SC.groupCorrect) : SC.groupWrong;
  }
  const sc=SC.ko[it.rid];
  if(!sc) return 0;
  // Team-based, exactly like calcScore: if `outcome` (the hypothetical winner) is
  // in the player's merged round winners, they earn base + earliest-pick bonus.
  const br=koBonusRound(userKey,it.rid,outcome);
  return br ? sc.base+(sc.bonus[br-1]||0) : 0;
}

/* Possible outcomes for one upcoming match. Group -> W/D/L; KO -> each
   non-TBD team advancing. {o:<scoring key>}. */
function moveMatchOutcomes(it){
  if(it.kind==="group") return [{o:"W"},{o:"D"},{o:"L"}];
  const info=moveMatchInfo(it);
  const outs=[];
  if(info.home&&info.home!=="TBD") outs.push({o:info.home});
  if(info.away&&info.away!=="TBD") outs.push({o:info.away});
  return outs;
}

/* Readable description of an outcome, e.g. "Norway beat Iraq" / "Mexico and
   South Africa draw" / "Brazil beat Morocco". */
function moveOutcomePhrase(it,outcome){
  const info=moveMatchInfo(it);
  if(it.kind==="group"){
    if(outcome==="W") return info.home+" beat "+info.away;
    if(outcome==="L") return info.away+" beat "+info.home;
    return info.home+" and "+info.away+" draw";
  }
  const other=outcome===info.home?info.away:info.home;
  return (other&&other!=="TBD") ? outcome+" beat "+other : outcome+" advance";
}

/* What a player picked on a match, as a readable label ("no pick" if none). */
function movePickName(picks,it){
  if(it.kind==="group"){
    const p=picks.group[it.id];
    if(!p) return "no pick";
    const info=moveMatchInfo(it);
    return p==="W"?info.home:p==="D"?"Draw":info.away;
  }
  const key=it.rid+"_"+it.i;
  const pObj=picks.ko[key];
  let team=pObj?pObj.team:null;
  if(team==="__t3__") team=picks.ko[key+"_t3"]||null;
  return team||"no pick";
}

/* The "Opportunities today" card: pairwise, single-match swing scenarios for
   the next unplayed matchday. Returns "" when there's nothing upcoming. */
function renderOpportunities(){
  MOVE_OPP_LINE="";
  const day=moveNextUnplayedDay();
  if(!day) return "";
  const matches=day.items.filter(it=>
    it.kind==="group" ? !ST.results.group[it.id] : !ST.results.ko[it.rid+"_"+it.i]
  );
  if(!matches.length) return "";
  const standings=moveCurrentStandings();
  if(standings.length<2) return "";
  const picksBy={}; standings.forEach(s=>picksBy[s.key]=getMergedPicks(s.key));

  // Close pairs: B ahead of (or level with) A. Always include adjacent pairs;
  // also any pair within THRESH points. gap = B.score - A.score >= 0.
  const THRESH=6, pairs=[];
  for(let i=0;i<standings.length;i++){
    for(let j=i+1;j<standings.length;j++){
      const B=standings[i],A=standings[j],gap=B.score-A.score;
      if(j===i+1 || gap<=THRESH) pairs.push({A,B,gap});
    }
  }
  pairs.sort((p,q)=>p.gap-q.gap||p.A.rank-q.A.rank);
  const SHOWN=pairs.slice(0,8);

  let best=null,blocks="";
  SHOWN.forEach(pr=>{
    const {A,B,gap}=pr;
    // Single-match levers: an outcome where (B_delta - A_delta) closes the gap.
    const levers=[];
    matches.forEach(it=>{
      moveMatchOutcomes(it).forEach(out=>{
        const aD=moveHypoPoints(A.key,picksBy[A.key],it,out.o);
        const bD=moveHypoPoints(B.key,picksBy[B.key],it,out.o);
        const newGap=gap+(bD-aD);
        if(newGap<=0 && newGap<gap){
          levers.push({it,o:out.o,newGap,aPick:movePickName(picksBy[A.key],it),bPick:movePickName(picksBy[B.key],it)});
        }
      });
    });
    levers.sort((x,y)=>x.newGap-y.newGap);
    const top=levers.slice(0,4);

    blocks+='<div style="padding:8px 0;border-top:1px solid var(--border)">'+
      '<div style="font-size:12px;font-weight:700">'+A.name+' ('+moveOrd(A.rank)+', '+A.score+' pts) &#8594; '+
        B.name+' ('+moveOrd(B.rank)+', '+B.score+' pts), '+(gap===0?'level':gap+' back')+'</div>';
    if(top.length){
      blocks+='<div style="margin-top:4px;display:flex;flex-direction:column;gap:2px">';
      top.forEach(l=>{
        const verb=l.newGap===0?'Ties '+B.name:'Passes '+B.name;
        blocks+='<div style="font-size:12px;line-height:1.4;color:var(--navy)">&#8226; '+verb+' if '+moveOutcomePhrase(l.it,l.o)+
          ' <span style="color:var(--muted)">('+A.name+': '+l.aPick+', '+B.name+': '+l.bPick+')</span></div>';
      });
      blocks+='</div>';
      // Commentary uses the closest pair with a lever; prefer a clean tie.
      if(!best){ const tie=top.find(l=>l.newGap===0); best={A,B,l:tie||top[0]}; }
    } else {
      blocks+='<div style="font-size:12px;color:var(--muted);margin-top:4px">&#8226; No single result closes it today'+
        (gap>0?' — would need multiple results to go '+A.name+'’s way':'')+'</div>';
    }
    blocks+='</div>';
  });

  let html='<div class="card" style="margin-top:12px">'+
    '<div class="card-title">&#128161; Opportunities today</div>'+
    '<div style="font-size:12px;color:var(--muted);margin:-4px 0 4px">How today’s unplayed matches could shift the closest gaps. Single-match levers only — exact scoring.</div>'+
    blocks;
  if(best){
    const verb=best.l.newGap===0?'tie':'pass';
    MOVE_OPP_LINE='🔥 Today’s big one: '+best.A.name+' can '+verb+' '+best.B.name+' for '+moveOrd(best.B.rank)+
      ' if '+moveOutcomePhrase(best.l.it,best.l.o)+'. Everything to play for.';
    html+='<div id="mvOppLine" style="margin-top:10px;background:var(--bg);padding:10px 12px;border-radius:8px;font-size:13px;line-height:1.5">'+MOVE_OPP_LINE+'</div>'+
      '<button class="btn btn-outline" id="mvOppCopy" style="margin-top:8px;width:auto;padding:7px 16px;font-size:13px">&#128203; Copy</button>'+
      '<span id="mvOppCopyMsg" style="font-size:12px;color:var(--green);margin-left:10px"></span>';
  }
  html+='</div>';
  return html;
}

function openMovement(btn){
  if(btn){btn.disabled=true;btn.textContent="Loading...";}
  if(_updateListener&&CURRENT_POOL_CODE&&db){
    db.ref("pools/"+CURRENT_POOL_CODE).off("value",_updateListener);
    _updateListener=null;
  }
  loadAllPools((err,pools)=>{
    if(err){ showConfirmModal("Error loading pools: "+err,()=>{}); if(btn){btn.disabled=false;btn.innerHTML="&#128202; Movement";} return; }
    MOVE_POOLS=pools||[];
    if(!MOVE_SELECTED||!MOVE_POOLS.some(p=>p.code===MOVE_SELECTED)){
      MOVE_SELECTED=MOVE_POOLS.length?MOVE_POOLS[0].code:null;
    }
    if(!MOVE_SELECTED){ SA_MOVE=true; render(); return; }
    moveLoadPoolAndDefaults(MOVE_SELECTED,()=>{ SA_MOVE=true; render(); });
  });
}

/* Load a pool's data into ST and set default From/To to the last two result days. */
function moveLoadPoolAndDefaults(code,cb){
  loadPool(code,()=>{
    const days=moveResultDays();
    MOVE_TO  =days.length?days[days.length-1].key:null;
    MOVE_FROM=days.length>1?days[days.length-2].key:(days.length?days[0].key:null);
    cb&&cb();
  });
}

function closeMovement(){ SA_MOVE=false; render(); }

function renderMovement(){
  let html='<div style="padding:16px">'+
    '<div style="display:flex;align-items:center;gap:10px;margin-bottom:8px">'+
      '<button class="btn-sm" id="mvBack">&#8592; Back to pools</button>'+
      '<div style="font-family:Bebas Neue,sans-serif;font-size:20px;color:var(--fifa-blue)">&#128202; Movement Analysis</div>'+
    '</div>'+
    '<div class="notice-blue" style="margin-bottom:12px">Read-only replay — standings are recomputed from picks + results as of each day. Nothing is saved.</div>';

  if(!MOVE_POOLS.length){ html+='<div class="notice-blue">No pools created yet.</div></div>'; return html; }

  // Pool selector
  html+='<div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:10px">'+
    '<label style="font-size:12px;color:var(--muted)">Pool:</label>'+
    '<select id="mvPool" class="asel" style="flex:0 0 auto">';
  MOVE_POOLS.forEach(p=>{ html+='<option value="'+p.code+'"'+(p.code===MOVE_SELECTED?" selected":"")+'>'+p.name+' ('+p.code+')</option>'; });
  html+='</select></div>';

  // Per-pool announcement box — appears atop this pool's Standings tab.
  html+='<div style="background:#e6f1fb;border:1px solid #b5d4f4;border-radius:10px;padding:12px 14px;margin-bottom:12px">'+
    '<div style="font-size:12px;font-weight:700;color:#185fa5;margin-bottom:6px">📣 Standings message for this pool</div>'+
    '<textarea id="mvAnnounce" placeholder="e.g. Great shake-up after matchday 2 — check your bracket!" style="width:100%;min-height:54px;font-family:inherit;font-size:13px;padding:8px;border:1px solid #b5d4f4;border-radius:6px;resize:vertical;box-sizing:border-box">'+escapeHtml(ST.announcement||"")+'</textarea>'+
    '<div style="display:flex;gap:6px;flex-wrap:wrap;margin-top:8px">'+
      '<button class="btn-sm" id="mvAnnouncePost">📣 Post to Standings</button>'+
      '<button class="btn-sm btn-danger" id="mvAnnounceClear">✕ Clear</button>'+
    '</div>'+
    '<div id="mvAnnounceStatus" style="font-size:12px;color:#185fa5;margin-top:6px"></div>'+
  '</div>';

  // "Today's matches" + "Opportunities" are independent of the From/To
  // comparison, so build them once and show in every pool-selected branch.
  const todayHtml=renderTodayMatches()+renderOpportunities();

  const days=moveResultDays();
  if(days.length<2){
    html+='<div class="notice'+(days.length?'':'-red')+'">Need at least two days with entered results to compare. This pool has '+days.length+'.</div>';
    html+=todayHtml;
    html+='</div>';
    return html;
  }
  if(MOVE_FROM===null||!days.some(d=>d.key===MOVE_FROM)) MOVE_FROM=days[days.length-2].key;
  if(MOVE_TO===null||!days.some(d=>d.key===MOVE_TO)) MOVE_TO=days[days.length-1].key;

  // Date selectors
  const opts=(sel)=>days.map(d=>'<option value="'+d.key+'"'+(d.key===sel?" selected":"")+'>'+d.label+'</option>').join("");
  html+='<div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px">'+
    '<label style="font-size:12px;color:var(--muted)">From:</label>'+
    '<select id="mvFrom" class="asel" style="flex:0 0 auto">'+opts(MOVE_FROM)+'</select>'+
    '<label style="font-size:12px;color:var(--muted)">To:</label>'+
    '<select id="mvTo" class="asel" style="flex:0 0 auto">'+opts(MOVE_TO)+'</select>'+
  '</div>';

  // Sort selector
  const sortOpts=[
    ['movers','Biggest movers'],
    ['rankto','Rank at To date (1st → last)'],
    ['rankfrom','Rank at From date (1st → last)'],
    ['moveup','Movement: climbers first'],
    ['movedown','Movement: fallers first'],
    ['ptsdesc','Points gained: most first'],
    ['ptsasc','Points gained: least first']
  ];
  html+='<div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px">'+
    '<label style="font-size:12px;color:var(--muted)">Sort:</label>'+
    '<select id="mvSort" class="asel" style="flex:0 0 auto">'+
      sortOpts.map(o=>'<option value="'+o[0]+'"'+(o[0]===MOVE_SORT?" selected":"")+'>'+o[1]+'</option>').join('')+
    '</select>'+
  '</div>';

  if(MOVE_FROM>=MOVE_TO){
    html+='<div class="notice-red">"To" must be a later day than "From".</div>';
    html+=todayHtml;
    html+='</div>';
    return html;
  }

  // Compute standings at both endpoints
  const fromS=standingsAsOf(MOVE_FROM), toS=standingsAsOf(MOVE_TO);
  const fromMap={}; fromS.forEach(s=>fromMap[s.key]=s);

  // Merged picks per player (date-independent)
  const picksBy={};
  toS.forEach(s=>{ picksBy[s.key]=getMergedPicks(s.key); });

  // Window matches + per-player attribution
  const wMatches=moveWindowMatches(MOVE_FROM,MOVE_TO);

  // Differentiating matches: among players who picked, >1 distinct outcome
  const diff=[];
  wMatches.forEach(m=>{
    const outcomes={};
    toS.forEach(s=>{ const r=movePointsForMatch(s.key,picksBy[s.key],m); if(r.picked&&r.outcome!=null) outcomes[r.outcome]=true; });
    if(Object.keys(outcomes).length>1) diff.push(m);
  });

  // Build movement rows
  const rows=toS.map(s=>{
    const f=fromMap[s.key]||{rank:s.rank,score:s.score};
    const rankChange=f.rank-s.rank;       // + = climbed
    const pointsGained=s.score-f.score;
    const scored=wMatches.map(m=>({m,r:movePointsForMatch(s.key,picksBy[s.key],m)}));
    // drivers = matches that moved points (used by the commentary generator).
    const drivers=scored.filter(x=>x.r.picked&&x.r.pts!==0).sort((a,b)=>b.r.pts-a.r.pts);
    // windowPicks = every window match with the player's pick context (display).
    const windowPicks=scored.slice().sort((a,b)=>b.r.pts-a.r.pts);
    return {key:s.key,name:s.name,fromRank:f.rank,toRank:s.rank,rankChange,pointsGained,drivers,windowPicks};
  });
  // Display sort (does not affect the commentary, which re-sorts independently).
  const moveComparators={
    movers:  (a,b)=>(Math.abs(b.rankChange)-Math.abs(a.rankChange))||(b.pointsGained-a.pointsGained),
    rankto:  (a,b)=>(a.toRank-b.toRank),                 // current standing, top first
    rankfrom:(a,b)=>(a.fromRank-b.fromRank),             // prior standing, top first
    moveup:  (a,b)=>(b.rankChange-a.rankChange)||(b.pointsGained-a.pointsGained), // climbers first
    movedown:(a,b)=>(a.rankChange-b.rankChange)||(a.pointsGained-b.pointsGained), // fallers first
    ptsdesc: (a,b)=>(b.pointsGained-a.pointsGained)||(a.toRank-b.toRank),         // most gained first
    ptsasc:  (a,b)=>(a.pointsGained-b.pointsGained)||(a.toRank-b.toRank)          // least gained first
  };
  rows.sort(moveComparators[MOVE_SORT]||moveComparators.movers);

  const changedCount=rows.filter(r=>r.rankChange!==0).length;
  const lockstep=changedCount===0;

  // Top climber / biggest faller for insight + commentary
  const climbers=rows.filter(r=>r.rankChange>0).sort((a,b)=>b.rankChange-a.rankChange||b.pointsGained-a.pointsGained);
  const fallers=rows.filter(r=>r.rankChange<0).sort((a,b)=>a.rankChange-b.rankChange||a.pointsGained-b.pointsGained);
  const topClimber=climbers[0]||null;
  const biggestFaller=fallers[0]||null;

  // Insight line
  const fromLabel=days.find(d=>d.key===MOVE_FROM).label, toLabel=days.find(d=>d.key===MOVE_TO).label;
  if(lockstep){
    html+='<div class="notice-green" style="margin-bottom:10px">&#128274; <strong>Lockstep</strong> — everyone moved together, no position changes between '+fromLabel+' and '+toLabel+'. The pack picked alike.</div>';
  } else {
    let line='&#9889; <strong>Shake-up</strong> — '+changedCount+' player'+(changedCount!==1?'s':'')+' changed position.';
    if(diff.length) line+=' Movement was driven by: '+diff.map(m=>moveDescribe(m)+' (pool was split)').join('; ')+'.';
    html+='<div class="notice-red" style="margin-bottom:10px">'+line+'</div>';
  }

  // Movement table
  html+='<div class="card" style="padding:0;overflow-x:auto"><table style="width:100%;border-collapse:collapse;font-size:12px">'+
    '<tr style="background:#f5f5f2;color:var(--muted)">'+
      '<th style="text-align:left;padding:8px 10px">Player</th>'+
      '<th style="text-align:left;padding:8px 10px">Movement</th>'+
      '<th style="text-align:left;padding:8px 10px">Pts gained</th>'+
      '<th style="text-align:left;padding:8px 10px">What drove it</th>'+
    '</tr>';
  rows.forEach(r=>{
    let mv;
    if(r.rankChange>0) mv='<span style="color:var(--green);font-weight:600">&#8593; +'+r.rankChange+'</span>';
    else if(r.rankChange<0) mv='<span style="color:var(--red);font-weight:600">&#8595; '+r.rankChange+'</span>';
    else mv='<span style="color:var(--muted)">– no change</span>';
    mv+=' <span style="color:var(--muted);font-size:11px">('+r.fromRank+'&#8594;'+r.toRank+')</span>';
    const pg=(r.pointsGained>0?'+':'')+r.pointsGained;
    const pgColor=r.pointsGained>0?'var(--green)':r.pointsGained<0?'var(--red)':'var(--muted)';
    const drove=r.windowPicks.length
      ? r.windowPicks.map(x=>{
          const label=movePickLabel(x.m,x.r);
          let ctx;
          if(label===null){
            ctx=' <span style="color:var(--muted)">· no pick</span>';
          } else {
            const ok=!!x.r.hit;
            const col=ok?'var(--green)':'var(--red)';
            ctx=' <span style="color:var(--muted)">· picked '+label+'</span>'+
                '<span style="color:'+col+'">'+(ok?' &#10003;':' &#10007;')+'</span>';
          }
          const ptsCol=x.r.pts>0?'var(--green)':x.r.pts<0?'var(--red)':'var(--muted)';
          const pts=' <strong style="color:'+ptsCol+'">'+(x.r.pts>0?'+':'')+x.r.pts+'</strong>';
          return moveDescribe(x.m)+ctx+pts;
        }).join('<br>')
      : '<span style="color:var(--muted)">no matches in window</span>';
    html+='<tr style="border-top:1px solid var(--border)">'+
      '<td style="padding:8px 10px;font-weight:600;white-space:nowrap">'+r.name+'</td>'+
      '<td style="padding:8px 10px;white-space:nowrap">'+mv+'</td>'+
      '<td style="padding:8px 10px;color:'+pgColor+';font-weight:600">'+pg+'</td>'+
      '<td style="padding:8px 10px;font-size:11px;line-height:1.5">'+drove+'</td>'+
    '</tr>';
  });
  html+='</table></div>';

  // Today's matches — pick distribution for the next unplayed matchday.
  html+=todayHtml;

  // Commentary
  MOVE_COMMENTARY=moveBuildCommentary(lockstep,changedCount,topClimber,biggestFaller,diff,picksBy);
  html+='<div class="card" style="margin-top:12px">'+
    '<div class="card-title">Shareable commentary</div>'+
    '<div id="mvCommentary" style="font-size:13px;line-height:1.55;white-space:pre-wrap;background:var(--bg);padding:10px 12px;border-radius:8px">'+MOVE_COMMENTARY+'</div>'+
    '<button class="btn btn-outline" id="mvCopy" style="margin-top:10px;width:auto;padding:7px 16px;font-size:13px">&#128203; Copy commentary</button>'+
    '<span id="mvCopyMsg" style="font-size:12px;color:var(--green);margin-left:10px"></span>'+
  '</div>';

  html+='</div>';
  return html;
}

/* Templated commentary built from the computed diff. */
function moveBuildCommentary(lockstep,changedCount,topClimber,biggestFaller,diff,picksBy){
  const poolName=(MOVE_POOLS.find(p=>p.code===MOVE_SELECTED)||{}).name||"the pool";
  if(lockstep){
    return "Quiet day in "+poolName+" — standings held firm. The pack picked alike, so nobody gained ground. You only climb when you dare to differ. 📊";
  }
  let s="Shake-up in "+poolName+"! ";
  if(topClimber&&topClimber.rankChange>0){
    s+=topClimber.name+" jumped +"+topClimber.rankChange+" ("+topClimber.fromRank+"→"+topClimber.toRank+")";
    // Differentiating match the climber scored most on
    let best=null;
    (topClimber.drivers||[]).forEach(x=>{ if(x.r.pts>0&&diff.some(d=>d.key===x.m.key&&d.isKo===x.m.isKo)){ if(!best||x.r.pts>best.r.pts) best=x; } });
    if(!best&&topClimber.drivers&&topClimber.drivers.length) best=topClimber.drivers[0];
    if(best) s+=" on the back of "+moveDescribe(best.m)+" that most of the pool missed";
    s+=". ";
  }
  if(biggestFaller&&biggestFaller.rankChange<0){
    s+=biggestFaller.name+" slipped "+biggestFaller.rankChange+" ("+biggestFaller.fromRank+"→"+biggestFaller.toRank+")";
    const badPick=(biggestFaller.drivers||[]).filter(x=>x.r.pts<0)[0];
    if(badPick) s+=" after "+moveDescribe(badPick.m)+" went the other way";
    s+=". ";
  }
  s+="The lesson, as always: you only climb when you dare to differ. 📈";
  return s;
}

function bindMovement(){
  const back=document.getElementById("mvBack");
  if(back) back.onclick=closeMovement;
  const poolSel=document.getElementById("mvPool");
  if(poolSel) poolSel.onchange=()=>{ MOVE_SELECTED=poolSel.value; moveLoadPoolAndDefaults(MOVE_SELECTED,()=>render()); };
  const fromSel=document.getElementById("mvFrom");
  if(fromSel) fromSel.onchange=()=>{ MOVE_FROM=parseInt(fromSel.value,10); render(); };
  const toSel=document.getElementById("mvTo");
  if(toSel) toSel.onchange=()=>{ MOVE_TO=parseInt(toSel.value,10); render(); };
  const sortSel=document.getElementById("mvSort");
  if(sortSel) sortSel.onchange=()=>{ MOVE_SORT=sortSel.value; render(); };
  const copy=document.getElementById("mvCopy");
  if(copy) copy.onclick=()=>{
    const done=()=>{ const m=document.getElementById("mvCopyMsg"); if(m){ m.textContent="✓ Copied!"; setTimeout(()=>{ if(m) m.textContent=""; },2000); } };
    if(navigator.clipboard&&navigator.clipboard.writeText) navigator.clipboard.writeText(MOVE_COMMENTARY).then(done).catch(done);
    else done();
  };
  const oppCopy=document.getElementById("mvOppCopy");
  if(oppCopy) oppCopy.onclick=()=>{
    const done=()=>{ const m=document.getElementById("mvOppCopyMsg"); if(m){ m.textContent="✓ Copied!"; setTimeout(()=>{ if(m) m.textContent=""; },2000); } };
    if(navigator.clipboard&&navigator.clipboard.writeText) navigator.clipboard.writeText(MOVE_OPP_LINE).then(done).catch(done);
    else done();
  };

  // Per-pool announcement post/clear (writes /pools/{MOVE_SELECTED}/announcement)
  const aMsg=document.getElementById("mvAnnounce");
  const aStatus=document.getElementById("mvAnnounceStatus");
  const aPost=document.getElementById("mvAnnouncePost");
  if(aPost) aPost.onclick=()=>{
    const text=(aMsg?aMsg.value:"").trim();
    if(!text){ if(aStatus){aStatus.textContent="Type a message first (or use Clear).";} return; }
    if(!MOVE_SELECTED){ return; }
    aPost.disabled=true;
    setPoolAnnouncement(MOVE_SELECTED,text).then(()=>{
      ST.announcement=text; if(CURRENT_POOL) CURRENT_POOL.announcement=text;
      if(aStatus){aStatus.textContent="✓ Posted to this pool's Standings tab.";} aPost.disabled=false;
    }).catch(e=>{ if(aStatus){aStatus.textContent="Error: "+e.message;} aPost.disabled=false; });
  };
  const aClear=document.getElementById("mvAnnounceClear");
  if(aClear) aClear.onclick=()=>{
    if(!MOVE_SELECTED){ return; }
    aClear.disabled=true;
    setPoolAnnouncement(MOVE_SELECTED,null).then(()=>{
      ST.announcement=""; if(CURRENT_POOL) CURRENT_POOL.announcement="";
      if(aMsg) aMsg.value=""; if(aStatus){aStatus.textContent="✓ Cleared.";} aClear.disabled=false;
    }).catch(e=>{ if(aStatus){aStatus.textContent="Error: "+e.message;} aClear.disabled=false; });
  };
}

/* Resolve any KO slot for the Global Results bracket: R32 from standings +
   overrides, later rounds from feeding-match winners + overrides. Returns
   {home:{team,label,placeholder}, away:{...}}. */
function resolveGlobalKoSlot(round,i,actS){
  return round==="r32" ? resolveR32Slot(i,actS) : resolveKoLaterSlot(round,i);
}
function globalKoSchedule(round,i){
  return round==="r32" ? (R32_SCHEDULE[i]||{}) : ((KO_LATER_SCHEDULE[round]||{})[i]||{});
}

/* Compact slot descriptor: R32 -> seed tags ("2A vs 2B", "1E vs 3A/B/C/D/F");
   later rounds -> the feeding match winners ("W74 vs W77"). */
function r32SideTag(side){
  if(side.t==="W") return "1"+side.g;
  if(side.t==="R") return "2"+side.g;
  if(side.t==="T3") return "3"+((side.label||"").replace(/^Best 3rd:\s*/,"").replace(/\s+/g,""));
  return "?";
}
function koSlotDescriptor(round,i){
  if(round==="r32"){ const s=R32_SEEDS[i]; return s?r32SideTag(s.a)+" vs "+r32SideTag(s.b):""; }
  if(round==="third"){ const a=koMatchNumber("sf",0),b=koMatchNumber("sf",1); return (a?"L"+a:"?")+" vs "+(b?"L"+b:"?"); }
  const feed=(KO_FEED[round]&&KO_FEED[round][i])||[];
  const prev=KO_PREV[round];
  const a=koMatchNumber(prev,feed[0]), b=koMatchNumber(prev,feed[1]);
  return (a?"W"+a:"?")+" vs "+(b?"W"+b:"?");
}
/* The small meta block under each bracket match: schedule line + slot descriptor. */
function globalKoMetaLine(round,i){
  const sch=globalKoSchedule(round,i);
  const mlabel=[sch.m?"M"+sch.m:"",sch.day,sch.time,sch.venue].filter(Boolean).join(" · ");
  const desc=koSlotDescriptor(round,i);
  if(!mlabel&&!desc) return "";
  return '<div style="font-size:8.5px;text-align:center;padding:2px 4px;line-height:1.3;border-top:1px solid var(--border)">'+
    (mlabel?'<div style="color:var(--muted)">'+mlabel+'</div>':'')+
    (desc?'<div style="color:var(--navy);font-weight:600">'+desc+'</div>':'')+
  '</div>';
}

/* One bracket match for the Global Results visual bracket — mirrors the per-pool
   admin bracket (click a real team to set/clear the winner; the global click
   handler also PUSHES to all pools). A ✎ pencil reveals override dropdowns
   (all alive teams) wired to the existing matchup-push handlers. Placeholders
   ("Winner A", "Best 3rd…", "Winner M77") are shown but are not clickable. */
function globalBracketSlotHtml(round,i,actS,aliveTeams){
  const key=round+'_'+i;
  const slot=resolveGlobalKoSlot(round,i,actS);
  const res=ST.results.ko[key]||null;
  const ov=(ST.results.koMatches[round]&&ST.results.koMatches[round][i])||{};

  const slotSide=(s)=>{
    const real=!s.placeholder&&!!s.team;
    const won=res&&real&&res===s.team;
    return '<div class="brd-slot'+(won?' correct':'')+(real?' hoverable':'')+'" '+
      (real?'data-gkowin="'+key+'" data-gkoteam="'+s.team+'" ':'')+
      'style="cursor:'+(real?'pointer':'default')+';'+(won?'background:#1a6b3c;':'')+'">'+
        '<span class="slot-name" style="'+(won?'color:#fff;font-weight:600':'')+'" title="'+s.label+'">'+
          (real?s.team:'<em style="color:var(--muted);font-size:10px">'+s.label+'</em>')+
        '</span>'+
        (won?'<span style="font-size:10px;color:#fff;margin-left:4px" title="Click to clear">&#127942;</span><span class="admin-clear-hint">&#10005; clear</span>':'')+
      '</div>';
  };

  // Override edit form (alive-team dropdowns) — reuses the existing matchup
  // override + push/clear handlers via their data-* attributes.
  const sideAttr=round==="r32"?('data-gr32side="'+i+'|'):('data-gkoside="'+round+'|'+i+'|');
  const ovSel=(sideName,cur)=>'<select '+sideAttr+sideName+'" class="asel" style="width:100%;font-size:11px;margin-bottom:4px">'+
    '<option value="">— auto —</option>'+
    '<option value="TBD"'+(cur==='TBD'?' selected':'')+'>TBD (undetermined)</option>'+
    aliveTeams.map(t=>'<option value="'+t+'"'+(cur===t?' selected':'')+'>'+t+'</option>').join('')+
  '</select>';
  const pushAttr=round==="r32"?('data-gpush-r32="'+i+'"'):('data-gpushkomatch="'+round+'|'+i+'"');
  const clearAttr=round==="r32"?('data-gclear-r32="'+i+'"'):('data-gclearkomatch="'+round+'|'+i+'"');
  // A side is "set" for push if it resolves to a real team OR is explicitly TBD.
  const bothReal=(slot.home.team||ov.home==="TBD")&&(slot.away.team||ov.away==="TBD");
  const hasOverride=!!(ov.home||ov.away);

  return '<div class="brd-match" style="position:relative">'+
      slotSide(slot.home)+
      slotSide(slot.away)+
      globalKoMetaLine(round,i)+
      '<button class="admin-edit-btn" data-gedit-match="'+key+'" title="Override matchup" style="position:absolute;top:2px;right:2px;border:none;background:transparent;cursor:pointer;font-size:11px;color:var(--muted);padding:2px 4px;border-radius:4px;opacity:.6">&#9998;</button>'+
      '<div class="admin-edit-form" id="gedit-'+key+'" style="display:'+(GKO_EDIT===key?'block':'none')+';padding:6px;background:#f5f5f2;border-top:1px solid var(--border)">'+
        '<div style="font-size:9px;color:var(--muted);margin-bottom:3px">Override matchup (alive teams) — pick both sides, then Push:</div>'+
        ovSel('home',ov.home||'')+ovSel('away',ov.away||'')+
        '<div style="display:flex;gap:4px;flex-wrap:wrap">'+
          '<button class="btn-sm"'+(bothReal?'':' disabled')+' '+pushAttr+'>&#11014; Push to all pools</button>'+
          (hasOverride?'<button class="btn-sm btn-danger" '+clearAttr+'>&#10005; Clear</button>':'')+
        '</div>'+
        (hasOverride&&!bothReal?'<div style="font-size:9px;color:var(--muted);margin-top:3px">Set BOTH teams to enable Push.</div>':'')+
      '</div>'+
    '</div>';
}

/* The full Global Results knockout as a visual click-to-set bracket, using the
   corrected cascade (R32 from standings, later rounds from feeding winners).
   Clicking a team sets + pushes the winner to all pools; later rounds cascade. */
function renderGlobalKnockoutBracket(actS,aliveTeams){
  let html='<div class="card" style="padding:12px">'+
    '<div class="card-title" style="margin-bottom:6px">Knockout bracket '+
      '<span style="font-size:11px;font-weight:400;color:var(--muted)">— click a team to set the winner (pushes to all pools)</span></div>'+
    '<div class="notice-blue" style="margin-bottom:8px">Click the winning team to record + push the result to all pools — later rounds cascade from the winners (shown as "Winner M##" until set). Click a set winner to clear it everywhere. Use &#9998; to override a matchup. Nothing changes anyone&#39;s picks.</div>'+
    '<div class="bracket-wrap"><div class="bracket">';
  const roundIds=['r32','r16','qf','sf'];
  const roundLabels={r32:'Round of 32',r16:'Round of 16',qf:'Quarterfinals',sf:'Semifinals'};
  const roundSlots={r32:16,r16:8,qf:4,sf:2};
  roundIds.forEach(function(rid){
    let col='';
    // R32/QF reordered for feeder adjacency; `i` stays the TRUE slot index.
    koDisplaySeq(rid,roundSlots[rid]).forEach(i=>{ col+=globalBracketSlotHtml(rid,i,actS,aliveTeams); });
    html+='<div class="brd-col"><div class="brd-col-title">'+roundLabels[rid]+'<span class="pts">+'+SC.ko[rid].base+' pts</span></div><div class="brd-matches">'+col+'</div></div>';
  });
  // 3rd-place column (SF losers) — reuses the generic global slot (click-to-set + push).
  html+='<div class="brd-col"><div class="brd-col-title">3rd-place<span class="pts">+'+SC.ko.third.base+' pts</span></div><div class="brd-matches">'+globalBracketSlotHtml('third',0,actS,aliveTeams)+'</div></div>';
  html+=globalBracketFinalHtml(actS,aliveTeams);
  html+='</div></div></div>';
  return html;
}

/* Push a single match result to EVERY pool's results node. type:"group"|"ko".
   value=null clears (removes) that key. Writes ONLY the specific result path —
   never user/pick/settings data. Calls cb(err,poolCount). */
function pushResultToAllPools(type,key,value,cb){
  if(!db){ cb&&cb("Firebase not initialized"); return; }
  db.ref("pools").once("value").then(snap=>{
    const pools=snap.val()||{};
    const codes=Object.keys(pools).filter(c=>!!pools[c]); // global pushes reach ALL pools (incl. sandbox)
    const updates={};
    codes.forEach(code=>{ updates["pools/"+code+"/results/"+type+"/"+key]=value; });
    return db.ref().update(updates).then(()=>cb&&cb(null,codes.length));
  }).catch(e=>cb&&cb(e.message));
}

/* Push every entered group + ko result AND the knockout matchup board
   (koMatches) to all pools in one atomic update. The matchup board is what
   Round 2 players pick against, so it propagates with the results. */
function pushAllResultsToAllPools(cb){
  if(!db){ cb&&cb("Firebase not initialized"); return; }
  db.ref("pools").once("value").then(snap=>{
    const pools=snap.val()||{};
    const codes=Object.keys(pools).filter(c=>!!pools[c]); // global pushes reach ALL pools (incl. sandbox)
    const updates={};
    // Only push matchup slots that actually have both teams set.
    const km=ST.results.koMatches||{};
    let kmCount=0;
    codes.forEach(code=>{
      Object.keys(ST.results.group).forEach(k=>{ updates["pools/"+code+"/results/group/"+k]=ST.results.group[k]; });
      Object.keys(ST.results.ko).forEach(k=>{ updates["pools/"+code+"/results/ko/"+k]=ST.results.ko[k]; });
      Object.keys(km).forEach(rnd=>{
        const arr=km[rnd]||[];
        Object.keys(arr).forEach(idx=>{
          const m=arr[idx];
          if(m&&m.home&&m.away){ updates["pools/"+code+"/results/koMatches/"+rnd+"/"+idx]={home:m.home,away:m.away}; }
        });
      });
    });
    Object.keys(km).forEach(rnd=>{ const arr=km[rnd]||[]; Object.keys(arr).forEach(idx=>{ const m=arr[idx]; if(m&&m.home&&m.away) kmCount++; }); });
    if(!Object.keys(updates).length){ cb&&cb(null,0,0); return; }
    const resCount=Object.keys(ST.results.group).length+Object.keys(ST.results.ko).length+kmCount;
    return db.ref().update(updates).then(()=>cb&&cb(null,codes.length,resCount));
  }).catch(e=>cb&&cb(e.message));
}

/* Push a single knockout matchup slot (e.g. koMatches.r32[i]={home,away}) to
   every pool. value=null clears it. Writes ONLY that matchup path. */
function pushKoMatchToAllPools(round,i,value,cb){
  if(!db){ cb&&cb("Firebase not initialized"); return; }
  db.ref("pools").once("value").then(snap=>{
    const pools=snap.val()||{};
    const codes=Object.keys(pools).filter(c=>!!pools[c]); // global pushes reach ALL pools (incl. sandbox)
    const updates={};
    codes.forEach(code=>{ updates["pools/"+code+"/results/koMatches/"+round+"/"+i]=value; });
    return db.ref().update(updates).then(()=>cb&&cb(null,codes.length));
  }).catch(e=>cb&&cb(e.message));
}

/* Clear ALL knockout winners (results.ko) and the matchup board
   (results.koMatches) from EVERY pool in one atomic update. Group results,
   users, picks, submitted flags, scores, and settings are untouched. Since
   scores are computed, KO points return to zero once results.ko is empty. */
function clearAllKnockoutFromAllPools(cb){
  if(!db){ cb&&cb("Firebase not initialized"); return; }
  db.ref("pools").once("value").then(snap=>{
    const pools=snap.val()||{};
    const codes=Object.keys(pools).filter(c=>!!pools[c]); // global pushes reach ALL pools (incl. sandbox)
    if(!codes.length){ cb&&cb(null,0); return; }
    const updates={};
    codes.forEach(code=>{
      updates["pools/"+code+"/results/ko"]=null;
      updates["pools/"+code+"/results/koMatches"]=null;
    });
    return db.ref().update(updates).then(()=>cb&&cb(null,codes.length));
  }).catch(e=>cb&&cb(e.message));
}

function bindGlobalResults(){
  const back=document.getElementById("grBack");
  if(back) back.onclick=closeGlobalResults;
  const setMsg=(t,ok)=>{
    GLOBAL_MSG={text:t,ok:ok};
    const msgEl=document.getElementById("grMsg");
    if(msgEl){ msgEl.style.color=ok?"var(--green)":"var(--red)"; msgEl.textContent=t; }
  };
  const poolCount=GLOBAL_POOLS.length;
  const playerCount=GLOBAL_POOLS.reduce((s,p)=>s+(p.players||0),0);

  // Group selectors / goals — mutate the working copy only (push is explicit).
  document.querySelectorAll("[data-ggr]").forEach(sel=>{
    sel.onchange=()=>{
      const mid=sel.dataset.ggr;
      if(sel.value){
        const ex=ST.results.group[mid];
        if(ex&&typeof ex==="object"){ ex.result=sel.value; ST.results.group[mid]=ex; }
        else ST.results.group[mid]={result:sel.value,hg:"",ag:""};
      } else delete ST.results.group[mid];
    };
  });
  document.querySelectorAll("[data-ggrg]").forEach(inp=>{
    inp.oninput=()=>{
      const mid=inp.dataset.ggrg, side=inp.dataset.side;
      if(!ST.results.group[mid]||typeof ST.results.group[mid]==="string"){
        const old=ST.results.group[mid]||""; ST.results.group[mid]={result:old,hg:"",ag:""};
      }
      const val=inp.value===""?"":parseInt(inp.value)||0;
      if(side==="h") ST.results.group[mid].hg=val; else ST.results.group[mid].ag=val;
    };
  });
  // KO winner selectors.
  document.querySelectorAll("[data-gko]").forEach(sel=>{
    sel.onchange=()=>{
      const key=sel.dataset.gko;
      if(sel.value) ST.results.ko[key]=sel.value; else delete ST.results.ko[key];
    };
  });

  // Visual bracket: click a team to set the winner (toggle to clear) and push it
  // to all pools. Optimistic local update + immediate re-render so the cascade
  // flows instantly; on push error we revert and re-render.
  document.querySelectorAll("[data-gkowin]").forEach(el=>{
    el.onclick=(e)=>{
      e.stopPropagation();
      const key=el.dataset.gkowin, team=el.dataset.gkoteam;
      if(!team) return;
      const clearing=ST.results.ko[key]===team;
      const value=clearing?null:team;
      if(clearing) delete ST.results.ko[key]; else ST.results.ko[key]=team;
      render(); // optimistic: show the new winner + cascade right away
      pushResultToAllPools("ko",key,value,(err,n)=>{
        if(err){
          if(clearing) ST.results.ko[key]=team; else delete ST.results.ko[key]; // revert
          setMsg("Push failed: "+err,false); render(); return;
        }
        setMsg((clearing?"✓ Cleared winner ("+key+")":"✓ Set winner "+team+" ("+key+")")+" across "+n+" pool"+(n!==1?"s":"")+".",true);
      });
    };
  });
  // Pencil ✎ — toggle a match's matchup-override form.
  document.querySelectorAll("[data-gedit-match]").forEach(btn=>{
    btn.onclick=(e)=>{
      e.stopPropagation();
      const key=btn.dataset.geditMatch;
      GKO_EDIT=(GKO_EDIT===key)?null:key; // track open form so it survives re-renders
      render();
    };
  });

  // R32 per-side override dropdowns — stage into the working copy only (blank =
  // clear that side back to auto-derive). No re-render here, so the pencil edit
  // form stays open while both sides are set; the explicit Push applies + renders.
  document.querySelectorAll("[data-gr32side]").forEach(sel=>{
    sel.onchange=()=>{
      const [iStr,side]=sel.dataset.gr32side.split("|");
      const i=parseInt(iStr,10);
      if(!ST.results.koMatches.r32) ST.results.koMatches.r32=[];
      if(!ST.results.koMatches.r32[i]) ST.results.koMatches.r32[i]={home:"",away:""};
      ST.results.koMatches.r32[i][side]=sel.value||"";
      const slot=ST.results.koMatches.r32[i];
      if(!slot.home&&!slot.away) delete ST.results.koMatches.r32[i]; // fully auto again
      // Re-render so the bracket reflects the override and Push enables once both
      // sides are set. GKO_EDIT keeps this slot's form open across the re-render.
      GKO_EDIT="r32_"+i; render();
    };
  });
  // Push a single R32 matchup (both teams) to all pools.
  document.querySelectorAll("[data-gpush-r32]").forEach(btn=>{
    btn.onclick=()=>{
      const i=parseInt(btn.dataset.gpushR32,10);
      const slot=resolveR32Slot(i,actualStandings());
      const ov=(ST.results.koMatches.r32&&ST.results.koMatches.r32[i])||{};
      const home=slot.home.team||(ov.home==="TBD"?"TBD":null);
      const away=slot.away.team||(ov.away==="TBD"?"TBD":null);
      if(!home||!away){ setMsg("Both sides must be set (a team, TBD, or auto-derived) before pushing.",false); return; }
      const sch=R32_SCHEDULE[i]||{};
      const label=(sch.m?"M"+sch.m+" ":"")+home+" vs "+away;
      showConfirmModal('Push matchup "'+label+'" to all '+poolCount+' pools? This sets the Round 2 matchup for all '+playerCount+' players. It does NOT change anyone’s picks.',()=>{
        btn.disabled=true; btn.textContent="Pushing...";
        if(!ST.results.koMatches.r32) ST.results.koMatches.r32=[];
        ST.results.koMatches.r32[i]={home:home,away:away};
        pushKoMatchToAllPools("r32",i,{home:home,away:away},(err,n)=>{
          if(err){ setMsg("Push failed: "+err,false); btn.disabled=false; btn.innerHTML="&#11014; Push matchup"; return; }
          setMsg("✓ Pushed matchup "+label+" to "+n+" pool"+(n!==1?"s":"")+".",true); GKO_EDIT=null; render();
        });
      });
    };
  });
  // Clear an R32 manual override (reverts the slot to auto-derive) everywhere.
  document.querySelectorAll("[data-gclear-r32]").forEach(btn=>{
    btn.onclick=()=>{
      const i=parseInt(btn.dataset.gclearR32,10);
      showConfirmModal('Clear the manual matchup override for this slot from all '+poolCount+' pools? It will revert to auto-derive from standings.',()=>{
        pushKoMatchToAllPools("r32",i,null,(err,n)=>{
          if(err){ setMsg("Clear failed: "+err,false); return; }
          if(ST.results.koMatches.r32) delete ST.results.koMatches.r32[i];
          setMsg("✓ Cleared override from "+n+" pool"+(n!==1?"s":"")+".",true); GKO_EDIT=null; render();
        });
      });
    };
  });

  // Later-round (r16/qf/sf/final) per-side override dropdowns — stage into the
  // working copy only (no re-render; explicit Push applies + renders).
  document.querySelectorAll("[data-gkoside]").forEach(sel=>{
    sel.onchange=()=>{
      const [round,iStr,side]=sel.dataset.gkoside.split("|");
      const i=parseInt(iStr,10);
      if(!ST.results.koMatches[round]) ST.results.koMatches[round]=[];
      if(!ST.results.koMatches[round][i]) ST.results.koMatches[round][i]={home:"",away:""};
      ST.results.koMatches[round][i][side]=sel.value||"";
      const slot=ST.results.koMatches[round][i];
      if(!slot.home&&!slot.away) delete ST.results.koMatches[round][i]; // fully auto again
      // Re-render so the bracket reflects the override and Push enables; keep form open.
      GKO_EDIT=round+"_"+i; render();
    };
  });
  // Push a single later-round matchup (both teams) to all pools.
  document.querySelectorAll("[data-gpushkomatch]").forEach(btn=>{
    btn.onclick=()=>{
      const [round,iStr]=btn.dataset.gpushkomatch.split("|");
      const i=parseInt(iStr,10);
      const slot=resolveKoLaterSlot(round,i);
      const ov=(ST.results.koMatches[round]&&ST.results.koMatches[round][i])||{};
      const home=slot.home.team||(ov.home==="TBD"?"TBD":null);
      const away=slot.away.team||(ov.away==="TBD"?"TBD":null);
      if(!home||!away){ setMsg("Both sides must be set (a team, TBD, or auto-derived) before pushing.",false); return; }
      const mn=koMatchNumber(round,i);
      const label=(mn?"M"+mn+" ":"")+home+" vs "+away;
      showConfirmModal('Push matchup "'+label+'" to all '+poolCount+' pools? This sets the matchup for all '+playerCount+' players. It does NOT change anyone’s picks.',()=>{
        btn.disabled=true; btn.textContent="Pushing...";
        if(!ST.results.koMatches[round]) ST.results.koMatches[round]=[];
        ST.results.koMatches[round][i]={home:home,away:away};
        pushKoMatchToAllPools(round,i,{home:home,away:away},(err,n)=>{
          if(err){ setMsg("Push failed: "+err,false); btn.disabled=false; btn.innerHTML="&#11014; Push matchup"; return; }
          setMsg("✓ Pushed matchup "+label+" to "+n+" pool"+(n!==1?"s":"")+".",true); GKO_EDIT=null; render();
        });
      });
    };
  });
  // Clear a later-round manual override (reverts to cascade) everywhere.
  document.querySelectorAll("[data-gclearkomatch]").forEach(btn=>{
    btn.onclick=()=>{
      const [round,iStr]=btn.dataset.gclearkomatch.split("|");
      const i=parseInt(iStr,10);
      showConfirmModal('Clear the manual matchup override for this slot from all '+poolCount+' pools? It will revert to cascade from earlier results.',()=>{
        pushKoMatchToAllPools(round,i,null,(err,n)=>{
          if(err){ setMsg("Clear failed: "+err,false); return; }
          if(ST.results.koMatches[round]) delete ST.results.koMatches[round][i];
          setMsg("✓ Cleared override from "+n+" pool"+(n!==1?"s":"")+".",true); GKO_EDIT=null; render();
        });
      });
    };
  });

  // Per-match push (group)
  document.querySelectorAll("[data-gpush-group]").forEach(btn=>{
    btn.onclick=()=>{
      const mid=btn.dataset.gpushGroup;
      const val=ST.results.group[mid];
      if(!val||(typeof val==="object"&&!val.result)){ setMsg("Set a result for this match first.",false); return; }
      const gm=findGM(mid);
      const label=gm?gm.home+" vs "+gm.away:mid;
      showConfirmModal('Push "'+label+'" result to all '+poolCount+' pools? This updates results for all '+playerCount+' players.',()=>{
        btn.disabled=true; btn.textContent="Pushing...";
        pushResultToAllPools("group",mid,val,(err,n)=>{
          if(err){ setMsg("Push failed: "+err,false); btn.disabled=false; btn.innerHTML="&#11014; Push"; return; }
          setMsg("✓ Pushed "+label+" to "+n+" pool"+(n!==1?"s":"")+".",true); render();
        });
      });
    };
  });
  // Per-match clear (group)
  document.querySelectorAll("[data-gclear-group]").forEach(btn=>{
    btn.onclick=()=>{
      const mid=btn.dataset.gclearGroup;
      const gm=findGM(mid); const label=gm?gm.home+" vs "+gm.away:mid;
      showConfirmModal('Clear "'+label+'" result from all '+poolCount+' pools?',()=>{
        pushResultToAllPools("group",mid,null,(err,n)=>{
          if(err){ setMsg("Clear failed: "+err,false); return; }
          delete ST.results.group[mid];
          setMsg("✓ Cleared "+label+" from "+n+" pool"+(n!==1?"s":"")+".",true); render();
        });
      });
    };
  });
  // Per-match push (ko)
  document.querySelectorAll("[data-gpush-ko]").forEach(btn=>{
    btn.onclick=()=>{
      const key=btn.dataset.gpushKo;
      const val=ST.results.ko[key];
      if(!val){ setMsg("Pick the winner for this match first.",false); return; }
      showConfirmModal('Push "'+val+'" (winner) to all '+poolCount+' pools? This updates results for all '+playerCount+' players.',()=>{
        btn.disabled=true; btn.textContent="Pushing...";
        pushResultToAllPools("ko",key,val,(err,n)=>{
          if(err){ setMsg("Push failed: "+err,false); btn.disabled=false; btn.innerHTML="&#11014; Push"; return; }
          setMsg("✓ Pushed winner "+val+" to "+n+" pool"+(n!==1?"s":"")+".",true); render();
        });
      });
    };
  });
  // Per-match clear (ko)
  document.querySelectorAll("[data-gclear-ko]").forEach(btn=>{
    btn.onclick=()=>{
      const key=btn.dataset.gclearKo;
      showConfirmModal('Clear this knockout result from all '+poolCount+' pools?',()=>{
        pushResultToAllPools("ko",key,null,(err,n)=>{
          if(err){ setMsg("Clear failed: "+err,false); return; }
          delete ST.results.ko[key];
          setMsg("✓ Cleared knockout result from "+n+" pool"+(n!==1?"s":"")+".",true); render();
        });
      });
    };
  });

  // Bulk push-all
  const pushAll=document.getElementById("grPushAll");
  if(pushAll) pushAll.onclick=()=>{
    const nG=Object.keys(ST.results.group).filter(k=>{const v=ST.results.group[k];return v&&(typeof v!=="object"||v.result);}).length;
    const nK=Object.keys(ST.results.ko).length;
    if(!nG&&!nK){ setMsg("No results entered yet.",false); return; }
    showConfirmModal('Push all '+(nG+nK)+' entered result'+((nG+nK)!==1?'s':'')+' to all '+poolCount+' pools? This updates results for all '+playerCount+' players.',()=>{
      pushAll.disabled=true; pushAll.textContent="Pushing...";
      pushAllResultsToAllPools((err,n,cnt)=>{
        if(err){ setMsg("Push failed: "+err,false); pushAll.disabled=false; pushAll.innerHTML="&#11014; Push ALL entered results to all pools"; return; }
        setMsg("✓ Pushed "+cnt+" result"+(cnt!==1?"s":"")+" to "+n+" pool"+(n!==1?"s":"")+".",true); render();
      });
    });
  };

  // Clear ALL knockout winners + matchups from every pool (fixes phantom KO points).
  const clearKo=document.getElementById("grClearKo");
  if(clearKo) clearKo.onclick=()=>{
    showConfirmModal('Clear ALL knockout winners AND matchups from all '+poolCount+' pools? This removes every knockout result everywhere (knockout points return to zero). Group results and everyone’s picks are untouched. This cannot be undone.',()=>{
      clearKo.disabled=true; clearKo.textContent="Clearing...";
      clearAllKnockoutFromAllPools((err,n)=>{
        if(err){ setMsg("Clear failed: "+err,false); clearKo.disabled=false; clearKo.innerHTML="&#128465; Clear ALL knockout results (all pools)"; return; }
        // Reset the working copy so the bracket + standings reflect the clear.
        ST.results.ko={}; ST.results.koMatches={};
        setMsg("✓ Cleared all knockout results + matchups from "+n+" pool"+(n!==1?"s":"")+". Knockout points are now zero.",true);
        render();
      });
    });
  };
}

/* Find a group match descriptor by its match id (e.g. "A_0_1"). */
function findGM(mid){
  const g=mid.split("_")[0];
  if(!GM[g]) return null;
  return GM[g].find(m=>m.id===mid)||null;
}

  if(pr===3){
    const sub3=getUserRound(CU.key,3).submitted;
    return renderRoundToggle(pr)+renderFinalPickOnly(draft,sub3,pr);
  }

  const submitted=getUserRound(CU.key,pr).submitted;

  // If Round 2+ is open but user never submitted Round 1, show error
  if(pr>1 && !getUserRound(CU.key,pr-1).submitted){
    return '<div class="notice-red"><strong>Complete Round '+(pr-1)+' first.</strong> You must submit your Round '+(pr-1)+' predictions before Round '+pr+' opens for you.</div>';
  }

  let html='';

  // Always show round toggle at top so user can review prior rounds
  html+=renderRoundToggle(pr);

  if(submitted){
    // Submitted — show locked read-only view with confirmation banner
    html+=
      '<div class="submit-confirm-banner">'+
        '<div class="submit-confirm-icon">&#9989;</div>'+
        '<div class="submit-confirm-text">'+
          '<div class="submit-confirm-title">Round '+pr+' predictions locked!</div>'+
          '<div class="submit-confirm-sub">'+
            (pr===1?'Your picks are saved and locked. Admin will open Round 2 after the group stage ends — you\'ll see it appear here.':
             pr===2?'Your bracket revisions are locked. Admin will open Round 3 once the semi-finals are played.':'')+
          '</div>'+
        '</div>'+
      '</div>';
    if(pr===1) html+=renderGroupPicks(draft,true)+renderBracket(draft,true,pr,koScoreMeta(CU.key));
    else html+=renderBracket(draft,true,pr,koScoreMeta(CU.key));
  } else {
    // Active — show picks with submit button
    const subText=pr===1?'Pick groups + full bracket — locked once you submit.':'Group stage locked — revise your full bracket then submit.';
    html+='<div class="pr-bar"><div><div class="pr-title">Prediction Round '+pr+' of 3</div><div class="pr-sub">'+subText+'</div></div><div id="missCount"></div></div>';
    if(pr===1) html+=renderGroupPicks(draft,false)+renderBracket(draft,false,pr,koScoreMeta(CU.key));
    else html+=renderBracket(draft,false,pr,koScoreMeta(CU.key));
    html+='<div id="submitArea"></div>';
  }
  return html;
}

// Render the round tabs toggle — lets user view submitted rounds and current active round
function renderRoundToggle(activePr){
  const maxRound=ST.predRound;
  // Only show toggle if more than one round is relevant
  if(maxRound===1 && !getUserRound(CU.key,1).submitted) return '';
  let html='<div class="round-toggle">';
  for(let r=1;r<=3;r++){
    const sub=getUserRound(CU.key,r).submitted;
    const isActive=(r===activePr);
    const isAvailable=(r<=maxRound);
    if(!isAvailable) continue;
    const label=r===3?'Final Pick':'Round '+r;
    const status=sub?'&#9989;':'&#9998;';
    html+='<button class="round-tab'+(isActive?' round-tab-active':'')+'" data-viewround="'+r+'" '+(isAvailable?'':'disabled')+'>'+
      status+' '+label+
    '</button>';
  }
  html+='</div>';
  return html;
}


function renderFinalPickOnly(draft,submitted,pr,forceLocked){
  var adminFinal=(ST.results.koMatches['final']&&ST.results.koMatches['final'][0])||null;
  // Derive finalists from SF results if not manually set
  var finalA=adminFinal?adminFinal.home:(ST.results.ko['sf_0']||null);
  var finalB=adminFinal?adminFinal.away:(ST.results.ko['sf_1']||null);
  var pickRaw=(draft.ko&&draft.ko['final_0'])||null;
  var pick=pickRaw?(typeof pickRaw==='object'?pickRaw.team:pickRaw):null;
  var result=ST.results.ko['final_0']||null;
  var sc=SC.ko['final'];
  var bonus=sc.bonus[pr-1]||0;
  var html="";

  if(submitted){
    html+="<div class=\"notice-green\"><strong>Round 3 submitted!</strong> Your champion pick is locked. Good luck!</div>";
  } else if(!forceLocked){
    html+="<div class=\"pr-bar\"><div><div class=\"pr-title\">Prediction Round 3 of 3 &#8212; The Final</div>";
    html+="<div class=\"pr-sub\">Pick your World Cup champion from the two finalists.</div></div></div>";
  }

  html+="<div class=\"card\" style=\"text-align:center;padding:28px 20px\">";
  html+="<div class=\"winner-crown\" style=\"font-size:48px;margin-bottom:8px\">&#127942;</div>";
  html+="<div class=\"final-champion-title\">World Cup Champion</div>";
  html+="<div style=\"font-size:12px;color:var(--muted);margin-bottom:20px\">+"+sc.base+" pts base"+(bonus>0?" + +"+bonus+" Round 3 bonus":"")+" if correct</div>";

  if(!finalA||!finalB){
    html+="<div class=\"notice-blue\" style=\"text-align:left\">The two finalists will appear here automatically once the semi-final results are entered. Check back after the semi-finals! Admin will unlock Round 3 once the SF matches are played.</div>";
  } else {
    function finalCls(team){
      if(!team) return "";
      if(result){if(team===result&&pick===team)return "correct";if(team===pick&&team!==result)return "wrong";}
      if(pick===team) return "selected";
      return "";
    }
    // The pick stays open until the player submits it, or this is a read-only
    // view. Neither the final RESULT being entered nor the tournament being
    // marked complete locks an unsubmitted player out — otherwise a straggler
    // who never submitted Round 3 could never complete it.
    var dis=submitted||forceLocked;
    html+="<div style=\"display:flex;gap:16px;justify-content:center;flex-wrap:wrap;margin-bottom:16px\">";

    function teamCard(team){
      var cls=finalCls(team);
      var borderColor=pick===team?"var(--navy)":cls==="correct"?"var(--green)":cls==="wrong"?"var(--red)":"var(--border)";
      var bg=pick===team?"var(--navy)":cls==="correct"?"#e8f5ee":cls==="wrong"?"#fdecea":"var(--card)";
      var textColor=pick===team?"#fff":cls==="correct"?"var(--green)":cls==="wrong"?"var(--red)":"var(--text)";
      var card="<div class=\"final-pick-card "+cls+"\"";
      if(!dis) card+=" data-ko=\"final_0\" data-team=\""+team+"\"";
      card+=" style=\"min-width:140px;flex:1;max-width:200px;border:2px solid "+borderColor+";border-radius:12px;padding:20px 12px;";
      card+="cursor:"+(dis?"default":"pointer")+";background:"+bg+";transition:all .15s\">";
      card+="<div style=\"font-size:24px;margin-bottom:8px\">&#127941;</div>";
      card+="<div style=\"font-size:15px;font-weight:600;color:"+textColor+"\">"+team+"</div>";
      if(pick===team&&!result) card+="<div style=\"font-size:11px;color:#aac;margin-top:4px\">Your pick &#10003;</div>";
      if(result===team) card+="<div style=\"font-size:11px;color:var(--green);margin-top:4px;font-weight:600\">&#127942; Champions!</div>";
      card+="</div>";
      return card;
    }

    html+=teamCard(finalA);
    html+="<div style=\"display:flex;align-items:center;font-family:Bebas Neue,sans-serif;font-size:28px;color:var(--muted);padding:0 4px\">VS</div>";
    html+=teamCard(finalB);
    html+="</div>";
  }

  if(!submitted&&finalA&&finalB&&!forceLocked){
    if(!pick){
      html+="<div class=\"notice-red\" style=\"margin-bottom:8px\">Pick your champion to submit.</div>";
      html+="<button class=\"btn-submit\" disabled>Submit Final Pick</button>";
    } else {
      html+="<div class=\"notice-green\" style=\"margin-bottom:8px\">You picked <strong>"+pick+"</strong> to win the World Cup!</div>";
      html+="<button class=\"btn-submit\" id=\"submitBtn\">Submit Final Pick &#8212; Lock It In</button>";
    }
    html+="<p style=\"font-size:11px;color:var(--muted);margin-top:8px\">Once submitted your final pick is permanently locked.</p>";
  }

  html+="</div>";

  // ── 3rd-place pick (R2/R3): the two SF LOSERS ──
  var t3teams=getKOMatchTeams('third',0);
  var t3a=t3teams?t3teams.home:null, t3b=t3teams?t3teams.away:null;
  var t3raw=(draft.ko&&draft.ko['third_0'])||null;
  var t3pick=t3raw?(typeof t3raw==='object'?t3raw.team:t3raw):null;
  var t3res=ST.results.ko['third_0']||null;
  var tsc=SC.ko['third']; var tbonus=tsc.bonus[pr-1]||0;
  var t3dis=submitted||forceLocked;
  html+="<div class=\"card\" style=\"text-align:center;padding:20px\">";
  html+="<div style=\"font-size:30px;margin-bottom:4px\">&#129353;</div>";
  html+="<div class=\"final-champion-title\" style=\"font-size:16px\">3rd-Place Match</div>";
  html+="<div style=\"font-size:12px;color:var(--muted);margin-bottom:16px\">+"+tsc.base+" pts base"+(tbonus>0?" + +"+tbonus+" Round "+pr+" bonus":"")+" if correct &middot; the two semi-final losers</div>";
  if(!t3a||t3a==='TBD'||!t3b||t3b==='TBD'){
    html+="<div class=\"notice-blue\" style=\"text-align:left\">The two semi-final losers will appear here automatically once the semi-final results are entered.</div>";
  } else {
    var t3cls=function(team){ if(!team)return""; if(t3res){if(team===t3res&&t3pick===team)return"correct";if(team===t3pick&&team!==t3res)return"wrong";} if(t3pick===team)return"selected"; return""; };
    html+="<div style=\"display:flex;gap:16px;justify-content:center;flex-wrap:wrap\">";
    [t3a,t3b].forEach(function(team){
      var cls=t3cls(team);
      var borderColor=t3pick===team?"var(--navy)":cls==="correct"?"var(--green)":cls==="wrong"?"var(--red)":"var(--border)";
      var bg=t3pick===team?"var(--navy)":cls==="correct"?"#e8f5ee":cls==="wrong"?"#fdecea":"var(--card)";
      var textColor=t3pick===team?"#fff":cls==="correct"?"var(--green)":cls==="wrong"?"var(--red)":"var(--text)";
      var card="<div class=\"final-pick-card "+cls+"\"";
      if(!t3dis) card+=" data-ko=\"third_0\" data-team=\""+team+"\"";
      card+=" style=\"min-width:120px;flex:1;max-width:180px;border:2px solid "+borderColor+";border-radius:12px;padding:16px 12px;cursor:"+(t3dis?"default":"pointer")+";background:"+bg+"\">";
      card+="<div style=\"font-size:14px;font-weight:600;color:"+textColor+"\">"+team+"</div>";
      if(t3pick===team&&!t3res) card+="<div style=\"font-size:11px;color:#aac;margin-top:4px\">Your pick &#10003;</div>";
      if(t3res===team) card+="<div style=\"font-size:11px;color:var(--green);margin-top:4px;font-weight:600\">&#129353; 3rd place!</div>";
      card+="</div>";
      html+=card;
    });
    html+="</div>";
  }
  html+="</div>";

  return html;
}


function renderGroupPicks(draft,locked){
  let html=`<div class="card">
    <div class="card-title">Group stage ${locked?'<span style="font-size:11px;font-weight:400;color:var(--muted)">locked</span>':''}</div>
    <div class="notice">+2 correct (incl. a correct draw) &nbsp;|&nbsp; -1 wrong — pick the exact result for every match</div>
    <div class="group-grid">`;
  for(const g in GM){
    html+=`<div class="g-card"><div class="g-label">Group ${g}</div>`;
    for(const m of GM[g]){
      const p=(draft.group&&draft.group[m.id])||null;
      const res=ST.results.group[m.id]||null;
      let chip="";
      const resVal=res?(typeof res==="object"?res.result:res):null;
      if(locked&&resVal&&p) chip=p===resVal?'<span class="chip chip-ok">&#10003;</span>':'<span class="chip chip-no">&#10007;</span>';
      const hg2=res&&typeof res==="object"?res.hg:"";
      const ag2=res&&typeof res==="object"?res.ag:"";
      const scoreDisp=(hg2!==""&&ag2!=="")?' <span style="font-size:9px;color:var(--muted)">'+hg2+'-'+ag2+'</span>':"";
      const wc=p==="W"?(resVal&&locked?(resVal==="W"?"ok-W":"wrong-W"):"sel-W"):"";
      const dc=p==="D"?(resVal&&locked?(resVal==="D"?"ok-D":"wrong-D"):"sel-D"):"";
      const lc=p==="L"?(resVal&&locked?(resVal==="L"?"ok-L":"wrong-L"):"sel-L"):"";
      const dis=locked?"disabled":"";
      html+=`<div class="match">
        <button class="pbtn pbtn-team ${wc}" data-gp="${m.id}" data-v="W" ${dis} title="${m.home} to win">${m.home}</button>
        <button class="pbtn pbtn-draw ${dc}" data-gp="${m.id}" data-v="D" ${dis}>Draw</button>
        <button class="pbtn pbtn-team ${lc}" data-gp="${m.id}" data-v="L" ${dis} title="${m.away} to win">${m.away}</button>
        ${chip}
      </div>`;
    }
    html+=`</div>`;
  }
  return html+`</div></div>`;
}

/* ══ BRACKET ══ */
function renderBracket(draft,locked,pr,meta){
  meta=meta||{};
  const open=PR_OPEN[pr]||[];
  const isR1=(pr===1);
  const standings=isR1?predictedStandings(draft.group||{}):null;

  function getR1R32Match(i){
    const seed=R32_SEEDS[i];
    const ta=slotTeam(seed.a,standings);
    const tb=slotTeam(seed.b,standings);
    const labelA=seedLabel(seed.a);
    const labelB=seedLabel(seed.b);
    const t3CandidatesA=seed.a.t==="T3"?getT3Candidates(i,standings):null;
    const t3CandidatesB=seed.b.t==="T3"?getT3Candidates(i,standings):null;
    const isT3MatchA=seed.a.t==="T3";
    const isT3MatchB=seed.b.t==="T3";
    return{home:ta||null,away:tb||null,labelA,labelB,t3CandidatesA,t3CandidatesB,isT3MatchA,isT3MatchB};
  }

  function getAdminMatch(rnd,i){
    const ms=ST.results.koMatches[rnd]||[];
    const m=ms[i];
    if(m&&m.home&&m.away) return{home:m.home,away:m.away};
    return null;
  }

  function matchHTML(roundId,idx,teamA,teamB,pickTeam,isOpen,isLocked,result,lblA,lblB,isT3A,isT3B,t3CandA,t3CandB){
    const key=roundId+'_'+idx;
    const sc=SC.ko[roundId];
    const bonus=sc&&isOpen?(sc.bonus[pr-1]||0):0;
    const bonusTxt=bonus>0?'+'+bonus+'b':'';

    if(isT3A||isT3B){
      const knownTeam=isT3A?teamB:teamA;
      const knownLabel=isT3A?lblB:lblA;
      const t3Cands=isT3A?t3CandA:t3CandB;
      const t3Label=isT3A?lblA:lblB;
      const dis=!isOpen||isLocked;
      const t3PickKey=key+'_t3';
      const t3PickedTeam=(draft.ko&&draft.ko[t3PickKey])||null;
      const winnerPickObj=(draft.ko&&draft.ko[key])||null;
      const winnerPicked=winnerPickObj?(typeof winnerPickObj==='object'?winnerPickObj.team:winnerPickObj):null;
      let t3Select='';
      if(!dis){
        if(!t3Cands||t3Cands.length===0){
          t3Select='<span style="font-size:10px;color:var(--muted);font-style:italic">Finish picking groups '+t3Label.replace('Best 3rd: ','')+'</span>';
        } else {
          // Collect all T3 teams already picked in OTHER slots
          const alreadyPickedT3=[];
          if(draft.ko){
            Object.keys(T3_SLOTS).forEach(function(slotIdx){
              const otherKey='r32_'+slotIdx+'_t3';
              if(otherKey!==t3PickKey&&draft.ko[otherKey]){
                alreadyPickedT3.push(draft.ko[otherKey]);
              }
            });
          }
          t3Select='<select class="t3-sel" data-t3key="'+t3PickKey+'" onclick="event.stopPropagation()" style="font-size:10px;padding:2px 4px;border:1px solid var(--gold);border-radius:4px;background:#fdf6e3;color:#3a2800;max-width:140px;cursor:pointer">';
          t3Select+='<option value="">Pick 3rd place team...</option>';
          t3Cands.forEach(function(c){
            const takenByOther=alreadyPickedT3.includes(c.team);
            if(!takenByOther||c.team===t3PickedTeam){
              t3Select+='<option value="'+c.team+'"'+(t3PickedTeam===c.team?' selected':'')+'>('+c.group+') '+c.team+'</option>';
            }
          });
          t3Select+='</select>';
        }
      } else {
        t3Select='<span style="font-size:10px;color:var(--muted);font-style:italic">'+(t3PickedTeam||t3Label)+'</span>';
      }
      const knownDisp=knownTeam||('<em style="color:var(--muted);font-size:10px">'+(knownLabel||'TBD')+'</em>');
      const knownSel=winnerPicked===knownTeam&&knownTeam?'selected':'';
      const t3Sel=winnerPicked==='__t3__'?'selected':'';
      let chip='';
      if(result){const myW=winnerPicked==='__t3__'?t3PickedTeam:winnerPicked;if(myW&&myW===result)chip='<span class="chip chip-ok">&#10003;</span>';else if(myW)chip='<span class="chip chip-no">&#10007;</span>';}
      return '<div class="brd-match">'+
        '<div class="brd-slot '+knownSel+(!dis&&knownTeam?' hoverable':'')+(dis?' disabled':'')+'" data-ko="'+key+'" data-team="'+(knownTeam||'')+'">'+
          '<span class="slot-name" title="'+(knownTeam||'')+'">'+knownDisp+'</span>'+
          (bonus&&knownSel?'<span class="slot-pts">'+bonusTxt+'</span>':'')+
        '</div>'+
        '<div class="brd-slot '+t3Sel+(dis?' disabled':'')+'" data-ko="'+key+'" data-team="__t3__" style="background:'+(t3Sel?'var(--navy)':'#fffdf0')+'">'+
          '<div style="display:flex;flex-direction:column;gap:3px;padding:1px 0">'+
            (dis
              ? (t3PickedTeam
                  // Locked + team picked: show team name prominently
                  ? '<span style="font-size:11px;font-weight:600;color:'+(t3Sel?'#fff':'var(--navy)')+'">'+t3PickedTeam+'</span>'+
                    '<span style="font-size:9px;color:'+(t3Sel?'rgba(255,255,255,.7)':'var(--muted)')+'">'+t3Label+'</span>'
                  // Locked + no team picked: show label only
                  : '<span style="font-size:9px;color:'+(t3Sel?'#fff':'#7a5c10')+'">'+t3Label+'</span>'+
                    '<span style="font-size:10px;color:'+(t3Sel?'rgba(255,255,255,.6)':'var(--muted)')+';font-style:italic">No pick made</span>'
                )
              // Not locked: show label + dropdown
              : '<span style="font-size:9px;font-weight:600;color:#7a5c10">'+t3Label+'</span>'+t3Select
            )+
          '</div>'+
          (bonus&&t3Sel?'<span class="slot-pts" style="color:'+(t3Sel?'#ffd':'var(--gold)')+'">'+bonusTxt+'</span>':'')+
          chip+
        '</div>'+
        globalKoMetaLine(roundId,idx)+
      '</div>';
    }

    // Standard match. An explicit "TBD" override side is a placeholder, not a
    // pickable team — normalise it to empty so the slot shows TBD and locks.
    if(teamA==="TBD") teamA=null;
    if(teamB==="TBD") teamB=null;
    const pending=!teamA||!teamB;
    const dis2=!isOpen||isLocked||pending||!!result;
    function slotCls(team){
      if(!team) return '';
      if(result){if(team===result&&pickTeam===team)return 'correct';if(team===pickTeam&&team!==result)return 'wrong';if(team===result)return 'correct';}
      if(pickTeam===team) return 'selected';
      return '';
    }
    // Points actually earned (base + bonus) shown once a result is in.
    const pkoStd=draft.ko&&draft.ko[key];
    let pickRoundStd=pkoStd&&typeof pkoStd==='object'?(pkoStd.round||1):1;
    // Prefer the round this team was FIRST locked (merged scoring) so the bonus
    // shown matches what the player actually earned in the points breakdown.
    if(meta[key]&&meta[key].team===pickTeam) pickRoundStd=meta[key].round;
    function earnedLabel(team){
      if(!result||!team||!sc) return '';
      const eb=sc.bonus[pickRoundStd-1]||0;const mx=sc.base+eb;
      if(pickTeam===team&&result===team)
        return '<span style="font-size:9px;color:var(--green);line-height:1.2;text-align:right;flex-shrink:0;margin-left:4px"><b>+'+mx+' pts</b><br>'+sc.base+' base'+(eb>0?' +'+eb+' R'+pickRoundStd+' bonus':'')+'</span>';
      if(pickTeam===team)
        return '<span style="font-size:9px;color:var(--red);line-height:1.2;text-align:right;flex-shrink:0;margin-left:4px"><b>0 pts</b><br>missed '+mx+'</span>';
      return '';
    }
    const dispA=teamA||('<em style="color:var(--muted);font-size:10px">'+(lblA||'TBD')+'</em>');
    const dispB=teamB||('<em style="color:var(--muted);font-size:10px">'+(lblB||'TBD')+'</em>');
    const ptsA=pickTeam===teamA&&teamA&&bonusTxt?'<span class="slot-pts">'+bonusTxt+'</span>':'';
    const ptsB=pickTeam===teamB&&teamB&&bonusTxt?'<span class="slot-pts">'+bonusTxt+'</span>':'';
    const extraA=result?earnedLabel(teamA):ptsA;
    const extraB=result?earnedLabel(teamB):ptsB;
    return '<div class="brd-match'+(isLocked?' locked':'')+'">'+
      '<div class="brd-slot '+slotCls(teamA)+(!pending&&!isLocked&&isOpen&&!result?' hoverable':'')+' '+(dis2?'disabled':'')+'" data-ko="'+key+'" data-team="'+(teamA||'')+'">'+
        '<span class="slot-name" title="'+(teamA||'')+'">'+dispA+'</span>'+extraA+
      '</div>'+
      '<div class="brd-slot '+slotCls(teamB)+(!pending&&!isLocked&&isOpen&&!result?' hoverable':'')+' '+(dis2?'disabled':'')+'" data-ko="'+key+'" data-team="'+(teamB||'')+'">'+
        '<span class="slot-name" title="'+(teamB||'')+'">'+dispB+'</span>'+extraB+
      '</div>'+
      globalKoMetaLine(roundId,idx)+
    '</div>';
  }

  // Build columns
  const cols=[];

  // R32
  const r32Open=open.includes('r32')&&!locked;
  // For R2+, the actual R32 matchups (incl. best-3rd slots) derived from the
  // admin's group results — shared by all users and overriding R1 predictions.
  const actualR32=isR1?null:buildActualR32Matchups();
  let r32html='';
  // R32 visual order groups feeders by their R16 match; `i` is the TRUE slot index.
  for(const i of R32_DISPLAY_ORDER){
    let ta=null,tb=null,pendingLabelA=null,pendingLabelB=null;
    let t3CandA=null,t3CandB=null,isT3A=false,isT3B=false;
    if(isR1){
      const m=getR1R32Match(i);
      ta=m.home;tb=m.away;pendingLabelA=m.labelA;pendingLabelB=m.labelB;
      t3CandA=m.t3CandidatesA;t3CandB=m.t3CandidatesB;isT3A=m.isT3MatchA;isT3B=m.isT3MatchB;
    } else {
      // Admin-set matchup wins; otherwise fall back to the derived actual matchup
      // (covers both W/R slots and the 8 best-3rd slots).
      const m=getAdminMatch('r32',i)||actualR32[i]||null;
      if(m&&m.home&&m.away){ta=m.home;tb=m.away;}
    }
    const pickObj=(draft.ko&&draft.ko['r32_'+i])||null;
    const pick=pickObj?(typeof pickObj==='object'?pickObj.team:pickObj):null;
    const res=ST.results.ko['r32_'+i]||null;
    r32html+=matchHTML('r32',i,ta,tb,pick,r32Open,locked||!r32Open,res,pendingLabelA,pendingLabelB,isT3A,isT3B,t3CandA,t3CandB);
  }
  cols.push({id:'r32',label:'Round of 32',pts:SC.ko.r32.base,bonus:SC.ko.r32.bonus[pr-1]||0,html:r32html});

  // R16 — cascade from user's R32 picks; admin matchup overrides if set

   Standings inline pick panels). Purely presentational — reads existing data. ══ */
const _DOW=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
const _MON=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
function _fmtDate(y,m,d){const dt=new Date(Date.UTC(y,m,d));return _DOW[dt.getUTCDay()]+' '+_MON[m]+' '+d;}

/* Teams for a knockout slot — admin-set matchup, else cascade from results.
   (Standalone copy of the helper inside renderResults so the new views can reuse it.) */
function getKOMatchTeams(rid,i){
  const m=(ST.results.koMatches[rid]&&ST.results.koMatches[rid][i])||null;
  if(m&&m.home&&m.away) return{home:m.home,away:m.away};
  if(rid==="third"){
    // SF losers (actual): the team in each decided SF that isn't the winner.
    const losers=[];
    for(let s=0;s<2;s++){
      const t=getKOMatchTeams("sf",s),w=ST.results.ko["sf_"+s]||null;
      losers.push((t&&w&&t.home&&t.away)?(t.home===w?t.away:t.home):null);
    }
    if(losers[0]||losers[1]) return{home:losers[0]||"TBD",away:losers[1]||"TBD"};
    return null;
  }
  const actS=actualStandings();
  if(rid==="r32"&&actS){
    const seed=R32_SEEDS[i];
    if(seed&&seed.a.t!=="T3"&&seed.b.t!=="T3"){
      const ta=slotTeam(seed.a,actS),tb=slotTeam(seed.b,actS);
      if(ta&&tb) return{home:ta,away:tb};
    }
  }
  const f=KO_FEED[rid]&&KO_FEED[rid][i];
  if(f){const pv=KO_PREV[rid];const ta=ST.results.ko[pv+"_"+f[0]]||null,tb=ST.results.ko[pv+"_"+f[1]]||null;if(ta||tb) return{home:ta||"TBD",away:tb||"TBD"};}
  return null;
}

/* Ordered tournament schedule: array of {label, sort, items:[{kind:'group',g,id,time}|{kind:'ko',rid,i}]}.
   Group stage uses the authoritative FOX schedule above; KO rounds are grouped
   under their round label with the official date range. */
function buildSchedule(){
  const out=[];
  GROUP_SCHED.forEach(day=>{
    const items=[];
    day.m.forEach(row=>{
      const arr=GROUPS[row[1]]; if(!arr) return;
      const i=arr.indexOf(row[2]), j=arr.indexOf(row[3]);
      if(i<0||j<0) return;
      items.push({kind:'group',g:row[1],id:row[1]+'_'+Math.min(i,j)+'_'+Math.max(i,j),time:row[0]});
    });
    // Weekday computed from the real date so it can't drift from the calendar
    // (the hardcoded day.d strings had stale weekdays, e.g. "Wed Jun 11").
    if(items.length) out.push({label:moveFmtDay(day.s),sort:day.s,items});
  });
  [['r32','Round of 32 · Jun 28–Jul 3',16,Date.UTC(2026,5,28)],['r16','Round of 16 · Jul 4–7',8,Date.UTC(2026,6,4)],
   ['qf','Quarterfinals · Jul 9–11',4,Date.UTC(2026,6,9)],['sf','Semifinals · Jul 14–15',2,Date.UTC(2026,6,14)],
   ['third','3rd-Place Match · Jul 18',1,Date.UTC(2026,6,18)],['final','The Final · Jul 19',1,Date.UTC(2026,6,19)]].forEach(r=>{
    const items=[];
    // R32/QF visit reordered for feeder adjacency; `i` stays the TRUE slot index.
    const seq=koDisplaySeq(r[0],r[2]);
    seq.forEach(i=>{ if(getKOMatchTeams(r[0],i)||ST.results.ko[r[0]+'_'+i]) items.push({kind:'ko',rid:r[0],i}); });
    if(items.length) out.push({label:r[1],sort:r[3],items});
  });
  out.sort((a,b)=>a.sort-b.sort);
  return out;
}

function _pickBadge(text,color,bg){return '<span style="font-size:10px;font-weight:600;padding:2px 7px;border-radius:10px;color:'+color+';background:'+bg+';white-space:nowrap">'+text+'</span>';}
function _ptsTag(pts){
  if(pts==null) return '';
  const pos=pts>0;
  return '<span style="font-size:10px;font-weight:700;padding:2px 6px;border-radius:6px;margin-left:auto;color:'+(pos?'var(--green)':pts<0?'var(--red)':'var(--muted)')+';background:'+(pos?'#e8f5ee':pts<0?'#fdecea':'#eef0f3')+'">'+(pos?'+':'')+pts+' pts</span>';
}
/* Knockout points tag broken into base + early-pick bonus. `br` is the bonus
   round from koBonusRound (the same source calcScore uses); null/0 → not credited,
   so fall back to the standard "0 pts" treatment. base + bonus always equals the
   match's scored total. */
function _koPtsTag(rid,br){
  if(!br) return _ptsTag(0);
  const sc=SC.ko[rid];const bonus=sc.bonus[br-1]||0;const total=sc.base+bonus;
  const txt='+'+sc.base+' base'+(bonus>0?' <span style="opacity:.85">+'+bonus+' R'+br+' bonus</span>':'');
  return '<span style="font-size:10px;font-weight:700;padding:2px 6px;border-radius:6px;margin-left:auto;color:var(--green);background:#e8f5ee" title="'+total+' pts total">'+txt+'</span>';
}
function _matchShell(top,inner){
  return '<div style="padding:6px 2px;border-bottom:1px solid var(--border)">'+top+'<div style="display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-top:4px">'+inner+'</div></div>';
}

/* One group-stage match row for a given user's merged picks. */
function groupPickRow(mp,g,id,time){
  const parts=id.split('_'),home=GROUPS[g][+parts[1]],away=GROUPS[g][+parts[2]];
  const raw=ST.results.group[id]||null;
  const resVal=raw?(typeof raw==='object'?raw.result:raw):null;
  const hg=raw&&typeof raw==='object'&&raw.hg!=null?raw.hg:'';
  const ag=raw&&typeof raw==='object'&&raw.ag!=null?raw.ag:'';
  const pick=mp.group[id]||null;
  const top='<div style="font-size:12px;font-weight:600">'+(time?'<span style="color:var(--navy);font-weight:700;font-size:10px;margin-right:6px">'+time+'</span>':'')+home+' <span style="color:var(--muted);font-weight:400">vs</span> '+away+
    '<span style="font-size:10px;color:var(--muted);font-weight:400;margin-left:6px">Group '+g+'</span></div>';
  let inner='';
  if(pick){
    const lbl=pick==='W'?home+' win':pick==='D'?'Draw':away+' win';
    inner+=_pickBadge('Pick: '+lbl,'var(--navy)','var(--navygl)');
  } else inner+='<span style="font-size:10px;color:var(--muted);font-style:italic">No pick</span>';
  if(resVal){
    const rlbl=(resVal==='W'?home+' win':resVal==='D'?'Draw':away+' win')+((hg!==''&&ag!=='')?' '+hg+'-'+ag:'');
    inner+=_pickBadge('Result: '+rlbl,'#444','#eef0f3');
    if(pick){ const pts=pick===resVal?(resVal==='D'?SC.groupDraw:SC.groupCorrect):SC.groupWrong; inner+=_ptsTag(pts); }
  } else inner+='<span style="font-size:10px;color:var(--muted)">TBD</span>';
  return _matchShell(top,inner);
}

/* One knockout match row for a given user's merged picks. */
function koPickRow(mp,rid,i,userKey){
  const key=rid+'_'+i;
  const teams=getKOMatchTeams(rid,i);
  const home=teams?teams.home:'TBD',away=teams?teams.away:'TBD';
  const res=ST.results.ko[key]||null;
  // Team-based pick: which of the two ACTUAL matchup teams did the player back to
  // advance this round? (Re-derived so the shown pick belongs to this match and
  // agrees with the team-based scoring — see koPickedSide.)
  const pick=koPickedSide(userKey,rid,home,away,res);
  const rLbl={r32:'R32',r16:'R16',qf:'QF',sf:'SF',third:'3rd',final:'Final'}[rid]||rid;
  const top='<div style="font-size:12px;font-weight:600">'+home+' <span style="color:var(--muted);font-weight:400">vs</span> '+away+
    '<span style="font-size:10px;color:var(--muted);font-weight:400;margin-left:6px">'+rLbl+'</span></div>';
  let inner='';
  if(pick) inner+=_pickBadge('Pick: '+pick,'var(--navy)','var(--navygl)');
  else inner+='<span style="font-size:10px;color:var(--muted);font-style:italic">No pick</span>';
  if(res){
    inner+=_pickBadge('Winner: '+res,'#444','#eef0f3');
    // Points follow the team and key off the result (mirrors calcScore): the
    // winner scores iff the player backed it to advance this round. Shown as the
    // base + early-pick bonus split.
    const br=koBonusRound(userKey,rid,res);
    inner+=_koPtsTag(rid,br);
  } else inner+='<span style="font-size:10px;color:var(--muted)">TBD</span>';
  return _matchShell(top,inner);
}

function pickMatchRow(mp,it,userKey){ return it.kind==='group'?groupPickRow(mp,it.g,it.id,it.time):koPickRow(mp,it.rid,it.i,userKey); }

/* By-date listing of every match with this user's pick / result / points. */
function renderByDate(userKey){
  const mp=getMergedPicks(userKey);
  const sched=buildSchedule();
  if(!sched.length) return '<div class="card"><div class="notice-blue">No matches scheduled yet.</div></div>';
  const dayCard=day=>'<div class="card" style="padding:10px 12px;margin-bottom:10px">'+
      '<div style="display:inline-block;font-size:11px;font-weight:700;color:var(--navy);background:var(--navygl);border-radius:12px;padding:3px 10px;margin-bottom:6px">'+
        day.label+' &middot; '+day.items.length+' match'+(day.items.length>1?'es':'')+'</div>'+
      day.items.map(it=>pickMatchRow(mp,it,userKey)).join('')+
    '</div>';
  // Group-stage days collapse together (every item kind 'group'); KO days follow.
  const isGroupDay=day=>day.items.every(it=>it.kind==='group');
  const groupDays=sched.filter(isGroupDay), koDays=sched.filter(d=>!isGroupDay(d));
  let html='';
  if(groupDays.length) html+=groupCollapseSection(userKey,groupDays.map(dayCard).join(''));
  koDays.forEach(day=>{ html+=dayCard(day); });
  return html;
}

/* By-round listing (group stage by group, then KO by round) of a user's picks. */
function renderPicksByRound(userKey){
  const mp=getMergedPicks(userKey);
  const head=t=>'<div style="font-size:11px;font-weight:700;color:var(--navy);margin:8px 0 2px">'+t+'</div>';
  let html='';
  for(const g in GROUPS){ html+=head('Group '+g); GM[g].forEach(m=>html+=groupPickRow(mp,g,m.id)); }
  [['r32','Round of 32',16],['r16','Round of 16',8],['qf','Quarterfinals',4],['sf','Semifinals',2],['final','The Final',1]].forEach(r=>{
    let rows='';
    for(let i=0;i<r[2];i++){ if(getKOMatchTeams(r[0],i)||ST.results.ko[r[0]+'_'+i]||mp.ko[r[0]+'_'+i]) rows+=koPickRow(mp,r[0],i,userKey); }
    if(rows) html+=head(r[1])+rows;
  });
  return html;
}

/* Small [By round][By date] segmented toggle. mode = current value; attr = data-* hook. */
function viewToggle(mode,attr,roundVal){

}

/* Standings inline panel for a player — enforces the both-submitted gate. */
function renderLBPanel(targetKey){
