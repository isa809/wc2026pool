<!--
=======================================================================
  WORLD CUP 2026 POOL — WorldCup2026Pool.html
  Single-file HTML/JS/CSS app, no framework, no build step.
  Storage: browser localStorage only.
  See WC2026Pool_Handoff.md for full developer documentation.
=======================================================================

  QUICK ARCHITECTURE REFERENCE
  ─────────────────────────────
  State:     global ST object → loadST()/saveST() via localStorage
  Rendering: render() → renderMain() → renderTab() → renders by TAB var
  Binding:   bindMain() → bindTab() (called after every setTab())

  KEY GLOBALS
  ───────────
  ST          Master state object (users, results, adminPin, predRound, tournament)
  CU          Current logged-in user { key, displayName, pin }
  TAB         Active tab: "picks"|"results"|"lb"|"scoring"|"admin"
  ADMIN_ON    Whether admin panel is unlocked
  VIEW        "login" | "main"

  SCORING (max 275 pts)
  ──────────────────────
  Group: +2 correct / +2 draw / -1 wrong   → 96 pts max
  R32:   +3 base + +1 if first picked in R1 → 64 pts max
  R16:   +4 base + +2 if first picked in R1 → 48 pts max
  QF:    +5 base + +2 if first picked in R1 → 28 pts max
  SF:    +6 base + +2 if first picked in R1 → 16 pts max
  3rd:   +7 base + +2 if first picked in R2 →  9 pts max  (R2/R3 only)
  Final: +10 base + +4 R1 / +3 R2 bonus     → 14 pts max
  (base = latest pick; bonus follows the TEAM, not the slot key)

  PREDICTION ROUNDS
  ─────────────────
  Round 1: Before tournament   → groups + full bracket
  Round 2: After group stage   → full bracket (admin unlocks)
  Round 3: After semi-finals   → champion only (admin unlocks)

  KO PICK FORMAT
  ──────────────
  draft.ko["r32_0"]    = { team: "Brazil", round: 1 }
  draft.ko["r32_2"]    = { team: "__t3__", round: 1 }  ← T3 slot winner
  draft.ko["r32_2_t3"] = "Ecuador"                      ← actual T3 team

  ADMIN DEFAULT PIN: 0000
=======================================================================
-->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>World Cup 2026 Pool</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet"/>
<style>
@import url('https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@400;500;600;700&display=swap');

:root{
  /* FIFA color palette */
  --fifa-blue:#003f7f;
  --fifa-blue-mid:#005eb8;
  --fifa-blue-light:#1a7fd4;
  --fifa-gold:#c8963a;
  --fifa-gold-light:#f0b429;
  --fifa-gold-pale:#fdf3e0;
  --fifa-white:#ffffff;
  --fifa-dark:#0a1628;
  --green:#1a8a3c;
  --green-light:#e6f5ec;
  --red:#d32f2f;
  --red-light:#fdecea;
  --bg:#f4f6fb;
  --card:#ffffff;
  --border:#dde3ef;
  --text:#0a1628;
  --muted:#5a6a85;
  --r:10px;
  --navy:var(--fifa-blue);
  --navygl:#e8eef9;
  --gold:var(--fifa-gold);
  --gdl:var(--fifa-gold-pale);
  --blue:var(--fifa-blue-mid);
}

*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--text);min-height:100vh}

/* ── HERO ── */
.app{max-width:1200px;margin:0 auto;padding:0 0 24px}
.hero{
  background:linear-gradient(135deg,var(--fifa-dark) 0%,var(--fifa-blue) 60%,var(--fifa-blue-mid) 100%);
  color:#fff;padding:0;margin-bottom:16px;position:relative;overflow:hidden;
}
.hero-inner{padding:22px 20px 18px;position:relative;z-index:2}
.hero::before{
  content:"";position:absolute;inset:0;z-index:1;
  background:url("data:image/svg+xml,%3Csvg width='60' height='60' viewBox='0 0 60 60' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='none' fill-rule='evenodd'%3E%3Cg fill='%23ffffff' fill-opacity='0.04'%3E%3Ccircle cx='30' cy='30' r='20'/%3E%3Ccircle cx='30' cy='30' r='12'/%3E%3C/g%3E%3C/g%3E%3C/svg%3E");
}
.hero-badge{
  display:inline-flex;align-items:center;gap:6px;
  background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.2);
  border-radius:20px;padding:3px 12px 3px 8px;
  font-size:11px;font-weight:600;letter-spacing:.08em;color:var(--fifa-gold-light);
  margin-bottom:10px;text-transform:uppercase;
}
.hero h1{
  font-family:'Bebas Neue',sans-serif;font-size:34px;line-height:1;
  color:#fff;letter-spacing:.06em;margin-bottom:4px;
}
.hero h1 span{color:var(--fifa-gold-light)}
.hero .sub{font-size:12px;opacity:.65;letter-spacing:.02em}
.hero-flag-strip{
  height:4px;
  background:linear-gradient(90deg,#b31942 0%,#b31942 33%,#fff 33%,#fff 66%,#0a3161 66%);
}

/* ── TOP BAR ── */
.top-bar{display:flex;align-items:center;gap:10px;padding:0 16px;margin-bottom:14px}
.av{
  width:36px;height:36px;border-radius:50%;
  background:linear-gradient(135deg,var(--fifa-blue-mid),var(--fifa-blue));
  display:flex;align-items:center;justify-content:center;
  font-size:14px;font-weight:700;color:#fff;flex-shrink:0;
  box-shadow:0 2px 8px rgba(0,63,127,.3);
}
.score-pill{
  background:linear-gradient(135deg,var(--fifa-blue),var(--fifa-blue-mid));
  color:#fff;border-radius:20px;padding:4px 14px;
  font-family:'Bebas Neue',sans-serif;font-size:20px;letter-spacing:.04em;
  box-shadow:0 2px 8px rgba(0,63,127,.2);
}
.logout-btn{
  font-size:12px;padding:5px 12px;border:1px solid var(--border);
  border-radius:6px;cursor:pointer;background:transparent;
  font-family:'DM Sans',sans-serif;color:var(--muted);
}
.logout-btn:hover{background:var(--bg);border-color:var(--fifa-blue)}

/* ── TABS ── */
.tabs{
  display:flex;gap:2px;background:#dde3ef;border-radius:10px;
  padding:4px;margin:0 16px 16px;flex-wrap:wrap;
}
.tab{
  flex:1 1 auto;padding:8px 4px;border:none;background:transparent;
  border-radius:7px;font-size:11px;font-weight:600;
  font-family:'DM Sans',sans-serif;cursor:pointer;color:var(--muted);
  /* Let labels wrap inside the button instead of overflowing and overlapping
     neighbours when the bar is cramped (e.g. the 6 admin sub-tabs on a phone). */
  white-space:normal;overflow-wrap:break-word;min-width:0;text-align:center;
  line-height:1.2;transition:all .15s;letter-spacing:.02em;
}
.tab.active{
  background:var(--fifa-blue);color:#fff;
  box-shadow:0 2px 8px rgba(0,63,127,.3);
}
.tab:hover:not(.active){background:rgba(0,63,127,.08);color:var(--fifa-blue)}

/* ── CARDS ── */
.card{
  background:var(--card);border:1px solid var(--border);
  border-radius:var(--r);padding:16px;margin:0 16px 12px;
  box-shadow:0 1px 4px rgba(0,0,0,.04);
}
.card-title{
  font-family:'Bebas Neue',sans-serif;font-size:13px;
  letter-spacing:.1em;color:var(--muted);margin-bottom:12px;
  text-transform:uppercase;
}

/* ── INPUTS ── */
input{
  width:100%;padding:10px 12px;border:1.5px solid var(--border);
  border-radius:8px;font-size:14px;font-family:'DM Sans',sans-serif;
  background:#fafbfe;color:var(--text);margin-bottom:8px;outline:none;
  transition:border-color .15s;
}
input:focus{border-color:var(--fifa-blue-mid);background:#fff}
input[type=password]{letter-spacing:.2em}

/* ── BUTTONS ── */
.btn{
  display:block;width:100%;padding:11px;border:none;
  border-radius:8px;font-size:14px;font-weight:600;
  font-family:'DM Sans',sans-serif;cursor:pointer;transition:all .15s;
}
.btn-navy{
  background:linear-gradient(135deg,var(--fifa-blue),var(--fifa-blue-mid));
  color:#fff;box-shadow:0 2px 8px rgba(0,63,127,.25);
}
.btn-navy:hover{opacity:.9;box-shadow:0 4px 12px rgba(0,63,127,.35)}
.btn-green{
  background:linear-gradient(135deg,#1a6b3c,#1a8a3c);
  color:#fff;box-shadow:0 2px 8px rgba(26,107,60,.25);
}
.btn-green:hover{opacity:.9}
.btn-outline{
  background:transparent;border:1.5px solid var(--border);color:var(--text);
}
.btn-outline:hover{background:var(--bg);border-color:var(--fifa-blue)}
.btn-danger{background:var(--red-light);border:1px solid #f1a9a0;color:var(--red);margin-top:6px}
.btn-sm{
  display:inline-block;width:auto;padding:5px 12px;font-size:12px;
  border-radius:6px;border:1px solid var(--border);background:transparent;
  cursor:pointer;font-family:'DM Sans',sans-serif;color:var(--text);
}
.btn-sm:hover{background:var(--bg)}
.btn-sm.btn-danger{margin-top:0;background:var(--red-light);border-color:#f1a9a0;color:var(--red)}
.btn-submit{
  background:linear-gradient(135deg,var(--fifa-gold),var(--fifa-gold-light));
  color:var(--fifa-dark);border:none;border-radius:8px;width:100%;
  cursor:pointer;font-family:'Bebas Neue',sans-serif;letter-spacing:.06em;
  font-size:20px;padding:13px;margin-top:12px;
  box-shadow:0 3px 12px rgba(200,150,58,.35);
}
.btn-submit:hover{opacity:.92;box-shadow:0 5px 16px rgba(200,150,58,.45)}
.btn-submit:disabled{opacity:.35;cursor:not-allowed;box-shadow:none}

/* ── NOTICES ── */
.notice{background:var(--fifa-gold-pale);border:1px solid var(--fifa-gold);border-radius:8px;padding:9px 12px;font-size:12px;color:#7a5010;margin-bottom:12px}
.notice-blue{background:#eaf1fb;border:1px solid #9ab8e8;border-radius:8px;padding:9px 12px;font-size:12px;color:#1a3a6b;margin-bottom:12px}
.notice-green{background:var(--green-light);border:1px solid #a8d5bc;border-radius:8px;padding:9px 12px;font-size:12px;color:#0f4a25;margin-bottom:12px}
.notice-red{background:var(--red-light);border:1px solid #f1a9a0;border-radius:8px;padding:9px 12px;font-size:12px;color:#7b2d26;margin-bottom:12px}
.err{font-size:12px;color:var(--red);margin-top:2px;margin-bottom:4px}
.ok{font-size:12px;color:var(--green);margin-top:2px;margin-bottom:4px}

/* ── PR BAR ── */
.pr-bar{
  background:linear-gradient(135deg,var(--fifa-dark),var(--fifa-blue));
  border-radius:8px;padding:12px 16px;margin:0 16px 12px;
  display:flex;align-items:center;gap:12px;color:#fff;
}
.pr-title{font-family:'Bebas Neue',sans-serif;font-size:17px;color:#fff;letter-spacing:.04em}
.pr-sub{font-size:12px;color:rgba(255,255,255,.65);flex:1}
.missing-count{font-size:12px;font-weight:600;color:var(--fifa-gold-light)}
.missing-zero{font-size:12px;font-weight:600;color:#7df5a0}

/* ── ROUND TOGGLE ── */
.round-toggle{display:flex;gap:6px;margin:0 16px 14px;flex-wrap:wrap}
.round-tab{
  padding:7px 16px;border:1.5px solid var(--border);border-radius:8px;
  background:var(--card);font-size:12px;font-weight:600;
  font-family:'DM Sans',sans-serif;cursor:pointer;color:var(--muted);
  transition:all .15s;
}
.round-tab:hover{border-color:var(--fifa-blue);color:var(--fifa-blue)}
.round-tab-active{
  background:var(--fifa-blue);border-color:var(--fifa-blue);
  color:#fff;box-shadow:0 2px 8px rgba(0,63,127,.25);
}

/* ── SUBMIT CONFIRM BANNER ── */
.submit-confirm-banner{
  display:flex;align-items:flex-start;gap:14px;
  background:linear-gradient(135deg,var(--fifa-dark),var(--fifa-blue));
  border-radius:var(--r);padding:16px 18px;margin:0 16px 14px;
  box-shadow:0 3px 12px rgba(0,63,127,.2);
}
.submit-confirm-icon{font-size:28px;flex-shrink:0;line-height:1}
.submit-confirm-title{font-size:15px;font-weight:700;color:#fff;margin-bottom:4px}
.submit-confirm-sub{font-size:12px;color:rgba(255,255,255,.7);line-height:1.5}

/* ── GROUP GRID ── */
.group-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px;margin-bottom:16px}
.g-card{background:#fafbfe;border:1.5px solid var(--border);border-radius:8px;padding:10px}
.g-label{
  font-family:'Bebas Neue',sans-serif;font-size:12px;color:var(--fifa-blue);
  margin-bottom:8px;letter-spacing:.08em;
  padding-bottom:5px;border-bottom:2px solid var(--fifa-gold);display:inline-block;
}
.match{display:flex;align-items:stretch;gap:4px;margin-bottom:6px}
.t-name{font-size:10px;color:var(--muted);flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pbtn{
  font-size:10px;padding:3px 6px;border-radius:5px;
  border:1.5px solid var(--border);background:#fff;cursor:pointer;
  font-family:'DM Sans',sans-serif;font-weight:600;white-space:nowrap;color:var(--muted);
  transition:all .1s;
}
/* Group-pick result buttons: full team names that wrap instead of truncating */
.pbtn-team{
  flex:1;min-width:0;white-space:normal;word-break:break-word;line-height:1.15;
  text-align:center;display:flex;align-items:center;justify-content:center;
  min-height:30px;padding:4px 5px;
}
.pbtn-draw{flex:0 0 auto;display:flex;align-items:center;justify-content:center;min-height:30px}
.match .chip{flex:0 0 auto;align-self:center}
.pbtn:hover{border-color:var(--fifa-blue)}
.pbtn.sel-W,.pbtn.ok-W{background:var(--fifa-blue);border-color:var(--fifa-blue);color:#fff}
.pbtn.sel-D,.pbtn.ok-D{background:var(--fifa-blue-mid);border-color:var(--fifa-blue-mid);color:#fff}
.pbtn.sel-L,.pbtn.ok-L{background:var(--red);border-color:var(--red);color:#fff}
.pbtn.wrong-W,.pbtn.wrong-D,.pbtn.wrong-L{background:var(--red-light);border-color:#f1a9a0;color:var(--red);opacity:.7}

/* ── BRACKET ── */
.bracket-wrap{overflow-x:auto;padding-bottom:8px}
.bracket{display:flex;gap:0;min-width:900px}
.brd-col{display:flex;flex-direction:column;min-width:150px;flex:1}
.brd-col-title{
  font-family:'Bebas Neue',sans-serif;font-size:11px;letter-spacing:.08em;
  color:var(--muted);text-align:center;padding:7px 4px;
  background:linear-gradient(to bottom,#f0f4fb,#e8eef9);
  border-bottom:2px solid var(--fifa-blue);border-top:1px solid var(--border);
}
.brd-col-title .pts{
  font-size:10px;color:var(--fifa-gold);
  font-family:'DM Sans',sans-serif;font-weight:600;display:block;
}
.brd-matches{display:flex;flex-direction:column;justify-content:space-around;flex:1;padding:6px 4px;gap:4px}
.brd-match{border:1.5px solid var(--border);border-radius:7px;overflow:hidden;background:var(--card);flex-shrink:0}
.brd-match:hover{border-color:var(--fifa-blue-light)}
.brd-slot{
  display:flex;align-items:center;padding:6px 8px;cursor:pointer;gap:6px;
  min-height:30px;transition:background .1s;
}
.brd-slot:first-child{border-bottom:1px solid var(--border)}
.brd-slot.selected{background:var(--fifa-blue);color:#fff}
.brd-slot.selected .slot-name{color:#fff}
.brd-slot.correct{background:var(--green)}
.brd-slot.correct .slot-name{color:#fff}
.brd-slot.wrong{background:var(--red-light)}
.brd-slot.wrong .slot-name{color:var(--red)}
.brd-slot.disabled{cursor:default;opacity:.65}
.brd-slot.hoverable:hover{background:#eaf1fb}
.slot-name{font-size:11px;font-weight:500;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--text);max-width:115px}
.slot-pts{font-size:9px;color:var(--fifa-gold);font-weight:700;white-space:nowrap;flex-shrink:0}
.brd-final{display:flex;flex-direction:column;justify-content:center;align-items:center;flex:1;padding:8px 4px}
.final-box{border:2px solid var(--fifa-gold);border-radius:8px;overflow:hidden;background:var(--card);width:100%;box-shadow:0 2px 12px rgba(200,150,58,.2)}
.final-title{font-family:'Bebas Neue',sans-serif;font-size:13px;color:var(--fifa-gold);text-align:center;margin-bottom:5px;letter-spacing:.08em}
.winner-crown{font-size:26px;text-align:center;margin-bottom:4px}
.final-slot{display:flex;align-items:center;padding:8px 10px;cursor:pointer;gap:6px;min-height:36px;transition:background .1s}
.final-slot:first-child{border-bottom:1px solid var(--border)}
.final-slot:hover:not(.disabled){background:#eaf1fb}
.final-slot.selected{background:var(--fifa-blue)}
.final-slot.selected .slot-name{color:#fff}
.final-slot.correct{background:var(--green)}
.final-slot.correct .slot-name{color:#fff}
.final-slot.wrong{background:var(--red-light)}
.final-slot.wrong .slot-name{color:var(--red)}
.final-slot.disabled{cursor:default}
.final-champion-title{font-family:'Bebas Neue',sans-serif;font-size:22px;letter-spacing:.06em;color:var(--fifa-blue);margin-bottom:4px}

/* ── LEADERBOARD ── */
.lb-row{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--border)}
.lb-row:last-child{border-bottom:none}
.lb-rank{font-family:'Bebas Neue',sans-serif;font-size:20px;width:28px;color:var(--muted)}
.lb-rank.top{color:var(--fifa-gold)}
.lb-pts{font-family:'Bebas Neue',sans-serif;font-size:22px;color:var(--fifa-blue)}
.submitted-badge{
  display:inline-block;font-size:10px;padding:2px 8px;border-radius:10px;
  background:var(--green-light);color:var(--green);font-weight:600;margin-left:5px;
}
.last-notice{
  background:linear-gradient(135deg,var(--red-light),#fff0ee);
  border:1px solid #f1a9a0;border-radius:8px;padding:10px 12px;
  font-size:13px;color:#7b2d26;margin-top:10px;font-weight:500;
}

/* ── CHIPS ── */
.chip{display:inline-block;font-size:10px;padding:2px 7px;border-radius:10px;font-weight:600;margin-left:3px}
.chip-ok{background:var(--green-light);color:var(--green)}
.chip-no{background:var(--red-light);color:var(--red)}

/* ── ADMIN ── */
.admin-row{display:flex;gap:5px;align-items:center;margin-bottom:7px;flex-wrap:wrap}
.admin-row input{margin:0;font-size:12px;padding:5px 8px}
.asel{
  padding:6px 8px;border:1.5px solid var(--border);border-radius:6px;
  font-size:12px;font-family:'DM Sans',sans-serif;background:#fafbfe;color:var(--text);
}
.admin-edit-btn{opacity:0;transition:opacity .15s}
.admin-clear-hint{
  display:none;font-size:9px;color:rgba(255,255,255,.85);
  background:rgba(0,0,0,.25);border-radius:4px;padding:1px 5px;
  margin-left:4px;white-space:nowrap;flex-shrink:0;
}
.brd-slot:hover .admin-clear-hint,
.final-slot:hover .admin-clear-hint{display:inline-block}
.brd-match:hover .admin-edit-btn,.final-box:hover .admin-edit-btn{opacity:1}
.admin-edit-form input{
  width:100%;padding:4px 6px;border:1px solid var(--border);border-radius:5px;
  font-size:11px;font-family:'DM Sans',sans-serif;margin-bottom:4px;
}
.admin-edit-form input:last-child{margin-bottom:0}
.brd-slot.correct{background:var(--green)!important}
.brd-slot.correct .slot-name{color:#fff!important}

/* ── SCORING TABLE ── */
.scoring-table{width:100%;border-collapse:collapse;font-size:12px}
.scoring-table th{text-align:left;padding:7px 9px;background:linear-gradient(to bottom,var(--fifa-blue),var(--fifa-blue-mid));color:#fff;font-size:11px;font-weight:600;letter-spacing:.04em}
.scoring-table td{padding:7px 9px;border-bottom:1px solid var(--border)}
.scoring-table tr:last-child td{border-bottom:none}
.scoring-table tr:hover td{background:#f4f6fb}

/* ── MODALS ── */
.modal-overlay{position:fixed;inset:0;background:rgba(10,22,40,.6);z-index:1000;display:flex;align-items:center;justify-content:center;padding:16px;backdrop-filter:blur(2px)}
.modal{background:#fff;border-radius:12px;padding:28px 24px;max-width:360px;width:100%;text-align:center;box-shadow:0 20px 60px rgba(0,63,127,.25);border-top:4px solid var(--fifa-gold)}
.modal-icon{font-size:52px;margin-bottom:12px}
.modal-title{font-family:'Bebas Neue',sans-serif;font-size:26px;letter-spacing:.04em;color:var(--fifa-blue);margin-bottom:8px}
.modal-pts{font-family:'Bebas Neue',sans-serif;font-size:42px;color:var(--fifa-blue);margin:8px 0;background:linear-gradient(135deg,var(--fifa-blue),var(--fifa-gold));-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.modal-pts-label{font-size:12px;color:var(--muted)}
.modal-body{font-size:13px;color:var(--muted);line-height:1.6;margin-top:8px}

/* ── T3 SELECTOR ── */
.t3-sel:hover,.t3-sel:focus{border-color:var(--fifa-gold);outline:none}
.final-pick-card:hover{transform:translateY(-2px);box-shadow:0 6px 16px rgba(0,63,127,.15)}

/* ── LOGIN PAGE ── */

/* Resolve a later-round (r16/qf/sf/final) slot for the Global Results board.
   Each side = an explicit override (wins), else the winner of its feeding match
   from ST.results.ko, else an honest "Winner M##" placeholder. Never a guess.
   Returns {home:{team,label,placeholder}, away:{...}}. */
function resolveKoLaterSlot(round,i){
  if(round==="third"){
    // 3rd-place: the two SF LOSERS (loser = the SF participant that isn't the winner).
    const ov=(ST.results.koMatches.third&&ST.results.koMatches.third[0])||{};
    const loserSide=(sfIdx,overrideTeam)=>{
      if(overrideTeam==="TBD") return {team:null,label:"TBD",placeholder:true};
      if(overrideTeam) return {team:overrideTeam,label:overrideTeam,placeholder:false};
      const teams=getKOMatchTeams("sf",sfIdx),w=ST.results.ko["sf_"+sfIdx]||null;
      if(teams&&w&&teams.home&&teams.away){
        const loser=teams.home===w?teams.away:teams.home;
        if(loser&&loser!=="TBD") return {team:loser,label:loser,placeholder:false};
      }
      const mn=koMatchNumber("sf",sfIdx);
      return {team:null,label:"Loser "+(mn?"M"+mn:"SF"),placeholder:true};
    };
    return {home:loserSide(0,ov.home),away:loserSide(1,ov.away)};
  }
  const feed=(KO_FEED[round]&&KO_FEED[round][i])||[null,null];
  const prev=KO_PREV[round];
  const ov=(ST.results.koMatches[round]&&ST.results.koMatches[round][i])||{};
  const side=(feedIdx,overrideTeam)=>{
    if(overrideTeam==="TBD") return {team:null,label:"TBD",placeholder:true};
    if(overrideTeam) return {team:overrideTeam,label:overrideTeam,placeholder:false};
    const w=(feedIdx!=null&&ST.results.ko[prev+"_"+feedIdx])||null;
    if(w) return {team:w,label:w,placeholder:false};
    const mn=koMatchNumber(prev,feedIdx);
    return {team:null,label:"Winner "+(mn?"M"+mn:(prev.toUpperCase()+" #"+((feedIdx||0)+1))),placeholder:true};
  };
  return {home:side(feed[0],ov.home),away:side(feed[1],ov.away)};
}

/* Escape user-authored text before injecting into innerHTML. */
function escapeHtml(s){
  return String(s==null?"":s)
    .replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;").replace(/'/g,"&#39;");
}

/* Read /globalAnnouncement is outside the pool node, so the per-pool listener
   won't catch it — use a dedicated lightweight listener. */
function listenForGlobalAnnouncement(){
  if(!db) return;
  if(_globalMsgListener) db.ref("globalAnnouncement").off("value",_globalMsgListener);
  _globalMsgListener=db.ref("globalAnnouncement").on("value",snap=>{
    const next=snap.val()||"";
    if(next===GLOBAL_ANNOUNCEMENT) return;
    GLOBAL_ANNOUNCEMENT=next;
    if(VIEW==="main") render();
  });
}

/* Predict who wins/runners-up from a user's group picks */
function predictedStandings(groupPicks){
  const res={};
  for(const g in GROUPS){
    const teams=GROUPS[g];
    const pts={};teams.forEach(t=>pts[t]=0);
    let pickCount=0;
    for(const m of GM[g]){
      const p=groupPicks&&groupPicks[m.id];
      if(p==="W"){pts[m.home]=(pts[m.home]||0)+3;pickCount++;}
      else if(p==="D"){pts[m.home]=(pts[m.home]||0)+1;pts[m.away]=(pts[m.away]||0)+1;pickCount++;}
      else if(p==="L"){pts[m.away]=(pts[m.away]||0)+3;pickCount++;}
    }
    if(pickCount===GM[g].length){
      const sorted=[...teams].sort((a,b)=>(pts[b]||0)-(pts[a]||0));
      res[g]={winner:sorted[0],runner:sorted[1],third:sorted[2],fourth:sorted[3]};
    }
  }
  return res;
}

      const raw=ST.results.group[m.id];
      if(!raw) continue;
      const r=typeof raw==='object'?raw.result:raw;
      const hg=typeof raw==='object'?(raw.hg||0):0;
      const ag=typeof raw==='object'?(raw.ag||0):0;
      if(!r) continue;
      count++;
      gf[m.home]+=hg; ga[m.home]+=ag;
      gf[m.away]+=ag; ga[m.away]+=hg;
      if(r==='W'){pts[m.home]=(pts[m.home]||0)+3;}
      else if(r==='D'){pts[m.home]=(pts[m.home]||0)+1;pts[m.away]=(pts[m.away]||0)+1;}
      else{pts[m.away]=(pts[m.away]||0)+3;}
    }
    if(count===GM[g].length){
      const sorted=[...teams].sort((a,b)=>{
        if((pts[b]||0)!==(pts[a]||0)) return (pts[b]||0)-(pts[a]||0);
        const gdA=(gf[a]||0)-(ga[a]||0); const gdB=(gf[b]||0)-(ga[b]||0);
        if(gdB!==gdA) return gdB-gdA;
        return (gf[b]||0)-(gf[a]||0);
      });
      res[g]={winner:sorted[0],runner:sorted[1],third:sorted[2],fourth:sorted[3]};
    }
  }
  return res;
}

/* Build the 16 ACTUAL R32 matchups from admin-entered group results.
   - Non-T3 slots: the group winner / runner-up straight from the standings.
   - The 8 best-3rd (T3) slots: assigned a 3rd-place team from that slot's
     candidate groups, deterministically and without duplication, so every
     user sees the exact same bracket.
   Returns [{home,away}, ...] with empty strings where a team can't be
   determined yet (e.g. a group's results aren't all entered). */
function buildActualR32Matchups(){
  const st=actualStandings();
  const usedThirds={};
  const out=[];
  R32_SEEDS.forEach(function(seed,i){
    function teamFor(side){
      if(side.t==='T3'){
        const slot=T3_SLOTS[i];
        if(slot){
          for(const g of slot.groups){const t=st[g]&&st[g].third;if(t&&!usedThirds[t]){usedThirds[t]=true;return t;}}
          for(const g of slot.groups){const t=st[g]&&st[g].third;if(t)return t;}
        }
        return '';
      }
      return slotTeam(side,st)||'';
    }
    out[i]={home:teamFor(seed.a),away:teamFor(seed.b)};
  });
  return out;
}

/* Auto-generate ALL 16 R32 matchups (incl. best-3rd slots) from actual results */
function autoFillR32Matchups(){
  const matchups=buildActualR32Matchups();
  if(!ST.results.koMatches.r32) ST.results.koMatches.r32=[];
  let filled=0;
  matchups.forEach(function(m,i){
    if(m&&m.home&&m.away){
      ST.results.koMatches.r32[i]={home:m.home,away:m.away};
      filled++;
    }
  });
  saveST();
  return filled;
}

/* T3 slot config — which groups feed each third-place slot */
const T3_SLOTS={
  2: {label:"Best 3rd: A/B/C/D/F", groups:["A","B","C","D","F"]},
  5: {label:"Best 3rd: C/D/F/G/H", groups:["C","D","F","G","H"]},
  6: {label:"Best 3rd: C/E/F/H/I", groups:["C","E","F","H","I"]},
  7: {label:"Best 3rd: E/H/I/J/K", groups:["E","H","I","J","K"]},
  8: {label:"Best 3rd: A/E/H/I/J", groups:["A","E","H","I","J"]},
  9: {label:"Best 3rd: B/E/F/I/J", groups:["B","E","F","I","J"]},
  12:{label:"Best 3rd: E/F/G/I/J", groups:["E","F","G","I","J"]},
  15:{label:"Best 3rd: D/E/I/J/L", groups:["D","E","I","J","L"]}
};

/* Get predicted 3rd-place candidates for a T3 slot index.
   Returns array of {team, group} for groups where all 6 matches are picked */
function getT3Candidates(slotIdx,standings){
  const slot=T3_SLOTS[slotIdx];
  if(!slot) return [];
  const candidates=[];
  for(const g of slot.groups){
    if(standings[g]&&standings[g].third){
      candidates.push({team:standings[g].third,group:g});
    }
  }
  return candidates;
}

/* Get team name for a seed slot given standings */
function slotTeam(seed,standings){
  if(seed.t==="T3") return null; // handled separately via T3 picker
  if(!standings||!standings[seed.g]) return null;
  return seed.t==="W"?standings[seed.g].winner:standings[seed.g].runner;
}

function seedLabel(seed){
  if(seed.t==="T3") return seed.label||"Best 3rd place team";
  return (seed.t==="W"?"Winner ":"Runner-up ")+seed.g;
}

function isT3Slot(seed){
  return seed.t==="T3";
}

/* Every team still alive for an R32 override dropdown: from a DECIDED group,
   its top three (1st/2nd/3rd are the only ones that can reach the R32); from an
   UNDECIDED group, all four (we don't yet know who's out). De-duped, sorted. */
function getAliveTeams(){
  const st=actualStandings();
  const set={};
  for(const g in GROUPS){
    if(st[g]) ["winner","runner","third"].forEach(k=>{ if(st[g][k]) set[st[g][k]]=true; });
    else GROUPS[g].forEach(t=>{ set[t]=true; });
  }
  return Object.keys(set).sort((a,b)=>a.localeCompare(b));
}

/* Resolve ONE side of an R32 slot for the Global Results board.
   Priority: a manual override (stored team) > the real team from decided
   standings (W/R only) > an honest placeholder label. Never guesses a T3 team.
   Returns {team, label, placeholder} — team is null when only a placeholder. */
function resolveR32Side(side,overrideTeam,actS){
  if(overrideTeam==="TBD") return {team:null,label:"TBD",placeholder:true}; // explicit undetermined
  if(overrideTeam) return {team:overrideTeam,label:overrideTeam,placeholder:false};
  if(side.t==="T3")  return {team:null,label:side.label||"Best 3rd place team",placeholder:true};
  const t=slotTeam(side,actS);
  if(t) return {team:t,label:t,placeholder:false};
  return {team:null,label:seedLabel(side),placeholder:true};
}

/* Resolve both sides of R32 slot i. actS = actualStandings() (pass once). */
function resolveR32Slot(i,actS){
  const seed=R32_SEEDS[i];
  const ov=(ST.results.koMatches.r32&&ST.results.koMatches.r32[i])||{};
  return {
    home:resolveR32Side(seed.a,ov.home,actS),
    away:resolveR32Side(seed.b,ov.away,actS)
  };
}

/* Advance a later knockout round from the previous round's winners.
   round ∈ {r16,qf,sf,final}. Picks the top-feeder team as the fake winner. */
function demoFillKo(round){

  const count ={r16:8, qf:4, sf:2, final:1};
  const prev=prevOf[round], n=count[round];
  if(!prev) return;

/* Is the current user the super admin (the only one allowed to use demo tools)? */
function isSuperAdminUser(){return !!(CU&&CU.isSuperAdmin)||IS_SUPER_ADMIN;}

/* Is a stored user the (virtual) super-admin account? Excluded from standings/players. */
function isSuperAdminEntry(key,u){return key==="u_superadmin"||!!(u&&u.isSuperAdmin);}

/* Get merged picks across all submitted rounds */
function getMergedPicks(userKey){
  const u=ST.users[userKey];
  if(!u) return{group:{},ko:{}};
  const merged={group:{},ko:{}};
  for(let r=1;r<=3;r++){
    const rd=u.rounds&&u.rounds[r];
    if(!rd||!rd.submitted) continue;
    if(rd.picks&&rd.picks.group) Object.assign(merged.group,rd.picks.group);
    if(rd.picks&&rd.picks.ko){
      for(const key in rd.picks.ko){
        if(key.endsWith("_t3")){
          // Always keep latest T3 team selection
          merged.ko[key]=rd.picks.ko[key];
          continue;
        }
        const ex=merged.ko[key];
        const nw=rd.picks.ko[key];
        if(!ex||ex.team!==nw.team) merged.ko[key]={team:nw.team,round:r};
      }
    }
  }
  return merged;
}

/* Per-key scoring metadata for the knockout bracket: for each ko slot, the team
   that actually counts (merged across rounds) and the round it was FIRST locked.
   Used so the bracket's earned-points labels (base + early-pick bonus) match the
   real scoring shown in the points-breakdown card. */
function koScoreMeta(userKey){
  const ko=getMergedPicks(userKey).ko||{};
  const o={};
  for(const k in ko){
    if(k.endsWith("_t3")) continue;
    const v=ko[k];
    const rawTeam=(v&&typeof v==="object")?v.team:v;
    const resolved=(rawTeam==="__t3__")?(ko[k+"_t3"]||null):rawTeam;
    const roundId=k.split("_")[0];
    // Bonus round follows the team across rounds (matches calcScore), so the
    // bracket's earned-points labels agree with the leaderboard.
    const br=resolved?koBonusRound(userKey,roundId,resolved):null;
    o[k]={team:rawTeam,round:br||((v&&v.round)||1)};
  }
  return o;
}

/* Credited early-pick round for `team` in knockout round `roundId`
   (r32/r16/qf/sf/final). The early-pick bonus follows the TEAM, not the slot
   key, and answers: "did you pick THIS TEAM to win this round, and how early?"

   Two-step, team-based + __t3__ resolved (READ-ONLY):
   1. Ruling (a) gate: the player is credited for `team` only if their MERGED
      (final) prediction still has `team` winning some match in this round. A
      team picked early but ABANDONED in a later round is no longer in the
      merged picks, so it earns nothing → returns null.
   2. If credited, return the EARLIEST prediction round (1/2/3) in which the
      player committed to `team` for this round — searching all of the round's
      slots, so a Round 1 pick keeps its R1 bonus even though the corrected
      cascade re-paired which slot now holds that team.

   Returns null if `team` is not in the merged round-`roundId` winners. */
function koBonusRound(userKey,roundId,team){
  const u=ST.users[userKey];
  if(!u||!u.rounds||!team) return null;
  // Step 1 — gate on the MERGED final pick (ruling a). Team-based, __t3__ resolved.
  const merged=getMergedPicks(userKey).ko||{};
  let inFinal=false;
  for(const key in merged){
    if(key.endsWith("_t3")) continue;
    if(key.split("_")[0]!==roundId) continue;
    const v=merged[key];
    let mt=(v&&typeof v==="object")?v.team:v;
    if(mt==="__t3__") mt=merged[key+"_t3"]||null;
    if(mt&&mt===team){ inFinal=true; break; }
  }
  if(!inFinal) return null; // abandoned/never-final → no points for this team
  // Step 2 — earliest prediction round the player committed to `team` for this round.
  for(let r=1;r<=3;r++){
    const rd=u.rounds[r];
    if(!rd||!rd.submitted||!rd.picks||!rd.picks.ko) continue;
    const ko=rd.picks.ko;
    for(const key in ko){
      if(key.endsWith("_t3")) continue;
      if(key.split("_")[0]!==roundId) continue;
      const v=ko[key];
      let pickedTeam=(v&&typeof v==="object")?v.team:v;
      if(pickedTeam==="__t3__") pickedTeam=ko[key+"_t3"]||null;
      if(pickedTeam&&pickedTeam===team) return r; // ascending loop → earliest round
    }
  }
  return null;
}

/* Which team in an ACTUAL knockout matchup (home vs away) did the player back to
   advance in this round? Picks are stored by slot key under the cascade as it
   looked when the pick was made, but the real matchup is re-derived from results
   — so the slot-key pick can be a team that isn't even in this match. We instead
   show the team the player predicted to advance, team-based (consistent with
   scoring): the one of home/away that is in their merged round winners. Prefers
   the actual winner if they somehow backed both; null if they backed neither. */
function koPickedSide(userKey,roundId,home,away,winner){
  const hOk=home&&home!=="TBD"&&koBonusRound(userKey,roundId,home)!=null;
  const aOk=away&&away!=="TBD"&&koBonusRound(userKey,roundId,away)!=null;
  if(hOk&&aOk) return winner===away?away:home;
  if(hOk) return home;
  if(aOk) return away;
  return null;
}

function calcScore(userKey){
  const picks=getMergedPicks(userKey);
  let pts=0;
  for(const mid in ST.results.group){
    const raw=ST.results.group[mid];
    // Support both old string format and new object format
    const res=typeof raw==="object"?raw.result:raw;
    const p=picks.group[mid];
    if(!p||!res) continue;
    // Score only the player's own pick: a correct draw earns groupDraw, a
    // correct win/loss earns groupCorrect, anything else (incl. picking a side
    // on a match that ended in a draw) is a wrong pick.
    if(p===res)pts+=(res==="D"?SC.groupDraw:SC.groupCorrect);
    else pts+=SC.groupWrong;
  }
  for(const key in ST.results.ko){
    if(key.endsWith("_t3")) continue; // skip T3 team name keys
    const res=ST.results.ko[key];
    if(!res) continue;
    const rnd=key.split("_")[0];const sc=SC.ko[rnd];
    if(!sc) continue;
    // Bonus follows the TEAM, not the slot: credit base + early-pick bonus iff
    // the player picked the winning team to win SOME match in this KO round.
    const br=koBonusRound(userKey,rnd,res);
    if(br) pts+=sc.base+(sc.bonus[br-1]||0);
  }
  return pts;
}

/* Detailed scoring for a user — totals by stage and by the round each pick was
   first locked (group picks count as Round 1). Mirrors calcScore exactly, so
   byStage and byRound each sum to the same total calcScore returns. */
function roundPoints(userKey){
  const picks=getMergedPicks(userKey);
  const byRound={1:0,2:0,3:0};
  const byStage={group:0,r32:0,r16:0,qf:0,sf:0,third:0,final:0};
  let total=0;
  for(const mid in ST.results.group){
    const raw=ST.results.group[mid];
    const res=typeof raw==="object"?raw.result:raw;
    const p=picks.group[mid];
    if(!p||!res) continue;
    let pt; if(p===res)pt=(res==="D"?SC.groupDraw:SC.groupCorrect); else pt=SC.groupWrong;
    byStage.group+=pt; byRound[1]+=pt; total+=pt;
  }
  for(const key in ST.results.ko){
    if(key.endsWith("_t3")) continue;
    const res=ST.results.ko[key];
    if(!res) continue;
    const rnd=key.split("_")[0];const sc=SC.ko[rnd];
    if(!sc) continue;
    // Bonus follows the team across rounds; attribute points to the round the
    // team was FIRST picked for this KO round.
    const br=koBonusRound(userKey,rnd,res);
    if(!br) continue;
    const pt=sc.base+(sc.bonus[br-1]||0);
    byStage[rnd]+=pt; byRound[br]=(byRound[br]||0)+pt; total+=pt;
  }
  return {byRound,byStage,total};
}

/* A points-breakdown card. focusRound (optional) adds a line attributing points
   to the picks first locked in that round. */
function renderPointsBreakdown(userKey,focusRound){
  const anyResults=Object.keys(ST.results.group).length>0||Object.keys(ST.results.ko).length>0;
  let html='<div class="card"><div class="card-title">Points breakdown</div>';
  if(!anyResults){
    return html+'<div class="notice-blue" style="margin-bottom:0">No match results entered yet — points will appear here once the admin records results.</div></div>';
  }
  const {byRound,byStage,total}=roundPoints(userKey);
  const rows=[['Group stage','group'],['Round of 32','r32'],['Round of 16','r16'],['Quarterfinals','qf'],['Semifinals','sf'],['3rd-place match','third'],['Final','final']];
  html+='<table style="width:100%;font-size:13px;border-collapse:collapse">';
  rows.forEach(function(rw){
    html+='<tr><td style="padding:4px 0;color:var(--muted)">'+rw[0]+'</td>'+
      '<td style="text-align:right;font-weight:600">'+byStage[rw[1]]+' pts</td></tr>';
  });
  html+='<tr style="border-top:2px solid var(--border)"><td style="padding:6px 0;font-weight:700">Total</td>'+
    '<td style="text-align:right;font-weight:700;color:var(--fifa-blue)">'+total+' pts</td></tr></table>';
  if(focusRound){
    html+='<div class="notice" style="margin-top:10px;margin-bottom:0">Points from picks first locked in <strong>Round '+focusRound+'</strong>: <strong>'+(byRound[focusRound]||0)+' pts</strong></div>';
  }
  return html+'</div>';
}

function getUserRound(userKey,rn){
  const u=ST.users[userKey];
  if(!u||!u.rounds||!u.rounds[rn]) return{picks:{group:{},ko:{}},submitted:false};
  return u.rounds[rn];
}

function getDraft(){
  const pr=ST.predRound;
  const u=ST.users[CU.key];
  if(!u) return{group:{},ko:{}};
  if(!u.rounds) u.rounds={};
  if(!u.rounds[pr]) u.rounds[pr]={picks:{group:{},ko:{}},submitted:false};
  if(!u.rounds[pr].picks) u.rounds[pr].picks={group:{},ko:{}};
  return u.rounds[pr].picks;
}

/* Count missing required picks for current prediction round */
function countMissing(){
  const pr=ST.predRound;
  const draft=getDraft();
  let miss=0;
  if(pr===1){
    for(const g in GM) for(const m of GM[g]) if(!draft.group||!draft.group[m.id]) miss++;
    const standings=predictedStandings(draft.group||{});
    for(let i=0;i<16;i++){
      const seed=R32_SEEDS[i];
      if(seed.b.t==="T3"||seed.a.t==="T3"){
        // T3 match: need both the winner pick AND the t3 team pick (if candidates exist)
        const knownSeed=seed.b.t==="T3"?seed.a:seed.b;
        const knownTeam=slotTeam(knownSeed,standings);
        if(!knownTeam) continue; // group not complete yet
        const t3Cands=getT3Candidates(i,standings);
        if(t3Cands.length>0&&(!draft.ko||!draft.ko['r32_'+i+'_t3'])) miss++; // t3 team pick
        if(!draft.ko||!draft.ko['r32_'+i]) miss++; // winner pick
      } else {
        const ta=slotTeam(seed.a,standings);
        const tb=slotTeam(seed.b,standings);
        if(ta&&tb&&(!draft.ko||!draft.ko['r32_'+i])) miss++;
      }
    }
    const r16Pairs=getR16Pairs(draft);
    r16Pairs.forEach((pair,i)=>{if(pair.a&&pair.b&&(!draft.ko||!draft.ko['r16_'+i])) miss++;});
    const qfPairs=getQFPairs(draft);
    qfPairs.forEach((pair,i)=>{if(pair.a&&pair.b&&(!draft.ko||!draft.ko['qf_'+i])) miss++;});
    const sfPairs=getSFPairs(draft);
    sfPairs.forEach((pair,i)=>{if(pair.a&&pair.b&&(!draft.ko||!draft.ko['sf_'+i])) miss++;});
    const fp=getFinalPair(draft);
    if(fp.a&&fp.b&&(!draft.ko||!draft.ko["final_0"])) miss++;
  } else if(pr===3){
    // Round 3: only the final pick needed
    const adminFinal=(ST.results.koMatches['final']&&ST.results.koMatches['final'][0])||null;
    if(adminFinal&&adminFinal.home&&adminFinal.away){
      if(!draft.ko||!draft.ko['final_0']) miss++;
    }
  } else {
    // Round 2: full bracket. R32 is seeded from the actual group results;
    // R16/QF/SF/Final cascade from the user's own picks (same as Round 1).
    const actualR32=buildActualR32Matchups();
    for(let i=0;i<16;i++){
      if(actualR32[i].home&&actualR32[i].away&&(!draft.ko||!draft.ko['r32_'+i])) miss++;
    }
    const r16Pairs=getR16Pairs(draft);
    r16Pairs.forEach((pair,i)=>{if(pair.a&&pair.b&&(!draft.ko||!draft.ko['r16_'+i])) miss++;});
    const qfPairs=getQFPairs(draft);
    qfPairs.forEach((pair,i)=>{if(pair.a&&pair.b&&(!draft.ko||!draft.ko['qf_'+i])) miss++;});
    const sfPairs=getSFPairs(draft);
    sfPairs.forEach((pair,i)=>{if(pair.a&&pair.b&&(!draft.ko||!draft.ko['sf_'+i])) miss++;});
    const fp=getFinalPair(draft);
    if(fp.a&&fp.b&&(!draft.ko||!draft.ko["final_0"])) miss++;
  }
  return miss;
}

/* ══ BRACKET CASCADE ══
   In Round 1, bracket is self-contained:
   R32 comes from group picks → R16 comes from R32 picks → QF from R16 → SF from QF → Final from SF
*/
/* Resolve a pick value — if "__t3__", return the actual T3 team name stored in baseKey+"_t3" */
function resolvePick(draft,baseKey){
  const ko=draft.ko||{};
  const raw=ko[baseKey];
  if(!raw) return null;
  // Normalise — picks stored as {team,round} objects after the data model fix
  const val=typeof raw==="object"?raw.team:raw;
  if(!val) return null;
  if(val==="__t3__") return ko[baseKey+"_t3"]||null;
  return val;
}

/* All KO cascades use the corrected real-bracket feed map (KO_FEED) so a user's
   predicted winners flow forward exactly as the tournament bracket does. */
function getR16Pairs(draft){
  const pairs=[];
  for(let i=0;i<8;i++){ const f=KO_FEED.r16[i]; pairs.push({a:resolvePick(draft,'r32_'+f[0]),b:resolvePick(draft,'r32_'+f[1])}); }
  return pairs;
}

function getQFPairs(draft){
  const pairs=[];
  for(let i=0;i<4;i++){ const f=KO_FEED.qf[i]; pairs.push({a:resolvePick(draft,'r16_'+f[0]),b:resolvePick(draft,'r16_'+f[1])}); }
  return pairs;
}

function getSFPairs(draft){
  return [0,1].map(i=>{ const f=KO_FEED.sf[i]; return {a:resolvePick(draft,'qf_'+f[0]),b:resolvePick(draft,'qf_'+f[1])}; });
}

function getFinalPair(draft){
  const f=KO_FEED.final[0];
  return {a:resolvePick(draft,'sf_'+f[0]),b:resolvePick(draft,'sf_'+f[1])};
}

/* 3rd-place pair for a player's bracket = the two SF LOSERS (the team in each SF
   matchup the player did NOT pick to win). */
function getThirdPair(draft){
  const sf=getSFPairs(draft);
  const loser=i=>{
    const p=sf[i]; if(!p||!p.a||!p.b) return null;
    const pick=resolvePick(draft,'sf_'+i); if(!pick) return null;
    return pick===p.a?p.b:(pick===p.b?p.a:null);
  };
  return {a:loser(0),b:loser(1)};
}

/* ══ RENDER ══ */
function render(){
  const root=document.getElementById("root");
  if(VIEW==="landing")     {root.innerHTML=renderLanding();    bindLanding();}
  else if(VIEW==="create") {root.innerHTML=renderCreatePool(); bindCreatePool();}
  else if(VIEW==="join")   {root.innerHTML=renderJoin();       bindJoin();}
  else if(VIEW==="login")  {root.innerHTML=renderLogin();      bindLogin();}
  else if(VIEW==="super"&&SA_GLOBAL){root.innerHTML=renderGlobalResults(); bindGlobalResults();}
  else if(VIEW==="super"&&SA_SUBMIT){root.innerHTML=renderSubmitTimes(); bindSubmitTimes();}
  else if(VIEW==="super"&&SA_MOVE){root.innerHTML=renderMovement(); bindMovement();}
  else if(VIEW==="super")  {root.innerHTML=renderSuperAdmin(); bindSuperAdmin();}
  else                     {root.innerHTML=renderMain();       bindMain();}
}

function bindJoin(){
  document.getElementById("joinBack").onclick=()=>{
    CURRENT_POOL=null;CURRENT_POOL_CODE=null;setURLPool(null);VIEW="landing";render();
  };
  // Sign in
  document.getElementById("liBtn").onclick=()=>{
    const name=document.getElementById("liN").value.trim();
    const pin=document.getElementById("liP").value.trim();
    const err=document.getElementById("liErr");
    if(!name||!pin){err.textContent="Enter name and PIN.";return;}
    const key=nk(name);const user=ST.users[key];
    if(!user){err.textContent="Name not found. Register below first.";return;}
    if(user.pin!==pin){err.textContent="Wrong PIN.";return;}
    CU={key,displayName:user.displayName,pin:user.pin};
    VIEW="main";TAB="picks";listenForUpdates();render();
  };
  document.getElementById("liP").onkeydown=e=>{if(e.key==="Enter")document.getElementById("liBtn").click();};
  // Register — absent when the pool is locked (no card rendered).
  const rBtn=document.getElementById("rBtn");
  if(rBtn) rBtn.onclick=()=>{
    const pass=document.getElementById("jpPass").value.trim();
    const name=document.getElementById("rN").value.trim();
    const pin=document.getElementById("rP").value.trim();
    const err=document.getElementById("rErr");
    if(!pass||!name||!pin){err.textContent="All fields required.";return;}
    const storedPw=CURRENT_POOL?CURRENT_POOL.joinPassword:"";
    if(CURRENT_POOL&&pass.toLowerCase()!==storedPw.toLowerCase()){
      err.textContent="Wrong join password. Try again.";return;
    }
    if(!/^\d{4}$/.test(pin)){err.textContent="PIN must be 4 digits.";return;}
    const key=nk(name);
    if(ST.users[key]){err.textContent="Name already taken in this pool.";return;}
    // Defensive live check: the super admin may have locked the pool after this
    // page loaded. Confirm against the latest state before admitting a player.
    const proceed=()=>{
      ST.users[key]={displayName:name,pin,rounds:{},history:[]};
      CU={key,displayName:name,pin};
      saveST();
      VIEW="main";TAB="picks";listenForUpdates();render();
    };
    if(db&&CURRENT_POOL_CODE){
      rBtn.disabled=true;
      db.ref("pools/"+CURRENT_POOL_CODE+"/locked").once("value").then(snap=>{
        if(snap.val()){
          if(CURRENT_POOL) CURRENT_POOL.locked=true;
          err.textContent="This pool is now locked — no new players can join.";
          render();
          return;
        }
        proceed();
      }).catch(()=>{ rBtn.disabled=false; proceed(); });
    } else proceed();
  };
}

function bindSuperAdmin(){
  if(!IS_SUPER_ADMIN){
    document.getElementById("saBack").onclick=()=>{VIEW="landing";render();};
    document.getElementById("saBtn").onclick=()=>{
      const pin=document.getElementById("saPin").value.trim();
      const err=document.getElementById("saErr");
      if(pin!==SUPER_ADMIN_PIN){err.textContent="Incorrect PIN.";return;}
      IS_SUPER_ADMIN=true;render();
    };
    document.getElementById("saPin").onkeydown=e=>{if(e.key==="Enter")document.getElementById("saBtn").click();};
    return;
  }
  document.getElementById("saLogout").onclick=()=>{IS_SUPER_ADMIN=false;VIEW="landing";render();};

  function renderPoolList(){
    loadAllPools((err,pools)=>{
      const el=document.getElementById("saPoolList");
      if(!el) return;
      if(err){el.innerHTML='<div class="notice-red">Error loading pools: '+err+'</div>';return;}
      if(!pools||!pools.length){
        el.innerHTML='<div class="notice-blue">No pools created yet.</div>';return;
      }

      let html='<div style="font-size:12px;color:var(--muted);margin-bottom:8px">'+
        pools.length+' pool'+(pools.length!==1?"s":"")+'</div>';

      pools.forEach(pool=>{
        const userCount=Object.keys(pool.users||{}).length;
        const statusColor=pool.tournament==="done"?"var(--green)":"var(--fifa-blue-mid)";
        const isLocked=!!pool.locked;
        const isSandbox=!!pool.sandbox;
        const lockBadge=isLocked?'&nbsp;·&nbsp;<span style="color:var(--red);font-weight:600">&#128274; Locked</span>':'';
        const sandboxBadge=isSandbox?'&nbsp;·&nbsp;<span style="color:var(--navy);font-weight:700">&#129514; Sandbox</span>':'';
        html+=
          '<div style="background:var(--card);border:1px solid var(--border);border-radius:10px;padding:14px;margin-bottom:10px" data-pool-card="'+pool.code+'">'+
            '<div style="display:flex;align-items:flex-start;gap:10px;flex-wrap:wrap">'+
              '<div style="flex:1;min-width:160px">'+
                '<div style="font-weight:700;font-size:15px;color:var(--fifa-blue)">'+pool.name+'</div>'+
                '<div style="font-size:11px;color:var(--muted);margin-top:3px">'+
                  'Code: <strong>'+pool.code+'</strong> &nbsp;·&nbsp; '+
                  userCount+' player'+(userCount!==1?"s":"")+'&nbsp;·&nbsp;'+
                  '<span style="color:'+statusColor+'">Round '+pool.predRound+(pool.tournament==="done"?" · Complete":""  )+'</span>'+
                  lockBadge+sandboxBadge+
                '</div>'+
                '<div style="font-size:11px;color:var(--muted);margin-top:2px">'+
                  'Join pwd: <strong>'+(pool.joinPassword||"—")+'</strong>'+
                '</div>'+
              '</div>'+
              '<div style="display:flex;gap:6px;flex-wrap:wrap;align-items:center">'+
                '<button class="btn-sm" data-enter-pool="'+pool.code+'">&#9654; Enter</button>'+
                '<button class="btn-sm'+(isLocked?'':' btn-danger')+'" data-lock-pool="'+pool.code+'" data-locked="'+(isLocked?"1":"0")+'">'+(isLocked?'&#128275; Unlock joining':'&#128274; Lock joining')+'</button>'+
                '<button class="btn-sm'+(isSandbox?' btn-navy':'')+'" data-sandbox-pool="'+pool.code+'" data-sandbox="'+(isSandbox?"1":"0")+'" title="Sandbox = this pool\'s local results never seed/leak up to Global Results, but global pushes still reach it">'+(isSandbox?'&#129514; Sandbox: ON':'&#129514; Mark sandbox')+'</button>'+
                '<button class="btn-sm" data-rename-pool="'+pool.code+'" data-pool-name="'+pool.name+'">&#9998; Rename</button>'+
                '<button class="btn-sm btn-danger" data-delete-pool="'+pool.code+'">&#128465; Delete</button>'+
              '</div>'+
            '</div>'+
            '<div id="rename-form-'+pool.code+'" style="display:none;margin-top:10px;display:none">'+
              '<input id="rename-input-'+pool.code+'" value="'+pool.name+'" style="margin-bottom:6px"/>'+
              '<div style="display:flex;gap:6px">'+
                '<button class="btn btn-navy" style="flex:1;padding:7px" data-rename-save="'+pool.code+'">Save</button>'+
                '<button class="btn btn-outline" style="flex:1;padding:7px" data-rename-cancel="'+pool.code+'">Cancel</button>'+
              '</div>'+
            '</div>'+
          '</div>';
      });

      el.innerHTML=html;

      // ── Enter Pool ──────────────────────────────────────────────
      el.querySelectorAll("[data-enter-pool]").forEach(btn=>{
        btn.onclick=()=>{
          const code=btn.dataset.enterPool;
          btn.textContent="Loading...";
          loadPool(code,(loadErr)=>{
            if(loadErr){
              btn.textContent="&#9654; Enter";
              showConfirmModal("Error loading pool: "+loadErr, ()=>{});
              return;
            }
            setURLPool(code);
            // Add super admin as a virtual user so renderMain works
            if(!ST.users["u_superadmin"]){
              ST.users["u_superadmin"]={displayName:"Super Admin",pin:SUPER_ADMIN_PIN,rounds:{},history:[],isSuperAdmin:true};
            }
            CU={key:"u_superadmin",displayName:"Super Admin",pin:SUPER_ADMIN_PIN,isSuperAdmin:true};
            ADMIN_ON=true;
            VIEW="main";TAB="admin";
            listenForUpdates();
            render();
          });
        };
      });

      // ── Lock / Unlock joining ───────────────────────────────────
      // Toggles ONLY the pool's `locked` flag — never touches users,
      // picks, results, or any other pool setting.
      el.querySelectorAll("[data-lock-pool]").forEach(btn=>{
        btn.onclick=()=>{
          const code=btn.dataset.lockPool;
          const willLock=btn.dataset.locked!=="1";
          const card=el.querySelector("[data-pool-card='"+code+"']");
          const name=card?card.querySelector("[style*='font-weight:700']").textContent:code;
          const msg=willLock
            ?'Lock "'+name+'"? No new players will be able to join. Existing players keep full access.'
            :'Unlock "'+name+'"? New players will be able to join again.';
          showConfirmModal(msg,()=>{
            btn.disabled=true; btn.textContent="Saving...";
            const done=()=>renderPoolList();
            if(IS_FIREBASE_CONFIGURED&&db){
              db.ref("pools/"+code+"/locked").set(willLock).then(done)
                .catch(e=>{ btn.disabled=false; showConfirmModal("Error: "+e.message,()=>{}); });
            } else {
              const pools=LS.get("pools")||{};
              if(pools[code]) pools[code].locked=willLock;
              LS.set("pools",pools); done();
            }
          });
        };
      });

      // ── Mark pool as Sandbox (Global Results ignores it: never reads its
      //    results, never pushes to it — so it's a safe local tester) ─────
      el.querySelectorAll("[data-sandbox-pool]").forEach(btn=>{
        btn.onclick=()=>{
          const code=btn.dataset.sandboxPool;
          const willSandbox=btn.dataset.sandbox!=="1";
          const card=el.querySelector("[data-pool-card='"+code+"']");
          const name=card?card.querySelector("[style*='font-weight:700']").textContent:code;
          const msg=willSandbox
            ?'Mark "'+name+'" as a Sandbox? Global Results will ignore it — it won’t read this pool’s results and global pushes won’t touch it. Use it to test freely. Its own picks/results are unchanged.'
            :'Remove Sandbox from "'+name+'"? Global Results will read and push to it again like a normal pool.';
          showConfirmModal(msg,()=>{
            btn.disabled=true; btn.textContent="Saving...";
            const done=()=>renderPoolList();
            if(IS_FIREBASE_CONFIGURED&&db){
              db.ref("pools/"+code+"/sandbox").set(willSandbox).then(done)
                .catch(e=>{ btn.disabled=false; showConfirmModal("Error: "+e.message,()=>{}); });
            } else {
              const pools=LS.get("pools")||{};
              if(pools[code]) pools[code].sandbox=willSandbox;
              LS.set("pools",pools); done();
            }
          });
        };
      });

      // ── Rename Pool ─────────────────────────────────────────────
      el.querySelectorAll("[data-rename-pool]").forEach(btn=>{
        btn.onclick=()=>{
          const code=btn.dataset.renamePool;
          const form=document.getElementById("rename-form-"+code);
          if(form) form.style.display=form.style.display==="none"?"block":"none";
        };
      });
      el.querySelectorAll("[data-rename-save]").forEach(btn=>{
        btn.onclick=()=>{
          const code=btn.dataset.renameSave;
          const inp=document.getElementById("rename-input-"+code);
          const newName=(inp?inp.value.trim():"");
          if(!newName){return;}
          // Update in Firebase or localStorage
          if(IS_FIREBASE_CONFIGURED&&db){
            db.ref("pools/"+code+"/name").set(newName).then(()=>{
              renderPoolList();
            });
          } else {
            const pools=LS.get("pools")||{};
            if(pools[code]) pools[code].name=newName;
            LS.set("pools",pools);
            renderPoolList();
          }
        };
      });
      el.querySelectorAll("[data-rename-cancel]").forEach(btn=>{
        btn.onclick=()=>{
          const code=btn.dataset.renameCancel;
          const form=document.getElementById("rename-form-"+code);
          if(form) form.style.display="none";
        };
      });

      // ── Delete Pool ─────────────────────────────────────────────
      el.querySelectorAll("[data-delete-pool]").forEach(btn=>{
        btn.onclick=()=>{
          const code=btn.dataset.deletePool;
          const card=el.querySelector("[data-pool-card='"+code+"']");
          const name=card?card.querySelector("[style*='font-weight:700']").textContent:code;
          showConfirmModal("Delete pool \""+name+"\"? This permanently removes all picks and results.",()=>{
            if(IS_FIREBASE_CONFIGURED&&db){
              db.ref("pools/"+code).remove().then(()=>{
                renderPoolList();
              }).catch(e=>showConfirmModal("Error deleting: "+e.message,()=>{}));
            } else {
              const pools=LS.get("pools")||{};
              delete pools[code];
              LS.set("pools",pools);
              renderPoolList();
            }
          });
        };
      });
    });
  }

  renderPoolList();
  const refreshBtn=document.getElementById("saRefresh");
  if(refreshBtn) refreshBtn.onclick=renderPoolList;

  const globalBtn=document.getElementById("saGlobalResults");
  if(globalBtn) globalBtn.onclick=()=>openGlobalResults(globalBtn);

  const submitBtn=document.getElementById("saSubmitTimes");
  if(submitBtn) submitBtn.onclick=()=>openSubmitTimes(submitBtn);

  const moveBtn=document.getElementById("saMovement");
  if(moveBtn) moveBtn.onclick=()=>openMovement(moveBtn);

  // Global announcement box — prefill from the live value, post/clear write the
  // single /globalAnnouncement field.
  const gMsg=document.getElementById("saGlobalMsg");
  const gStatus=document.getElementById("saGlobalMsgStatus");
  if(gMsg&&db){
    db.ref("globalAnnouncement").once("value").then(snap=>{ if(document.getElementById("saGlobalMsg")) gMsg.value=snap.val()||""; }).catch(()=>{});
  }
  const gPost=document.getElementById("saGlobalPost");
  if(gPost) gPost.onclick=()=>{
    const text=(gMsg?gMsg.value:"").trim();
    if(!text){ if(gStatus){gStatus.textContent="Type a message first (or use Clear).";} return; }
    showConfirmModal("Post this global announcement to ALL pools? Every player will see it below the banner.",()=>{
      gPost.disabled=true;
      setGlobalAnnouncement(text).then(()=>{ if(gStatus){gStatus.textContent="✓ Posted to all pools.";} gPost.disabled=false; })
        .catch(e=>{ if(gStatus){gStatus.textContent="Error: "+e.message+" (check Firebase rules for /globalAnnouncement)";} gPost.disabled=false; });
    });
  };
  const gClear=document.getElementById("saGlobalClear");
  if(gClear) gClear.onclick=()=>{
    showConfirmModal("Clear the global announcement everywhere?",()=>{
      gClear.disabled=true;
      setGlobalAnnouncement(null).then(()=>{ if(gMsg) gMsg.value=""; if(gStatus){gStatus.textContent="✓ Cleared.";} gClear.disabled=false; })
        .catch(e=>{ if(gStatus){gStatus.textContent="Error: "+e.message;} gClear.disabled=false; });
    });
  };
}

/* Open the Global Results screen: detach any per-pool listener, load every
   pool, seed GLOBAL_RESULTS from the union of their results, then render. */
function openGlobalResults(btn){
  GLOBAL_MSG=null;
  if(btn){btn.disabled=true;btn.textContent="Loading...";}
  // Detach any stale per-pool realtime listener so it can't fire setTab() here.
  if(_updateListener&&CURRENT_POOL_CODE&&db){
    db.ref("pools/"+CURRENT_POOL_CODE).off("value",_updateListener);
    _updateListener=null;
  }
  loadAllPools((err,pools)=>{
    if(err){ showConfirmModal("Error loading pools: "+err,()=>{}); if(btn){btn.disabled=false;btn.innerHTML="&#9917; Global Results";} return; }
    pools=pools||[];
    // Sandbox pools are one-way testers: Global Results never READS from them
    // (their local results don't seed or leak up here), but global pushes still
    // reach them downward. Exclude them from the seed-merge source only.
    pools=pools.filter(p=>!p.sandbox);
    GLOBAL_POOLS=pools.map(p=>({code:p.code,name:p.name,players:Object.keys(p.users||{}).filter(k=>k!=="u_superadmin").length}));
    // Seed working copy from the union of all (non-sandbox) pools' results. Since
    // results are meant to be identical across pools (kept in sync via global
    // push), taking the first non-empty value per match key reflects canon.
    const merged={group:{},ko:{},koMatches:{}};
    pools.forEach(p=>{
      const r=normResults(p.results);
      Object.keys(r.group).forEach(k=>{ if(merged.group[k]===undefined) merged.group[k]=r.group[k]; });
      Object.keys(r.ko).forEach(k=>{ if(merged.ko[k]===undefined) merged.ko[k]=r.ko[k]; });
      Object.keys(r.koMatches).forEach(rnd=>{
        if(!merged.koMatches[rnd]) merged.koMatches[rnd]=[];
        // Firebase returns a sparse array as an OBJECT keyed by index (e.g. after
        // per-slot pushes like results/koMatches/r32/6), so iterate keys to
        // tolerate both array and object shapes.
        const arr=r.koMatches[rnd]||{};
        Object.keys(arr).forEach(i=>{ const m=arr[i]; if(m&&!merged.koMatches[rnd][i]) merged.koMatches[rnd][i]=m; });
      });
    });
    GLOBAL_RESULTS=merged;
    // Point ST.results at the working copy so shared helpers (actualStandings,
    // cascade) read it. Stash the real one to restore on exit.
    GLOBAL_SAVED_RESULTS=ST.results;
    ST.results=GLOBAL_RESULTS;
    SA_GLOBAL=true;
    render();
  });
}

/* Leave the Global Results screen and return to the pool list. */
function closeGlobalResults(){
  SA_GLOBAL=false; GLOBAL_MSG=null;
  if(GLOBAL_SAVED_RESULTS){ ST.results=GLOBAL_SAVED_RESULTS; GLOBAL_SAVED_RESULTS=null; }
  render();
}

/* ══ SUBMISSION TIMES (super admin, READ-ONLY) ══
   Surfaces the timestamps already stored in each user's history. Never writes. */

/* Round 1 deadline = first match kickoff, Mexico vs South Africa,
   Jun 11 2026 2:00 PM ET (EDT = UTC-4) → 18:00 UTC. */
const R1_DEADLINE=Date.UTC(2026,5,11,18,0,0);

/* Latest submission ts for a given round (handles resubmissions). */
function getRoundSubmitTs(user,round){
  if(!user||!user.history) return null;
  let latest=null;
  user.history.forEach(h=>{
    if(h&&h.predRound===round&&typeof h.ts==="number"){
      if(latest===null||h.ts>latest) latest=h.ts;
    }
  });
  return latest;
}

/* Whether a round's latest submission was made by the super admin on behalf. */
function roundSubmittedBy(user,round){
  if(!user||!user.history) return null;
  let latest=null,by=null;
  user.history.forEach(h=>{
    if(h&&h.predRound===round&&typeof h.ts==="number"){
      if(latest===null||h.ts>latest){ latest=h.ts; by=h.submittedBy||null; }
    }
  });
  return by;
}

/* Format a ms timestamp as Eastern Time (EDT, UTC-4 during the tournament). */
function fmtSubmitTime(ts){
  if(!ts) return "—";
  const et=new Date(ts-4*60*60*1000);
  const days=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
  const mons=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  let h=et.getUTCHours(); const m=et.getUTCMinutes();
  const ampm=h>=12?'PM':'AM'; h=h%12; if(h===0)h=12;
  const mm=m<10?'0'+m:m;
  return days[et.getUTCDay()]+' '+mons[et.getUTCMonth()]+' '+et.getUTCDate()+', '+h+':'+mm+' '+ampm+' ET';
}

/* Open the read-only Submission Times screen. Loads all pools (full objects,
   incl. users+history) and shows the first by default. */
function openSubmitTimes(btn){
  if(btn){btn.disabled=true;btn.textContent="Loading...";}
  if(_updateListener&&CURRENT_POOL_CODE&&db){
    db.ref("pools/"+CURRENT_POOL_CODE).off("value",_updateListener);
    _updateListener=null;
  }
  loadAllPools((err,pools)=>{
    if(err){ showConfirmModal("Error loading pools: "+err,()=>{}); if(btn){btn.disabled=false;btn.innerHTML="&#128340; Submission Times";} return; }
    SUBMIT_POOLS=pools||[];
    if(!SUBMIT_SELECTED||!SUBMIT_POOLS.some(p=>p.code===SUBMIT_SELECTED)){
      SUBMIT_SELECTED=SUBMIT_POOLS.length?SUBMIT_POOLS[0].code:null;
    }
    SA_SUBMIT=true;
    render();
  });
}

function closeSubmitTimes(){ SA_SUBMIT=false; render(); }

function renderSubmitTimes(){
  let html='<div style="padding:16px">'+
    '<div style="display:flex;align-items:center;gap:10px;margin-bottom:8px">'+
      '<button class="btn-sm" id="stBack">&#8592; Back to pools</button>'+
      '<div style="font-family:Bebas Neue,sans-serif;font-size:20px;color:var(--fifa-blue)">&#128340; Submission Times</div>'+
    '</div>'+
    '<div class="notice-blue" style="margin-bottom:12px">Read-only view of when each player submitted each round (Eastern Time). The Round&nbsp;1 deadline is the first kickoff — <strong>Jun 11, 2:00 PM ET</strong>.</div>';

  if(!SUBMIT_POOLS.length){
    html+='<div class="notice-blue">No pools created yet.</div></div>';
    return html;
  }

  // Pool selector
  html+='<div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px">'+
    '<label style="font-size:12px;color:var(--muted)">Pool:</label>'+
    '<select id="stPool" class="asel" style="flex:0 0 auto">';
  SUBMIT_POOLS.forEach(p=>{
    html+='<option value="'+p.code+'"'+(p.code===SUBMIT_SELECTED?" selected":"")+'>'+p.name+' ('+p.code+')</option>';
  });
  html+='</select>'+
    '<label style="font-size:12px;color:var(--muted);margin-left:8px">Sort:</label>'+
    '<select id="stSort" class="asel" style="flex:0 0 auto">'+
      '<option value="name"'+(SUBMIT_SORT==="name"?" selected":"")+'>Name</option>'+
      '<option value="r1"'+(SUBMIT_SORT==="r1"?" selected":"")+'>Round 1 (earliest first)</option>'+
    '</select>'+
  '</div>';

  const pool=SUBMIT_POOLS.find(p=>p.code===SUBMIT_SELECTED);
  const users=Object.entries((pool&&pool.users)||{}).filter(([k,u])=>!isSuperAdminEntry(k,u));

  // Summary line (Round 1)
  let before=0,after=0,notSub=0;
  users.forEach(([k,u])=>{
    const ts=getRoundSubmitTs(u,1);
    if(!ts){ notSub++; return; }
    if(ts<=R1_DEADLINE) before++; else after++;
  });
  html+='<div class="notice'+(after>0?'-red':'')+'" style="margin-bottom:10px">'+
    '<strong>'+before+'</strong> of <strong>'+users.length+'</strong> player'+(users.length!==1?'s':'')+' submitted Round&nbsp;1 before kickoff. '+
    '<strong>'+after+'</strong> submitted after.'+(notSub?' <strong>'+notSub+'</strong> not yet submitted.':'')+
  '</div>';

  // Sort rows
  const rows=users.slice();
  if(SUBMIT_SORT==="r1"){
    rows.sort((a,b)=>{
      const ta=getRoundSubmitTs(a[1],1), tb=getRoundSubmitTs(b[1],1);
      if(ta===null&&tb===null) return 0;
      if(ta===null) return 1; if(tb===null) return -1;
      return ta-tb;
    });
  } else {
    rows.sort((a,b)=>((a[1].displayName||a[0]).toLowerCase()<(b[1].displayName||b[0]).toLowerCase()?-1:1));
  }

  // Cell renderer
  const cell=(u,round)=>{
    const ts=getRoundSubmitTs(u,round);
    const by=roundSubmittedBy(u,round);
    const submittedFlag=u.rounds&&u.rounds[round]&&u.rounds[round].submitted;
    if(!ts){
      if(submittedFlag) return '<span style="color:var(--muted)">submitted (no timestamp)</span>';
      return '<span style="color:var(--muted)">—</span>';
    }
    const late=round===1&&ts>R1_DEADLINE;
    const color=late?'var(--red)':'var(--green)';
    let s='<span style="color:'+color+';font-weight:500">'+fmtSubmitTime(ts)+'</span>';
    if(late) s+=' <span style="display:inline-block;background:#b00020;color:#fff;font-size:10px;font-weight:600;padding:1px 6px;border-radius:8px;white-space:nowrap">&#9888; after kickoff</span>';
    if(by) s+=' <span style="font-size:10px;color:var(--muted)">(by '+by+')</span>';
    return s;
  };

  html+='<div class="card" style="padding:0;overflow-x:auto">'+
    '<table style="width:100%;border-collapse:collapse;font-size:12px">'+
      '<tr style="background:#f5f5f2;color:var(--muted)">'+
        '<th style="text-align:left;padding:8px 10px">Player</th>'+
        '<th style="text-align:left;padding:8px 10px">Round 1</th>'+
        '<th style="text-align:left;padding:8px 10px">Round 2</th>'+
        '<th style="text-align:left;padding:8px 10px">Round 3</th>'+
      '</tr>';
  if(!rows.length){
    html+='<tr><td colspan="4" style="padding:12px;text-align:center;color:var(--muted)">No players in this pool yet.</td></tr>';
  }
  rows.forEach(([k,u])=>{
    html+='<tr style="border-top:1px solid var(--border)">'+
      '<td style="padding:8px 10px;font-weight:600">'+(u.displayName||k)+'</td>'+
      '<td style="padding:8px 10px">'+cell(u,1)+'</td>'+
      '<td style="padding:8px 10px">'+cell(u,2)+'</td>'+
      '<td style="padding:8px 10px">'+cell(u,3)+'</td>'+
    '</tr>';
  });
  html+='</table></div>';

  html+='</div>';
  return html;
}

function bindSubmitTimes(){
  const back=document.getElementById("stBack");
  if(back) back.onclick=closeSubmitTimes;
  const poolSel=document.getElementById("stPool");
  if(poolSel) poolSel.onchange=()=>{ SUBMIT_SELECTED=poolSel.value; render(); };
  const sortSel=document.getElementById("stSort");
  if(sortSel) sortSel.onchange=()=>{ SUBMIT_SORT=sortSel.value; render(); };
}

/* ══ MOVEMENT ANALYSIS (super admin, READ-ONLY) ══
   Replays the tournament: standings "as of date X" are computed by temporarily
   filtering ST.results to matches on/before X, running calcScore, then ALWAYS
   restoring ST.results. Reuses calcScore/getMergedPicks/SC — no scoring changes. */

const MOVE_KO_DATES={r32:Date.UTC(2026,5,28),r16:Date.UTC(2026,6,4),qf:Date.UTC(2026,6,9),sf:Date.UTC(2026,6,14),third:Date.UTC(2026,6,18),final:Date.UTC(2026,6,19)};
const MOVE_KO_LABEL={r32:"Round of 32 · Jun 28",r16:"Round of 16 · Jul 4",qf:"Quarterfinals · Jul 9",sf:"Semifinals · Jul 14",third:"3rd-place · Jul 18",final:"Final · Jul 19"};

/* UTC sort key (the match's day) for a result key. */
function matchDateKey(resultKey,isKo){
  if(isKo){
    const rnd=resultKey.split("_")[0];
    return MOVE_KO_DATES[rnd]||0;
  }
  for(const day of GROUP_SCHED){
    for(const row of day.m){
      const arr=GROUPS[row[1]]; if(!arr) continue;
      const i=arr.indexOf(row[2]), j=arr.indexOf(row[3]);
      if(i<0||j<0) continue;
      const id=row[1]+"_"+Math.min(i,j)+"_"+Math.max(i,j);
      if(id===resultKey) return day.s;
    }
  }
  return 0;
}

/* Standings (ranked) using only results on/before cutoffDateKey. Self-reverting. */
function standingsAsOf(cutoffDateKey){
  const fullResults=ST.results;
  let standings=[];
  try{
    const filtered={group:{},ko:{},koMatches:fullResults.koMatches||{}};
    Object.keys(fullResults.group||{}).forEach(k=>{
      if(matchDateKey(k,false)<=cutoffDateKey) filtered.group[k]=fullResults.group[k];
    });
    Object.keys(fullResults.ko||{}).forEach(k=>{
      if(k.endsWith("_t3")){ filtered.ko[k]=fullResults.ko[k]; return; }
      if(matchDateKey(k,true)<=cutoffDateKey) filtered.ko[k]=fullResults.ko[k];
    });
    ST.results=filtered;
    standings=Object.entries(ST.users)
      .filter(([k,u])=>!isSuperAdminEntry(k,u))
      .map(([k,u])=>({key:k,name:u.displayName||k,score:calcScore(k)}))
      .sort((a,b)=>b.score-a.score)
      .map((s,i)=>({...s,rank:i+1}));
  } finally {
    ST.results=fullResults; // ALWAYS restore
  }
  return standings;
}

/* "Thu Jun 11" from a UTC day key — weekday computed from the real date so it
   can't drift from the calendar. */
function moveFmtDay(ms){
  const d=new Date(ms);
  const days=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
  const mons=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  return days[d.getUTCDay()]+' '+mons[d.getUTCMonth()]+' '+d.getUTCDate();
}

/* Days (sort-key + label) that have at least one entered result. */
function moveResultDays(){
  const seen={};
  Object.keys(ST.results.group||{}).forEach(k=>{
    const d=matchDateKey(k,false);
    if(d) seen[d]=moveFmtDay(d);
  });
  Object.keys(ST.results.ko||{}).forEach(k=>{
    if(k.endsWith("_t3")) return;
    const d=matchDateKey(k,true);
    if(d){ seen[d]=MOVE_KO_LABEL[k.split("_")[0]]||"Knockout"; }
  });
  return Object.keys(seen).map(Number).sort((a,b)=>a-b).map(d=>({key:d,label:seen[d]}));
}

/* Individual results that occurred in (from, to]. */
function moveWindowMatches(from,to){
  const out=[];
  Object.keys(ST.results.group||{}).forEach(k=>{ const d=matchDateKey(k,false); if(d>from&&d<=to) out.push({key:k,isKo:false}); });
  Object.keys(ST.results.ko||{}).forEach(k=>{ if(k.endsWith("_t3")) return; const d=matchDateKey(k,true); if(d>from&&d<=to) out.push({key:k,isKo:true}); });
  return out;
}

/* Points a user earned/lost on one match (mirrors calcScore exactly). `userKey`
   is needed for the team-based KO bonus (koBonusRound). */
function movePointsForMatch(userKey,picks,m){
  if(!m.isKo){
    const raw=ST.results.group[m.key];
    const res=typeof raw==="object"?raw.result:raw;
    const p=picks.group[m.key];
    if(!p||!res) return {picked:!!p,pts:0,outcome:p||null};
    const pt=p===res?(res==="D"?SC.groupDraw:SC.groupCorrect):SC.groupWrong;
    return {picked:true,pts:pt,outcome:p,hit:p===res};
  }
  const res=ST.results.ko[m.key];
  const p=picks.ko[m.key];
  // `outcome`/`picked` describe the player's pick AT THIS SLOT (used to find
  // differentiating matches in the movement view). Points, however, follow the
  // TEAM and are keyed off the result — exactly like calcScore — so the totals
  // here agree with the leaderboard.
  let pickedTeam=p?p.team:null;
  if(pickedTeam==="__t3__") pickedTeam=picks.ko[m.key+"_t3"]||null;
  if(!res) return {picked:!!pickedTeam,pts:0,outcome:pickedTeam||null};
  const sc=SC.ko[m.key.split("_")[0]];
  if(!sc) return {picked:!!pickedTeam,pts:0,outcome:pickedTeam||null};
  // Team-based credit: the winner `res` scores iff it's in the player's merged
  // round picks (ruling a), with the early-pick bonus from the earliest round.
  const br=koBonusRound(userKey,m.key.split("_")[0],res);
  const pts=br?sc.base+(sc.bonus[br-1]||0):0;
  return {picked:!!pickedTeam,pts,outcome:pickedTeam||null,hit:!!br};
}

/* Readable result description for a match key. */
function moveDescribe(m){
  if(m.isKo){ const res=ST.results.ko[m.key]; return res?res+" advanced ("+(MOVE_KO_LABEL[m.key.split("_")[0]]||"KO").split(" · ")[0]+")":m.key; }
  const gm=findGM(m.key); if(!gm) return m.key;
  const raw=ST.results.group[m.key]; const res=typeof raw==="object"?raw.result:raw;
  if(res==="W") return gm.home+" beat "+gm.away;
  if(res==="L") return gm.away+" beat "+gm.home;
  if(res==="D") return gm.home+" drew "+gm.away;
  return gm.home+" vs "+gm.away;
}

/* Readable label for what a player picked on a match (r = movePointsForMatch).
   Group: W→home, L→away, D→"Draw". KO: the picked team. null if no pick. */
function movePickLabel(m,r){
  if(!r||!r.picked||r.outcome==null) return null;
  if(m.isKo) return r.outcome;
  if(r.outcome==="D") return "Draw";
  const gm=findGM(m.key); if(!gm) return r.outcome;
  return r.outcome==="W"?gm.home:gm.away;
}

/* "Today's matches" — the next unplayed matchday. Walks the full tournament
   schedule in date order and returns the first day object {label,sort,items}
   that still has at least one match with no result entered. null if the whole
   tournament has results. READ-ONLY. */
function moveNextUnplayedDay(){
  const sched=buildSchedule();
  for(const day of sched){
    const hasUnplayed=day.items.some(it=>
      it.kind==="group" ? !ST.results.group[it.id] : !ST.results.ko[it.rid+"_"+it.i]
    );
    if(hasUnplayed) return day;
  }
  return null;
}

/* Resolve a schedule item to display info {isKo,key,group,time,home,away}. */
function moveMatchInfo(it){
  if(it.kind==="group"){
    const parts=it.id.split("_");
    return {isKo:false,key:it.id,group:it.g,time:it.time||"",
            home:GROUPS[it.g][+parts[1]],away:GROUPS[it.g][+parts[2]]};
  }
  const teams=getKOMatchTeams(it.rid,it.i);
  const rLbl={r32:"R32",r16:"R16",qf:"QF",sf:"SF",final:"Final"}[it.rid]||it.rid;
  return {isKo:true,key:it.rid+"_"+it.i,group:rLbl,time:"",
          home:teams?teams.home:"TBD",away:teams?teams.away:"TBD"};
}

/* Pick distribution for one upcoming match: groups every (non-super-admin)
   player's pick by outcome label. Group: W→home, D→Draw, L→away. KO: the
   picked team (T3 placeholder resolved). READ-ONLY. */
function moveTodayMatchData(it){
  const info=moveMatchInfo(it);
  const buckets={};   // outcome label -> [display names]
  let noPick=0;
  Object.entries(ST.users).forEach(([k,u])=>{
    if(isSuperAdminEntry(k,u)) return;
    const picks=getMergedPicks(k);
    let label=null;
    if(it.kind==="group"){
      const p=picks.group[info.key];
      if(p) label=p==="W"?info.home:p==="D"?"Draw":info.away;
    } else {
      const pObj=picks.ko[info.key];
      let team=pObj?pObj.team:null;
      if(team==="__t3__") team=picks.ko[info.key+"_t3"]||null;
      label=team||null;
    }
    if(label==null){ noPick++; return; }
    (buckets[label]=buckets[label]||[]).push(u.displayName||k);
  });
  const groups=Object.keys(buckets)
    .map(label=>({label,names:buckets[label],count:buckets[label].length}))
    .sort((a,b)=>b.count-a.count||a.label.localeCompare(b.label));
  return {info,groups,noPick,distinct:groups.length};
}

/* The "Today's matches — where movement's in play" card. Always reflects the

      ' &middot; '+unplayed.length+' match'+(unplayed.length!==1?'es':'')+' &middot; picks shown, no results yet</div>';
  unplayed.forEach(it=>{

    html+='<div style="padding:9px 0;border-top:1px solid var(--border)">'+
      '<div style="font-size:13px;font-weight:700;display:flex;align-items:center;gap:6px;flex-wrap:wrap">'+
        (info.time?'<span style="color:var(--navy);font-size:10px">'+info.time+'</span>':'')+
        '<span>'+info.home+' <span style="color:var(--muted);font-weight:400">vs</span> '+info.away+'</span>'+
        '<span style="font-size:10px;color:var(--muted);font-weight:400">'+(info.isKo?info.group:'Group '+info.group)+'</span>'+
        badge+
      '</div>';
    if(d.groups.length){
      html+='<div style="margin-top:6px;display:flex;flex-direction:column;gap:3px">';
      d.groups.forEach(g=>{

        if(g.names.length>shown.length) nameStr+=', +'+(g.names.length-shown.length);
        html+='<div style="font-size:12px;line-height:1.4">'+
          '<span style="font-weight:600">'+g.label+'</span> — '+
          '<span style="color:var(--muted)">'+nameStr+'</span> '+
          '<span style="color:var(--navy);font-weight:600">('+g.count+')</span></div>';
      });
