/* Collapsible wrapper for the group-stage section (collapsed by default). Header
   shows the player's group points (group portion of calcScore, via roundPoints).
   `innerHtml` is the full group detail, shown only when expanded. */
function groupCollapseSection(userKey,innerHtml){

      '<span style="font-size:12px;color:var(--muted);width:12px">'+(open?'&#9660;':'&#9654;')+'</span>'+

/* Group-stage result cards (teams · result · pick · +/- points chip) for a user. */
function groupResultCards(mp,bare){
  let groupHtml=bare?'<div class="group-grid">':'<div class="card" style="margin-top:12px"><div class="card-title">Group stage results</div><div class="group-grid">';
  for(const g in GM){
    groupHtml+='<div class="g-card"><div class="g-label">Group '+g+'</div>';
    for(const m of GM[g]){
      const raw=ST.results.group[m.id]||null;
      const res=raw?(typeof raw==="object"?raw.result:raw):null;
      const hg=raw&&typeof raw==="object"?(raw.hg!=null?raw.hg:""):"";
      const ag=raw&&typeof raw==="object"?(raw.ag!=null?raw.ag:""):"";
      const myPick=mp.group[m.id]||null;
      let chip="";
      if(res&&myPick){
        const pts=myPick===res?(res==="D"?SC.groupDraw:SC.groupCorrect):SC.groupWrong;
        chip='<span class="chip '+(pts>0?"chip-ok":"chip-no")+'">'+(pts>0?"+":"")+pts+'</span>';
      }
      const scoreStr=(hg!==""&&ag!=="")?" "+hg+"-"+ag:"";
      const winner=res==="W"?m.home+(scoreStr):res==="D"?"Draw"+scoreStr:res==="L"?m.away+(scoreStr):"–";
      groupHtml+='<div class="match">'+
        '<span class="t-name" title="'+m.home+'">'+m.home+'</span>'+
        '<span style="font-size:10px;font-weight:600;color:'+(res?"var(--navy)":"var(--muted)")+';text-align:center;flex:0 0 55px;white-space:nowrap">'+winner+'</span>'+
        '<span class="t-name" style="text-align:right" title="'+m.away+'">'+m.away+'</span>'+
        chip+
      '</div>';
    }
    groupHtml+='</div>';
  }
  groupHtml+=bare?'</div>':'</div></div>';
  return groupHtml;
}

/* ── Shared R1/R2/R3 knockout round toggle + per-round render formats ──
   R1 = pill list (team fate from actual results), R2 = full bracket, R3 =
   champion pick. Used by both the Standings player panel and the Results view. */
const KO_ROUND_SLOTS={r32:16,r16:8,qf:4,sf:2,final:1};
/* A round is available to view if it has ANY knockout picks — independent of the
   `submitted` flag, so entered-but-unsubmitted picks still display. */
function koRoundHasPicks(userKey,r){
  const u=ST.users[userKey];
  const ko=u&&u.rounds&&u.rounds[r]&&u.rounds[r].picks&&u.rounds[r].picks.ko;
  return !!ko&&Object.keys(ko).some(k=>!k.endsWith('_t3'));
}
/* Selected round for a user: explicit toggle state, else default R2 (latest full
   bracket), else R1 if R2 is empty. */
function brSelRound(userKey){
  let sel=PLAYER_BR_ROUND[userKey];
  if(sel==null) sel=koRoundHasPicks(userKey,2)?2:(koRoundHasPicks(userKey,1)?1:2);
  return sel;
}
/* Teams that ACTUALLY won a match in round R (from recorded results). */
function koActualWinners(R){
  const s=new Set();const n=KO_ROUND_SLOTS[R]||0;
  for(let i=0;i<n;i++){const w=ST.results.ko[R+'_'+i];if(w)s.add(w);}
  return s;
}
/* Teams that ACTUALLY reached round R (participants of round-R matches, derived
   from real results via getKOMatchTeams). decidedOnly → only matches with a result. */
function koActualParticipants(R,decidedOnly){
  const s=new Set();const n=KO_ROUND_SLOTS[R]||0;
  for(let i=0;i<n;i++){
    if(decidedOnly&&!ST.results.ko[R+'_'+i]) continue;
    const t=getKOMatchTeams(R,i);
    if(t){ if(t.home&&t.home!=='TBD')s.add(t.home); if(t.away&&t.away!=='TBD')s.add(t.away); }
  }
  return s;
}

/* [R1][R2][R3] segmented toggle (bidirectional, all rounds always selectable). */
function brRoundToggle(userKey,sel){
  const btn=(val,label)=>'<button data-brround="'+userKey+':'+val+'" style="flex:1;border:none;padding:5px 14px;font-size:11px;font-weight:600;font-family:inherit;cursor:pointer;'+
    (sel===val?'background:var(--navy);color:#fff':'background:transparent;color:var(--navy)')+'">'+label+'</button>';
  const cap={1:'Round 1 picks',2:'Round 2 bracket',3:'Round 3 champion'}[sel]||'';
  return '<div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:12px 0 6px">'+
    '<span style="font-size:11px;color:var(--muted);font-weight:600">Knockout:</span>'+
    '<div style="display:flex;border:1px solid var(--navy);border-radius:7px;overflow:hidden">'+
      btn(1,'R1')+btn(2,'R2')+btn(3,'R3')+
    '</div>'+
    '<span style="font-size:10px;color:var(--muted)">Showing '+cap+'</span>'+
  '</div>';
}

/* R1 view: pill list of the user's Round 1 KO picks, grouped by round, colored by
   what actually happened to each team relative to that round. Points on winning
   pills come from the same koBonusRound the leaderboard uses. */
function renderR1Pills(userKey){
  const u=ST.users[userKey];
  const ko=(u&&u.rounds&&u.rounds[1]&&u.rounds[1].picks&&u.rounds[1].picks.ko)||{};
  const rounds=[['r32','Round of 32'],['r16','Round of 16'],['qf','Quarterfinals'],['sf','Semifinals'],['final','The Final']];
  let body='',any=false;
  rounds.forEach(function(rr){
    const R=rr[0],label=rr[1];
    const seen=new Set(),teams=[];
    Object.keys(ko).forEach(function(key){
      if(key.endsWith('_t3')||key.split('_')[0]!==R) return;
      let t=ko[key]; t=(t&&typeof t==='object')?t.team:t; if(t==='__t3__')t=ko[key+'_t3']||null;
      if(t&&!seen.has(t)){seen.add(t);teams.push(t);}
    });
    if(!teams.length) return;
    any=true;
    const won=koActualWinners(R),reached=koActualParticipants(R,false),decided=koActualParticipants(R,true);
    const sc=SC.ko[R];
    let pills='';
    teams.forEach(function(team){
      let bg='transparent',color='var(--muted)',border='var(--border)',icon='',extra='';
      if(won.has(team)){
        const br=koBonusRound(userKey,R,team);const pts=br?sc.base+(sc.bonus[br-1]||0):0;
        bg='#e8f5ee';color='var(--green)';border='#bfe6cf';icon='&#10003; ';
        extra=pts?' <b>+'+pts+'</b>':'';
      } else if(reached.has(team)){
        if(decided.has(team)){bg='#fdecea';color='var(--red)';border='#f5c6c0';icon='&#10007; ';}
        else {bg='#eef0f3';color='var(--muted)';border='var(--border)';extra=' <span style="opacity:.7">TBD</span>';}
      }
      pills+='<span style="display:inline-flex;align-items:center;font-size:11px;font-weight:600;padding:3px 9px;border-radius:11px;color:'+color+';background:'+bg+';border:1px solid '+border+'">'+icon+team+extra+'</span>';
    });
    body+='<div style="font-size:11px;font-weight:700;color:var(--navy);margin:8px 0 4px">'+label+'</div>'+
      '<div style="display:flex;flex-wrap:wrap;gap:6px;margin-bottom:6px">'+pills+'</div>';
  });
  if(!any) return '<div class="card" style="margin-top:12px"><div class="card-title">Round 1 knockout picks</div><div class="notice-blue" style="margin-bottom:0">No Round 1 knockout picks.</div></div>';
  body+='<div style="font-size:10px;color:var(--muted);margin-top:8px">&#10003; won this round (+pts) &middot; &#10007; reached but lost &middot; grey = out earlier &middot; TBD = not played yet</div>';
  return '<div class="card" style="margin-top:12px"><div class="card-title">Round 1 knockout picks</div>'+body+'</div>';
}

/* R3 view: the user's ultimate champion pick + 3rd-place pick (both R3-pickable). */
function renderR3Champion(userKey){
  const u=ST.users[userKey];
  const ko=(u&&u.rounds&&u.rounds[3]&&u.rounds[3].picks&&u.rounds[3].picks.ko)||{};
  const resolve=key=>{let t=ko[key]; t=(t&&typeof t==='object')?t.team:t; if(t==='__t3__')t=ko[key+'_t3']||null; return t||null;};
  const wrap=inner=>'<div class="card" style="margin-top:12px"><div class="card-title">Round 3 — Champion &amp; 3rd place</div>'+inner+'</div>';
  const champ=resolve('final_0'), third=resolve('third_0');
  if(!champ&&!third) return wrap('<div class="notice-blue" style="margin-bottom:0">No Round 3 picks submitted yet.</div>');
  // Champion block
  let champBlock;
  if(champ){
    const fres=ST.results.ko['final_0']||null;let line='';
    if(fres&&fres===champ){const br=koBonusRound(userKey,'final',champ);const pts=br?SC.ko.final.base+(SC.ko.final.bonus[br-1]||0):0;
      line='<div style="font-size:12px;color:var(--green);font-weight:700;margin-top:4px">&#10003; Correct champion'+(pts?' &middot; +'+pts+' pts':'')+'</div>';}
    else if(fres){line='<div style="font-size:12px;color:var(--red);font-weight:700;margin-top:4px">&#10007; '+fres+' won the title</div>';}
    champBlock='<div style="font-size:15px;font-weight:700;color:var(--navy)">&#127942; Ultimate champion pick: '+champ+'</div>'+line;
  } else champBlock='<div style="font-size:12px;color:var(--muted)">No champion pick submitted yet.</div>';
  // 3rd-place block
  let thirdBlock;
  if(third){
    const tres=ST.results.ko['third_0']||null;let line='';
    if(tres&&tres===third){const br=koBonusRound(userKey,'third',third);const pts=br?SC.ko.third.base+(SC.ko.third.bonus[br-1]||0):0;
      line='<div style="font-size:12px;color:var(--green);font-weight:700;margin-top:4px">&#10003; Correct 3rd place'+(pts?' &middot; +'+pts+' pts':'')+'</div>';}
    else if(tres){line='<div style="font-size:12px;color:var(--red);font-weight:700;margin-top:4px">&#10007; '+tres+' took 3rd</div>';}
    thirdBlock='<div style="font-size:13px;font-weight:700;color:var(--navy)">&#129353; 3rd-place pick: '+third+'</div>'+line;
  } else thirdBlock='<div style="font-size:12px;color:var(--muted)">No 3rd-place pick submitted yet.</div>';
  return wrap(champBlock+'<div style="border-top:1px solid var(--border);margin:10px 0"></div>'+thirdBlock);
}

/* Render the knockout section for the selected round (pills / bracket / champion). */
function renderKoForRound(userKey,sel){
  if(sel===1) return renderR1Pills(userKey);
  if(sel===3) return renderR3Champion(userKey);
  if(!koRoundHasPicks(userKey,2)) return '<div class="card" style="margin-top:12px"><div class="card-title">Round 2 bracket</div><div class="notice-blue" style="margin-bottom:0">No Round 2 picks yet.</div></div>';
  const mp=getMergedPicks(userKey);
  const ko=ST.users[userKey].rounds[2].picks.ko||{};
  const draft={group:mp.group||{},ko:ko};
  return renderBracket(draft,true,ST.predRound,koScoreMeta(userKey));
}

/* Shared "by round" view: group-stage result cards + R1/R2/R3 toggle + the
   selected round's knockout view. Used in both Standings and Results. */
function renderKoRoundView(userKey){
  const mp=getMergedPicks(userKey);
  const sel=brSelRound(userKey);
  // Group stage collapsed by default (group play is done); knockout stays open.
  return groupCollapseSection(userKey,groupResultCards(mp,true))+brRoundToggle(userKey,sel)+renderKoForRound(userKey,sel);
}

function renderPlayerByRound(userKey){ return renderKoRoundView(userKey); }

function renderResults(){
  // Feature: chronological "By date" alternative to the existing by-round view.
  const toggle=viewToggle(RESULTS_VIEW,'data-results-view');
  if(RESULTS_VIEW==="date") return toggle+renderByDate(CU.key);
  return toggle+renderKoRoundView(CU.key);
}

/* The original Results view — group-stage cards (with pick/result/points chips)
   plus the visual knockout bracket (picks highlighted, per-slot base+bonus,
   trophies, champion box) — rendered for ANY user. selfView toggles wording. */
function renderResultsBody(userKey,selfView){
  const mp=getMergedPicks(userKey);
  const actS=actualStandings();
  const pw=selfView?"your pick":"their pick";

  // ── Helper: get teams for a KO match from cascade ──────────────────
  function getMatchTeams(rid,i){
    const m=(ST.results.koMatches[rid]&&ST.results.koMatches[rid][i])||null;
    if(m&&m.home&&m.away) return{home:m.home,away:m.away};
    if(rid==="r32"&&actS){
      const seed=R32_SEEDS[i];
      if(seed&&seed.a.t!=="T3"&&seed.b.t!=="T3"){
        const ta=slotTeam(seed.a,actS);const tb=slotTeam(seed.b,actS);
        if(ta&&tb) return{home:ta,away:tb};
      }
    }
    const f=KO_FEED[rid]&&KO_FEED[rid][i];
    if(f){
      const pr=KO_PREV[rid];
      const ta=ST.results.ko[pr+"_"+f[0]]||null;
      const tb=ST.results.ko[pr+"_"+f[1]]||null;
      if(ta||tb) return{home:ta||"TBD",away:tb||"TBD"};
    }
    return null;
  }

  // ── Build bracket slot HTML for results view ───────────────────────
  function resultSlot(rid,i){
    const key=rid+"_"+i;
    const res=ST.results.ko[key]||null;
    const teams=getMatchTeams(rid,i);
    const home=teams?teams.home:"";
    const away=teams?teams.away:"";
    // "Picked this team to advance" is team-based: a team is the player's pick
    // for this match iff it's in their merged round winners (koBonusRound != null).
    // The stored slot-key pick can point at a team not even in the real matchup,
    // so we don't use it here — this keeps the display aligned with scoring.
    function pickedToAdvance(team){ return !!(team&&team!=="TBD"&&koBonusRound(userKey,rid,team)!=null); }

    function slotPts(team){
      if(!team||team==="TBD") return null;
      const sc=SC.ko[rid];
      const base=sc.base;
      // Bonus follows the team across rounds (matches calcScore/koScoreMeta).
      const br=koBonusRound(userKey,rid,team);
      const bonus=br?(sc.bonus[br-1]||0):0;
      const isPicked=br!=null;
      const isCorrect=res&&res===team;
      if(isPicked&&isCorrect) return{base,bonus,total:base+bonus,correct:true,bonusRound:br};
      if(isPicked&&res&&!isCorrect) return{base:0,bonus:0,total:0,correct:false,missed:true,bonusRound:br};
      if(!isPicked&&isCorrect&&res) return{base,bonus,total:base+bonus,correct:true,notPicked:true,bonusRound:br};
      return null;
    }

    function buildSlot(team,isHome){
      if(!team) return '<div class="brd-slot disabled"><span class="slot-name"><em style="color:var(--muted);font-size:10px">TBD</em></span></div>';
      const won=res&&res===team;
      const picked=pickedToAdvance(team);
      const wrong=res&&picked&&!won;
      const pts=slotPts(team);
      let cls="brd-slot";
      if(won&&picked) cls+=" correct";
      else if(won) cls+=" correct";
      else if(wrong) cls+=" wrong";
      let style="";
      if(won&&picked) style="background:var(--green);";
      else if(won) style="background:var(--green);opacity:.75;";

      // Build pts breakdown label
      let ptsLabel="";
      if(pts&&pts.correct&&!pts.notPicked){
        // Correct pick — show base + bonus breakdown
        const bonusStr=pts.bonus>0?'+'+pts.bonus+' bonus':'no bonus';
        ptsLabel='<div style="font-size:9px;color:'+(won&&picked?"#ffd":"var(--gold)")+';line-height:1.3;text-align:right">'+
          '<div style="font-weight:700">+'+pts.total+' pts</div>'+
          '<div style="opacity:.85">'+pts.base+' base'+( pts.bonus>0?' + '+pts.bonus+' R'+( pts.bonusRound||1)+' bonus':''  )+'</div>'+
        '</div>';
      } else if(pts&&pts.missed){
        // Wrong pick — show 0 and what was missed
        const sc=SC.ko[rid];
        const maxPts=sc.base+(pts.bonusRound?(sc.bonus[pts.bonusRound-1]||0):0);
        ptsLabel='<div style="font-size:9px;color:var(--red);line-height:1.3;text-align:right">'+
          '<div style="font-weight:700">0 pts</div>'+
          '<div style="opacity:.8">missed '+maxPts+'</div>'+
        '</div>';
      }

      return '<div class="'+cls+'" style="'+style+'cursor:default;align-items:flex-start;padding:5px 7px 4px">'+
        '<div style="flex:1;min-width:0">'+
          '<span class="slot-name" style="'+(won?"color:#fff;font-weight:600":"")+'" title="'+team+'">'+team+'</span>'+
          (picked?'<div style="font-size:9px;color:'+(won?"rgba(255,255,255,.75)":wrong?"var(--red)":"var(--muted)")+';margin-top:1px">'+
            (won?"&#10003; "+pw:wrong?"&#10007; "+pw:pw)+
          '</div>':'') +
        '</div>'+
        ptsLabel+
        (won?'<span style="font-size:11px;color:'+(picked?"#fff":"rgba(255,255,255,.7)")+';margin-left:4px;flex-shrink:0">&#127942;</span>':'')+
      '</div>';
    }

    return '<div class="brd-match">'+buildSlot(home,true)+buildSlot(away,false)+'</div>';
  }

  // ── Build result bracket columns ──────────────────────────────────
  const cols=[];
  const roundDefs=[
    {id:"r32",label:"Round of 32",slots:16},
    {id:"r16",label:"Round of 16",slots:8},
    {id:"qf", label:"Quarterfinals",slots:4},
    {id:"sf", label:"Semifinals",slots:2}
  ];

  roundDefs.forEach(function(rd){
    let colHtml="";
    let hasAny=false;
    // R32/QF visual order groups matches by feeder adjacency; `i` is the TRUE slot index.
    const seq=koDisplaySeq(rd.id,rd.slots);
    seq.forEach(function(i){
      const teams=getMatchTeams(rd.id,i);
      const res=ST.results.ko[rd.id+"_"+i]||null;
      if(teams||res){hasAny=true;}
      colHtml+=resultSlot(rd.id,i);
    });
    if(hasAny) cols.push({id:rd.id,label:rd.label,html:colHtml});
  });

  // ── Group results (compact, below bracket) ─────────────────────────
  const groupHtml=groupResultCards(mp);

  // ── Final ──────────────────────────────────────────────────────────
  const fteams=getMatchTeams("final",0);
  const fres=ST.results.ko["final_0"]||null;
  const fhome=fteams?fteams.home:"";
  const faway=fteams?fteams.away:"";
  const fmyPick=mp.ko["final_0"]||null;
  const fmyPickTeam=fmyPick?(fmyPick.team==="__t3__"?(mp.ko["final_0_t3"]||null):fmyPick.team):null;

  function finalSlot(team){
    if(!team) return '<div class="final-slot disabled"><span class="slot-name"><em style="color:var(--muted);font-size:10px">TBD</em></span></div>';
    const won=fres&&fres===team;
    const picked=koBonusRound(userKey,"final",team)!=null; // team-based, matches scoring
    const wrong=fres&&picked&&fres!==team;
    const fsc=SC.ko["final"];
    const base=fsc.base;
    // Final bonus follows the team across rounds (R1 +3 / R2 +2 / R3 +0).
    const fbr=koBonusRound(userKey,"final",team);
    const bonus=fbr?(fsc.bonus[fbr-1]||0):0;
    const total=base+bonus;
    let style="cursor:default;align-items:flex-start;padding:7px 9px 5px;";
    if(won&&picked) style+="background:var(--green);";
    else if(won) style+="background:var(--green);opacity:.75;";
    let ptsLabel="";
    if(won&&picked){
      ptsLabel='<div style="font-size:9px;color:#ffd;line-height:1.3;text-align:right;margin-left:6px">'+
        '<div style="font-weight:700">+'+total+' pts</div>'+
        '<div>'+base+' base'+(bonus>0?' + '+bonus+' R'+(fbr||1)+' bonus':'')+'</div>'+
      '</div>';
    } else if(wrong){
      ptsLabel='<div style="font-size:9px;color:var(--red);line-height:1.3;text-align:right;margin-left:6px">'+
        '<div style="font-weight:700">0 pts</div>'+
        '<div style="opacity:.8">missed '+total+'</div>'+
      '</div>';
    }
    return '<div class="final-slot" style="'+style+'">'+
      '<div style="flex:1;min-width:0">'+
        '<span class="slot-name" style="'+(won?"color:#fff;font-weight:600":"")+'" title="'+team+'">'+team+'</span>'+
        (picked?'<div style="font-size:9px;color:'+(won?"rgba(255,255,255,.75)":wrong?"var(--red)":"var(--muted)")+';margin-top:1px">'+(won?"&#10003; "+pw:wrong?"&#10007; "+pw:pw)+'</div>':'')+
      '</div>'+
      ptsLabel+
      (won?'<span style="font-size:13px;color:'+(picked?"#fff":"rgba(255,255,255,.7)")+';margin-left:4px;flex-shrink:0">&#127942;</span>':'')+
    '</div>';
  }

  // ── My total KO score (bonus follows the team across rounds) ─────────
  let koScore=0;
  for(const key in ST.results.ko){
    if(key.endsWith("_t3")) continue;
    const res=ST.results.ko[key];
    if(!res) continue;
    const rnd=key.split("_")[0];
    const sc=SC.ko[rnd];if(!sc) continue;
    const br=koBonusRound(userKey,rnd,res);
    if(br) koScore+=sc.base+(sc.bonus[br-1]||0);
  }
  let groupScore=0;
  for(const mid in ST.results.group){
    const raw=ST.results.group[mid];
    const res=typeof raw==="object"?raw.result:raw;
    const p=mp.group[mid];
    if(!p||!res) continue;
    if(p===res)groupScore+=(res==="D"?SC.groupDraw:SC.groupCorrect);
    else groupScore+=SC.groupWrong;
  }

  // ── Assemble ───────────────────────────────────────────────────────
  let html='<div class="notice-blue" style="display:flex;align-items:center;justify-content:space-between">'+
    '<span>Results update as admin enters actuals. &#10003; = '+(selfView?"your":"their")+' pick was correct.</span>'+
    '<span style="font-family:Bebas Neue,sans-serif;font-size:18px;color:var(--navy)">Total: '+(groupScore+koScore)+' pts</span>'+
  '</div>';

  if(cols.length){
    html+='<div class="card" style="padding:12px">'+
      '<div class="card-title" style="margin-bottom:8px">Knockout bracket</div>'+
      '<div class="bracket-wrap"><div class="bracket">';
    cols.forEach(function(col){
      const sc=SC.ko[col.id];
      html+='<div class="brd-col">'+
        '<div class="brd-col-title">'+col.label+'<span class="pts">+'+sc.base+' base pts</span></div>'+
        '<div class="brd-matches">'+col.html+'</div>'+
      '</div>';
    });
    // Final column
    html+='<div class="brd-col">'+
      '<div class="brd-col-title">The Final</div>'+
      '<div class="brd-final">'+
        '<div class="winner-crown">&#127942;</div>'+
        '<div class="final-title">'+(fres?"Champion!":"Champion")+'</div>'+
        '<div class="final-box">'+
          finalSlot(fhome)+
          finalSlot(faway)+
        '</div>'+
        (fmyPickTeam&&!fres?'<div style="font-size:11px;color:var(--muted);text-align:center;margin-top:6px">'+(selfView?"Your":"Their")+' pick: <strong>'+fmyPickTeam+'</strong></div>':'')+
      '</div>'+
    '</div>';
    html+='</div></div></div>';
  } else {
    html+='<div class="card"><div class="notice-blue">Knockout results will appear here once matches are played.</div></div>';
  }

  html+=groupHtml;
  return html;
}

function renderLB(){

      key:k,name:u.displayName,score:calcScore(k),

  html+=`<div style="font-size:11px;color:var(--muted);margin-bottom:8px">&#128065; Tap a player to expand their predictions &amp; points</div>`;
  scores.forEach((p,i)=>{
    const isMe=p.key===CU.key;

    const arrow=isMe?'':`<span style="font-size:15px;color:var(--muted);margin-left:6px;display:inline-block;transition:transform .15s;${expanded?"transform:rotate(90deg)":""}">&#8250;</span>`;
    html+=`<div class="lb-row"${isMe?'':` data-expand-user="${p.key}" title="Expand ${p.name}'s predictions &amp; points"`} style="${isMe?"background:var(--navygl);border-radius:8px;padding:9px 8px;margin:0 -8px":"cursor:pointer"}">

      <div class="av" style="${isMe?"background:var(--navy);color:#fff":""}">${p.name.charAt(0).toUpperCase()}</div>
      <span style="flex:1;font-size:14px;font-weight:${isMe?600:400}">${p.name}${isMe?" (you)":""}${p.submitted?`<span class="submitted-badge">R${pr} ✓</span>`:""}</span>
      <span class="lb-pts">${p.score}</span>
      <span style="font-size:11px;color:var(--muted);margin-left:2px">pts</span>
      ${arrow}
    </div>`;
    if(expanded){
      html+=`<div style="padding:4px 2px 10px;border-bottom:1px solid var(--border);margin-bottom:4px">${renderLBPanel(p.key)}</div>`;

  if(scores.length>1){
    const last=scores[scores.length-1];
    html+=`<div class="last-notice">🏃 ${last.name} — ${ST.tournament==="done"?"time to sign up for that 5k!":"currently last!"}</div>`;
  }
  return html+`</div>`;
}

/* View another player's predictions (read-only) from the Standings tab.
   - Submitted+locked rounds are visible to everyone.
   - Unsubmitted rounds: normal users see only a note; the super admin sees
     the in-progress draft with a "Predictions in progress" note. */
function renderViewUser(userKey){
  const u=ST.users[userKey];
  const isSuper=isSuperAdminUser();
  if(!u){
    return '<div class="card"><button class="btn-sm" id="viewUserBack">&#8592; Back to standings</button>'+
      '<p style="padding:14px 0;color:var(--muted)">Player not found.</p></div>';
  }
  const maxRound=ST.predRound;
  let vr=VIEWING_ROUND; if(vr>maxRound)vr=maxRound; if(vr<1)vr=1;
  const isMe=userKey===CU.key;
  const score=calcScore(userKey);

  let html='<div class="card">'+
    '<button class="btn-sm" id="viewUserBack" style="margin-bottom:12px">&#8592; Back to standings</button>'+
    '<div style="display:flex;align-items:center;gap:10px">'+
      '<div class="av">'+u.displayName.charAt(0).toUpperCase()+'</div>'+
      '<div style="flex:1;min-width:0">'+
        '<div style="font-weight:600;font-size:16px">'+u.displayName+(isMe?' (you)':'')+'</div>'+
        '<div style="font-size:12px;color:var(--muted)">'+score+' pts'+(isSuper?' &middot; super-admin view':'')+'</div>'+
      '</div>'+
    '</div></div>';

  // Their points details (Feature 3) — focus on the round currently selected.
  html+=renderPointsBreakdown(userKey,vr);

  // Round selector — always show all three; grey out rounds that haven't opened yet.
  html+='<div class="round-toggle">';
  for(let r=1;r<=3;r++){
    const open=r<=maxRound;
    const sub=getUserRound(userKey,r).submitted;
    const label=r===3?'Final Pick':'Round '+r;
    const status=!open?'&#128274;':(sub?'&#9989;':'&#9998;');  // 🔒 locked / ✅ submitted / ✎ in progress
    html+='<button class="round-tab'+(r===vr?' round-tab-active':'')+'" data-vu-round="'+r+'"'+
      (open?'':' disabled title="Round '+r+' hasn\'t opened yet" style="opacity:.45;cursor:not-allowed"')+'>'+
      status+' '+label+'</button>';
  }
  html+='</div>';

  const rd=getUserRound(userKey,vr);
  const sub=rd.submitted;
  const draft=rd.picks||{group:{},ko:{}};

  // Anti-copy gate: another player's CURRENT open round stays hidden until you
  // submit that round yourself. Past/locked rounds are always viewable.
  if(!isMe && !isSuper && vr===ST.predRound && !getUserRound(CU.key,vr).submitted){
    html+='<div class="notice-blue"><strong>&#128274; Submit your Round '+vr+' predictions first.</strong> '+
      'You’ll be able to see other players’ Round '+vr+' picks once you submit and lock your own. '+
      '(Their points and any earlier locked rounds are shown above.)</div>';
    return html;
  }

  if(!sub && !isSuper){
    html+='<div class="notice-blue"><strong>Round '+vr+' not yet submitted.</strong> '+
      'You can view a player’s predictions for a round only after they submit and lock it.</div>';
    return html;
  }
  if(!sub){ // super admin viewing in-progress
    html+='<div class="notice"><strong>&#9998; Predictions in progress</strong> — Round '+vr+
      ' has not been submitted yet. Showing the current (unlocked) draft.</div>';
  } else {
    html+='<div class="notice-green"><strong>&#9989; Round '+vr+' submitted &amp; locked.</strong></div>';
  }

  // Always render read-only (forceLocked) so nothing can be edited here.
  if(vr===3){
    html+=renderFinalPickOnly(draft,sub,vr,true);
  } else if(vr===1){
    html+=renderGroupPicks(draft,true)+renderBracket(draft,true,vr,koScoreMeta(userKey));
  } else {
    html+=renderBracket(draft,true,vr,koScoreMeta(userKey));
  }
  return html;
}

        <div style="font-size:11px;color:var(--muted);margin-bottom:5px">${m.home} vs ${m.away}</div>

          <select data-gr="${m.id}" class="asel" style="flex:0 0 auto">
            <option value="">–</option>
            <option value="W"${r==="W"?" selected":""}>&#127942; ${hn} W</option>
            <option value="D"${r==="D"?" selected":""}>&#9866; Draw</option>
            <option value="L"${r==="L"?" selected":""}>&#127942; ${an} W</option>
          </select>
          <input type="number" min="0" max="20" placeholder="${hn} goals"
            value="${hg}" data-grg="${m.id}" data-side="h"
            style="width:80px;margin:0;padding:5px 6px;font-size:12px"/>
          <span style="font-size:12px;color:var(--muted)">–</span>
          <input type="number" min="0" max="20" placeholder="${an} goals"
            value="${ag}" data-grg="${m.id}" data-side="a"
            style="width:80px;margin:0;padding:5px 6px;font-size:12px"/>
        </div>
      </div>`;
    }
    html+=`</div>`;
  }
  html+=`</div></div>`;

  // Group standings table
  html+=`<div class="card"><div class="card-title">Live group standings</div>`;
  html+=`<div class="group-grid">`;
  for(const g in GROUPS){
    const teams=GROUPS[g];
    const stats={};
    teams.forEach(t=>{stats[t]={p:0,w:0,d:0,l:0,gf:0,ga:0,pts:0};});
    for(const m of GM[g]){
      const raw=ST.results.group[m.id];
      if(!raw) continue;
      const res=typeof raw==="object"?raw.result:raw;
      const hg=typeof raw==="object"?(raw.hg||0):0;
      const ag=typeof raw==="object"?(raw.ag||0):0;
      if(!res) continue;
      stats[m.home].p++; stats[m.away].p++;
      stats[m.home].gf+=hg; stats[m.home].ga+=ag;
      stats[m.away].gf+=ag; stats[m.away].ga+=hg;
      if(res==="W"){stats[m.home].w++;stats[m.home].pts+=3;stats[m.away].l++;}
      else if(res==="D"){stats[m.home].d++;stats[m.home].pts+=1;stats[m.away].d++;stats[m.away].pts+=1;}
      else{stats[m.away].w++;stats[m.away].pts+=3;stats[m.home].l++;}
    }
    const sorted=[...teams].sort((a,b)=>{
      if(stats[b].pts!==stats[a].pts) return stats[b].pts-stats[a].pts;
      const gdA=stats[a].gf-stats[a].ga; const gdB=stats[b].gf-stats[b].ga;
      if(gdB!==gdA) return gdB-gdA;
      return stats[b].gf-stats[a].gf;
    });
    html+=`<div class="g-card">
      <div class="g-label">Group ${g}</div>
      <table style="width:100%;font-size:10px;border-collapse:collapse">
        <tr style="color:var(--muted)"><th style="text-align:left;padding:2px 3px">Team</th><th>P</th><th>W</th><th>D</th><th>L</th><th>GF</th><th>GA</th><th>GD</th><th>Pts</th></tr>`;
    sorted.forEach((t,i)=>{
      const s=stats[t];const gd=s.gf-s.ga;
      const rowStyle=i<2?"background:var(--navygl)":"";
      html+=`<tr style="${rowStyle}">
        <td style="padding:3px;font-weight:${i<2?600:400};overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:80px">${t}</td>
        <td style="text-align:center;padding:2px">${s.p}</td>
        <td style="text-align:center;padding:2px">${s.w}</td>
        <td style="text-align:center;padding:2px">${s.d}</td>
        <td style="text-align:center;padding:2px">${s.l}</td>
        <td style="text-align:center;padding:2px">${s.gf}</td>
        <td style="text-align:center;padding:2px">${s.ga}</td>
        <td style="text-align:center;padding:2px;color:${gd>=0?"var(--green)":"var(--red)"}">${gd>0?"+":""}${gd}</td>
        <td style="text-align:center;padding:2px;font-weight:600">${s.pts}</td>
      </tr>`;
    });
    html+=`</table></div>`;
  }
  html+=`</div></div>`;

  // 3rd place rankings
  html+=`<div class="card"><div class="card-title">3rd place rankings</div>
    <div class="notice-blue">Top 8 of 12 third-place teams advance to Round of 32. Ranked by: Pts → GD → GF → Fair Play → FIFA ranking.</div>`;
  const thirds=[];
  for(const g in GROUPS){
    const teams=GROUPS[g];
    const stats={};
    teams.forEach(t=>{stats[t]={p:0,w:0,d:0,l:0,gf:0,ga:0,pts:0};});
    for(const m of GM[g]){
      const raw=ST.results.group[m.id];if(!raw)continue;
      const res=typeof raw==="object"?raw.result:raw;
      const hg=typeof raw==="object"?(raw.hg||0):0;
      const ag=typeof raw==="object"?(raw.ag||0):0;
      if(!res)continue;
      stats[m.home].p++;stats[m.away].p++;
      stats[m.home].gf+=hg;stats[m.home].ga+=ag;
      stats[m.away].gf+=ag;stats[m.away].ga+=hg;
      if(res==="W"){stats[m.home].w++;stats[m.home].pts+=3;stats[m.away].l++;}
      else if(res==="D"){stats[m.home].d++;stats[m.home].pts+=1;stats[m.away].d++;stats[m.away].pts+=1;}
      else{stats[m.away].w++;stats[m.away].pts+=3;stats[m.home].l++;}
    }
    const sorted=[...teams].sort((a,b)=>{
      if(stats[b].pts!==stats[a].pts)return stats[b].pts-stats[a].pts;
      return(stats[b].gf-stats[b].ga)-(stats[a].gf-stats[a].ga);
    });
    if(stats[sorted[2]].p>0) thirds.push({team:sorted[2],group:g,...stats[sorted[2]]});
  }
  thirds.sort((a,b)=>{
    if(b.pts!==a.pts)return b.pts-a.pts;
    const gdA=a.gf-a.ga;const gdB=b.gf-b.ga;
    if(gdB!==gdA)return gdB-gdA;
    return b.gf-a.gf;
  });
  html+=`<table style="width:100%;font-size:11px;border-collapse:collapse">
    <tr style="background:#f5f5f2;color:var(--muted)"><th style="text-align:left;padding:5px 6px">Team</th><th>Grp</th><th>P</th><th>Pts</th><th>GD</th><th>GF</th><th style="color:var(--green)">Advances?</th></tr>`;
  thirds.forEach((t,i)=>{
    const advances=i<8;
    html+=`<tr style="border-bottom:1px solid var(--border);${advances?"":"opacity:.5"}">
      <td style="padding:5px 6px;font-weight:600">${t.team}</td>
      <td style="padding:5px 4px;text-align:center">${t.group}</td>
      <td style="padding:5px 4px;text-align:center">${t.p}</td>
      <td style="padding:5px 4px;text-align:center;font-weight:600">${t.pts}</td>
      <td style="padding:5px 4px;text-align:center;color:${(t.gf-t.ga)>=0?"var(--green)":"var(--red)"}">${t.gf-t.ga>0?"+":""}${t.gf-t.ga}</td>
      <td style="padding:5px 4px;text-align:center">${t.gf}</td>
      <td style="padding:5px 4px;text-align:center">${advances?"&#9989; Yes":"&#10060; No"}</td>
    </tr>`;
  });
  if(!thirds.length) html+=`<tr><td colspan="7" style="padding:10px;text-align:center;color:var(--muted)">Enter group results above to see rankings</td></tr>`;
  html+=`</table></div>`;

  return html;
}

function renderAdminKnockout(){
  const canAutoFill=Object.keys(actualStandings()).length>0;
  const autoFillBtnHtml=canAutoFill
    ?'<button class="btn btn-green" id="autoFillBtn" style="margin-bottom:10px;width:auto;padding:8px 16px;font-size:13px">&#9889; Auto-fill R32 from group results</button>'
    :'';

  // Build a cascaded matchup map derived from actual results
  // For each round, if admin hasn't manually set teams, derive from previous round winners
  function getAdminCascade(){
    const cascade={r32:{},r16:{},qf:{},sf:{},third:{},final:{}};

    // R32: from koMatches or auto-derived from group standings
    const actS=actualStandings();
    for(let i=0;i<16;i++){
      const m=(ST.results.koMatches.r32&&ST.results.koMatches.r32[i])||null;
      if(m&&m.home&&m.away){
        cascade.r32[i]={home:m.home,away:m.away};
      } else if(actS){
        const seed=R32_SEEDS[i];
        if(seed&&seed.a.t!=='T3'&&seed.b.t!=='T3'){
          const ta=slotTeam(seed.a,actS);
          const tb=slotTeam(seed.b,actS);
          if(ta&&tb) cascade.r32[i]={home:ta,away:tb};
        }
      }
    }

    // R16/QF/SF: derive from previous-round winners via the corrected feed map.
    [['r16',8],['qf',4],['sf',2]].forEach(function(rd){
      const round=rd[0], n=rd[1], pv=KO_PREV[round];
      for(let i=0;i<n;i++){
        const m=(ST.results.koMatches[round]&&ST.results.koMatches[round][i])||null;
        if(m&&m.home&&m.away){ cascade[round][i]={home:m.home,away:m.away}; continue; }
        const f=KO_FEED[round][i];
        const ta=ST.results.ko[pv+'_'+f[0]]||null;
        const tb=ST.results.ko[pv+'_'+f[1]]||null;
        if(ta||tb) cascade[round][i]={home:ta||'TBD',away:tb||'TBD',derived:true};
      }
    });

    // Final: from SF results
    const mf=(ST.results.koMatches.final&&ST.results.koMatches.final[0])||null;
    if(mf&&mf.home&&mf.away){
      cascade.final[0]={home:mf.home,away:mf.away};
    } else {
      const ta=ST.results.ko['sf_0']||null;
      const tb=ST.results.ko['sf_1']||null;
      if(ta||tb) cascade.final[0]={home:ta||'TBD',away:tb||'TBD',derived:true};
    }

    // 3rd-place: the two SF LOSERS (decided SF participant that isn't the winner).
    const mt=(ST.results.koMatches.third&&ST.results.koMatches.third[0])||null;
    if(mt&&mt.home&&mt.away){
      cascade.third[0]={home:mt.home,away:mt.away};
    } else {
      const t3=getKOMatchTeams('third',0);
      if(t3) cascade.third[0]={home:t3.home,away:t3.away,derived:true};
    }

    return cascade;
  }

  const cascade=getAdminCascade();

  function buildMatchSlot(key,hw,aw,result,derived){
    const hWon=result&&result===hw&&hw!=='TBD';
    const aWon=result&&result===aw&&aw!=='TBD';
    // Clickable if team name is known (regardless of whether it was auto-derived)
    const hClickable=hw&&hw!=='TBD';
    const aClickable=aw&&aw!=='TBD';
    const isDerived=!!derived;

    return '<div class="brd-match" style="position:relative">'+
      '<div class="brd-slot'+(hWon?' correct':'')+(hClickable?' hoverable':'')+'" '+
        'data-admin-result="'+key+'" data-admin-team="'+(hClickable?hw:'')+'" '+
        'style="cursor:'+(hClickable?'pointer':'default')+';'+(hWon?'background:#1a6b3c;':'')+'">'+
        '<span class="slot-name" style="'+(hWon?'color:#fff;font-weight:600':'')+'" title="'+hw+'">'+
          (hw&&hw!=='TBD'?hw:'<em style="color:var(--muted);font-size:10px">Awaiting result</em>')+
        '</span>'+
        (hWon?'<span style="font-size:10px;color:#fff;margin-left:4px" title="Click to clear">&#127942;</span>':'')+
        (hWon?'<span class="admin-clear-hint">&#10005; clear</span>':'')+
      '</div>'+
      '<div class="brd-slot'+(aWon?' correct':'')+(aClickable?' hoverable':'')+'" '+
        'data-admin-result="'+key+'" data-admin-team="'+(aClickable?aw:'')+'" '+
        'style="cursor:'+(aClickable?'pointer':'default')+';'+(aWon?'background:#1a6b3c;':'')+'">'+
        '<span class="slot-name" style="'+(aWon?'color:#fff;font-weight:600':'')+'" title="'+aw+'">'+
          (aw&&aw!=='TBD'?aw:'<em style="color:var(--muted);font-size:10px">Awaiting result</em>')+
        '</span>'+
        (aWon?'<span style="font-size:10px;color:#fff;margin-left:4px" title="Click to clear">&#127942;</span>':'')+
        (aWon?'<span class="admin-clear-hint">&#10005; clear</span>':'')+
      '</div>'+
      globalKoMetaLine(key.split('_')[0],parseInt(key.split('_')[1],10))+
      // Always show edit button so admin can override auto-derived names if needed
      '<button class="admin-edit-btn" data-edit-match="'+key+'" '+
        'title="Edit team names" style="position:absolute;top:2px;right:2px;border:none;background:transparent;cursor:pointer;font-size:11px;color:var(--muted);padding:2px 4px;border-radius:4px">'+
        '&#9998;'+
      '</button>'+
      '<div class="admin-edit-form" id="edit-'+key+'" style="display:none;padding:6px;background:#f5f5f2;border-top:1px solid var(--border)">'+
        '<input placeholder="Home team" value="'+(hw&&hw!=='TBD'?hw:'')+'" data-koh="'+key+'" style="font-size:11px;padding:4px 6px;margin-bottom:4px"/>'+
        '<input placeholder="Away team" value="'+(aw&&aw!=='TBD'?aw:'')+'" data-koa="'+key+'" style="font-size:11px;padding:4px 6px;margin-bottom:0"/>'+
      '</div>'+
    '</div>';
  }

  let html='<div class="card" style="padding:12px">'+
    '<div class="card-title" style="margin-bottom:6px">Knockout bracket '+
      '<span style="font-size:11px;font-weight:400;color:var(--muted)">— click a team to set the match result</span>'+
    '</div>'+
    '<div class="notice-blue" style="margin-bottom:8px">'+
      'Click the winning team to record the result — later rounds auto-populate from results. '+
      'Use &#9998; to manually edit team names. Click a result again to clear it.'+
    '</div>'+
    autoFillBtnHtml+
    (isSuperAdminUser()
      ?'<div class="notice-blue" style="margin-bottom:8px">'+
         '<strong>&#127916; Demo tools (super admin)</strong> — populate fake winners round by round. Run in order.'+
         '<div style="display:flex;gap:6px;flex-wrap:wrap;margin-top:6px">'+
           '<button class="btn-sm" id="demoR32Btn">&#127916; Demo R32</button>'+
           '<button class="btn-sm" id="demoR16Btn">Demo R16</button>'+
           '<button class="btn-sm" id="demoQfBtn">Demo QF</button>'+
           '<button class="btn-sm" id="demoSfBtn">Demo SF</button>'+
           '<button class="btn-sm" id="demoFinalBtn">Demo Final</button>'+
           '<button class="btn-sm btn-danger" id="demoClearBtn">&#128465; Clear all results</button>'+
         '</div>'+
       '</div>'
      :'')+
    '<div class="bracket-wrap"><div class="bracket">';

  // Build columns from cascade
  const roundIds=['r32','r16','qf','sf'];
  const roundLabels={r32:'Round of 32',r16:'Round of 16',qf:'Quarterfinals',sf:'Semifinals'};
  const roundSlots={r32:16,r16:8,qf:4,sf:2};

  roundIds.forEach(function(rid){
    let colHtml='';
    for(let i=0;i<roundSlots[rid];i++){
      const m=cascade[rid][i]||null;
      const result=ST.results.ko[rid+'_'+i]||null;
      const hw=m?m.home:'';
      const aw=m?m.away:'';
      colHtml+=buildMatchSlot(rid+'_'+i,hw,aw,result,m&&m.derived);
    }
    html+='<div class="brd-col">'+
      '<div class="brd-col-title">'+roundLabels[rid]+'<span class="pts">+'+SC.ko[rid].base+' pts</span></div>'+
      '<div class="brd-matches">'+colHtml+'</div>'+
    '</div>';
  });

  // 3rd-place column (SF losers) — reuses the generic match slot + result clicks.
  const tm=cascade.third[0]||{home:'',away:''};
  const tres=ST.results.ko['third_0']||null;
  html+='<div class="brd-col">'+
    '<div class="brd-col-title">3rd-place<span class="pts">+'+SC.ko.third.base+' pts</span></div>'+
    '<div class="brd-matches">'+buildMatchSlot('third_0',tm.home||'',tm.away||'',tres,tm.derived)+'</div>'+
  '</div>';

  // Final column
  const fm=cascade.final[0]||{home:'',away:''};
  const fres=ST.results.ko['final_0']||null;
  const fhw=fm.home||''; const faw=fm.away||'';
  const fhWon=fres&&fres===fhw&&fhw!=='TBD';
  const faWon=fres&&fres===faw&&faw!=='TBD';
  const fDerived=fm&&fm.derived;
  const fhClick=fhw&&fhw!=='TBD';
  const fawClick=faw&&faw!=='TBD';

  html+='<div class="brd-col">'+
    '<div class="brd-col-title">The Final<span class="pts">+'+SC.ko['final'].base+' pts</span></div>'+
    '<div class="brd-final">'+
      '<div class="winner-crown">&#127942;</div>'+
      '<div class="final-title">Champion</div>'+
      '<div class="final-box" style="position:relative">'+
        '<div class="final-slot'+(fhWon?' correct':'')+(fhClick?' hoverable':'')+'" '+
          'data-admin-result="final_0" data-admin-team="'+(fhClick?fhw:'')+'" '+
          'style="cursor:'+(fhClick?'pointer':'default')+';'+(fhWon?'background:#1a6b3c;':'')+'">'+
          '<span class="slot-name" style="'+(fhWon?'color:#fff;font-weight:600':fDerived?'color:var(--muted);font-style:italic':'')+'" title="'+fhw+'">'+
            (fhw&&fhw!=='TBD'?fhw:'<em style="color:var(--muted);font-size:10px">'+(fDerived?'Awaiting result':'Enter team')+'</em>')+
          '</span>'+
          (fhWon?'<span style="font-size:10px;color:#fff;margin-left:4px">&#127942;</span>':'')+
        (fhWon?'<span class="admin-clear-hint">&#10005; clear</span>':'')+
        '</div>'+
        '<div class="final-slot'+(faWon?' correct':'')+(fawClick?' hoverable':'')+'" '+
          'data-admin-result="final_0" data-admin-team="'+(fawClick?faw:'')+'" '+
          'style="cursor:'+(fawClick?'pointer':'default')+';'+(faWon?'background:#1a6b3c;':'')+'">'+
          '<span class="slot-name" style="'+(faWon?'color:#fff;font-weight:600':fDerived?'color:var(--muted);font-style:italic':'')+'" title="'+faw+'">'+
            (faw&&faw!=='TBD'?faw:'<em style="color:var(--muted);font-size:10px">Awaiting result</em>')+
          '</span>'+
          (faWon?'<span style="font-size:10px;color:#fff;margin-left:4px">&#127942;</span>':'')+
        (faWon?'<span class="admin-clear-hint">&#10005; clear</span>':'')+
        '</div>'+
        globalKoMetaLine('final',0)+
        '<button class="admin-edit-btn" data-edit-match="final_0" '+
            'style="position:absolute;top:2px;right:2px;border:none;background:transparent;cursor:pointer;font-size:11px;color:var(--muted);padding:2px 4px;border-radius:4px">&#9998;</button>'+
          '<div class="admin-edit-form" id="edit-final_0" style="display:none;padding:6px;background:#f5f5f2;border-top:1px solid var(--border)">'+
            '<input placeholder="Home team" value="'+(fhw!=='TBD'?fhw:'')+'" data-koh="final_0" style="font-size:11px;padding:4px 6px;margin-bottom:4px"/>'+
            '<input placeholder="Away team" value="'+(faw!=='TBD'?faw:'')+'" data-koa="final_0" style="font-size:11px;padding:4px 6px;margin-bottom:0"/>'+
          '</div>'+
      '</div>'+
    '</div>'+
  '</div>';

  html+='</div></div></div>';
  return html;
}

function renderAdminPlayers(){
  const users=Object.entries(ST.users).filter(([k,u])=>!isSuperAdminEntry(k,u));
  const isSuper=isSuperAdminUser();
  // Count picks made in a given prediction round (group + ko entries).
  const pickCount=(u,r)=>{
    const rd=u&&u.rounds&&u.rounds[r];
    if(!rd||!rd.picks) return 0;
    return (rd.picks.group?Object.keys(rd.picks.group).length:0)+(rd.picks.ko?Object.keys(rd.picks.ko).length:0);
  };
  let html=`<div class="card">
    <div class="card-title">Player management</div>
    <div class="notice-blue">Reset PINs for players who forget theirs. Remove test accounts before going live.${isSuper?' &mdash; <strong>Submit R1/R2/Final</strong> locks that round for a player who made picks but missed the submit button (only flips the flag; never changes picks).':''}</div>`;

  if(!users.length){
    html+=`<p style="font-size:13px;color:var(--muted);padding:10px 0">No players registered yet.</p>`;
  } else {
    users.forEach(([key,u])=>{
      const score=calcScore(key);
      const subs=[1,2,3].map(r=>getUserRound(key,r).submitted);
      const lbl=r=>r===3?'Final':'R'+r;
      // Chips for all three rounds: green ✅ submitted · greyed ✅ picks made but
      // not submitted · empty ⭕ nothing picked.
      const chips=[1,2,3].map(r=>{
        const tag=r===3?'R3':'R'+r, n=pickCount(u,r);
        if(subs[r-1]) return '<span style="color:var(--green)">'+tag+'&#9989;</span>';
        if(n>0) return '<span style="color:var(--muted);opacity:.5" title="Picks made, not yet submitted">'+tag+'&#9989;</span>';
        return '<span style="color:var(--muted)">'+tag+'&#9711;</span>';
      }).join('&nbsp;');
      // Super admin: submit-on-behalf for ANY open round the player has picks in
      // but hasn't submitted (R1/R2/R3). Only flips the submitted flag.
      const submitBtns=isSuper?[1,2,3].map(r=>{
        if(subs[r-1]||ST.predRound<r||pickCount(u,r)===0) return '';
        const rl=r===3?'Final':'Round '+r, lab=r===3?'Final':'R'+r;
        return `<button class="btn-sm" data-submit-round="${key}:${r}" title="Submit &amp; lock this player's ${rl} picks for them" style="border-color:var(--fifa-gold);color:#7a5c10;background:#fdf6e3">Submit ${lab}</button>`;
      }).join(''):'';
      // Unlock controls — only for rounds the player has actually submitted.
      let unlockBtns='';
      subs.forEach((s,i)=>{
        const r=i+1;
        if(s) unlockBtns+=`<button class="btn-sm" data-unlock="${key}:${r}" title="Unlock this player's ${lbl(r)} so they can edit and resubmit" style="font-size:11px;padding:3px 7px">&#128275; ${lbl(r)}</button>`;
      });
      html+=`<div style="display:flex;align-items:center;gap:8px;padding:10px 0;border-bottom:1px solid var(--border);flex-wrap:wrap">
        <div class="av">${u.displayName.charAt(0).toUpperCase()}</div>
        <div style="flex:1;min-width:120px">
          <div style="font-size:13px;font-weight:600">${u.displayName}</div>
          <div style="font-size:11px;color:var(--muted)">${score} pts &nbsp;${chips}</div>
        </div>
        ${submitBtns}
        <input type="password" placeholder="New PIN" maxlength="4"
          id="pin_${key}" style="width:90px;margin:0;padding:5px 8px;font-size:12px"/>
        <button class="btn-sm" data-resetpin="${key}">Reset PIN</button>
        <button class="btn-sm btn-danger" data-removeuser="${key}" style="border-color:#f1a9a0;color:var(--red)">Remove</button>
      </div>`;
      if(unlockBtns){
        html+=`<div style="display:flex;align-items:center;gap:6px;flex-wrap:wrap;padding:0 0 10px 48px;border-bottom:1px solid var(--border);margin-top:-1px">
          <span style="font-size:11px;color:var(--muted)">Unlock round:</span>${unlockBtns}</div>`;
      }
    });
  }
  html+=`<div id="playerMsg" class="ok" style="margin-top:8px"></div></div>`;
  return html;
}

function bindMain(){
  // Super admin: return to the master pool list from inside a pool.
  const backToPools=()=>{
    try{ if(_updateListener&&db&&CURRENT_POOL_CODE) db.ref("pools/"+CURRENT_POOL_CODE).off("value",_updateListener); }catch(e){}
    _updateListener=null;
    CU=null;ADMIN_ON=false;CURRENT_POOL=null;CURRENT_POOL_CODE=null;setURLPool(null);
    VIEW="super";IS_SUPER_ADMIN=true;render();
  };
  const saBackBtn=document.getElementById("saBackBtn");
  if(saBackBtn) saBackBtn.onclick=backToPools;
  const saAllPools=document.getElementById("saAllPools");
  if(saAllPools) saAllPools.onclick=backToPools;
  const saSwitchPool=document.getElementById("saSwitchPool");
  if(saSwitchPool) saSwitchPool.onclick=backToPools;
  document.getElementById("logoutBtn").onclick=()=>{CU=null;VIEW="join";ADMIN_ON=false;render();};
  document.querySelectorAll(".tab[data-tab]").forEach(t=>{t.onclick=()=>{
    // Results tab always opens on the bracket ("By round"); the date view is opt-in.
    if(t.dataset.tab==="results") RESULTS_VIEW="round";
    TAB=t.dataset.tab;VIEWING=null;setTab();
  };});
  bindTab();
  updateMissCount();
}

function setTab(){
  document.getElementById("tc").innerHTML=renderTab();
  bindTab();
  document.querySelectorAll(".tab[data-tab]").forEach(t=>t.classList.toggle("active",t.dataset.tab===TAB));
  updateMissCount();
  // Keep score display in sync whenever tab changes
  const scoreEl=document.getElementById("scoreDisplay");
  if(scoreEl&&CU) scoreEl.textContent=calcScore(CU.key)+" pts";
}

function updateMissCount(){
  const mc=document.getElementById("missCount");
  const sa=document.getElementById("submitArea");
  if(!mc&&!sa) return;
  const pr=ST.predRound;
  const submitted=getUserRound(CU.key,pr).submitted;
  if(submitted) return;
  const miss=countMissing();
  if(mc) mc.innerHTML=miss>0?"<span class=\"missing-count\">"+miss+" pick"+(miss>1?"s":"")+" missing</span>":"<span class=\"missing-zero\">All picks complete!</span>";
  if(sa){
    if(miss>0){
      sa.innerHTML='<div class="notice-red" style="margin-bottom:8px"><strong>'+miss+' pick'+(miss>1?'s':'')+' remaining</strong> — complete all to submit.</div><button class="btn-submit" disabled>Submit Round '+pr+' Predictions</button><p style="font-size:11px;color:var(--muted);text-align:center;margin-top:6px">Once submitted, Round '+pr+' picks are locked permanently.</p>';
    } else {
      sa.innerHTML='<div class="notice-green" style="margin-bottom:8px">All picks complete — ready to submit!</div><button class="btn-submit" id="submitBtn">Submit Round '+pr+' Predictions</button><p style="font-size:11px;color:var(--muted);text-align:center;margin-top:6px">Once submitted, Round '+pr+' picks are locked permanently.</p>';
      const sb=document.getElementById("submitBtn");
      if(sb) sb.onclick=submitRound;
    }
  }
}

function submitRound(){
  const pr=ST.predRound;
  // Show confirm modal instead of browser confirm() which is blocked in iframes
  showConfirmModal(pr, function(){
    const u=ST.users[CU.key];
    if(!u.rounds)u.rounds={};
    if(!u.rounds[pr])u.rounds[pr]={picks:{group:{},ko:{}},submitted:false};
    u.rounds[pr].submitted=true;
    if(!u.history)u.history=[];
    u.history.push({ts:Date.now(),predRound:pr,picks:JSON.parse(JSON.stringify(u.rounds[pr].picks))});
    saveST();
    const newScore=calcScore(CU.key);
    const scoreEl=document.getElementById("scoreDisplay");
    if(scoreEl) scoreEl.textContent=newScore+" pts";
    setTab();
    showSubmitModal(pr,newScore);
  });
}

function showConfirmModal(msgOrPr, onConfirm){
  var isRound=typeof msgOrPr==="number";
  var title=isRound?"Lock Round "+msgOrPr+"?":msgOrPr;
  var body=isRound?"Once submitted, your Round "+msgOrPr+" predictions are permanently locked and cannot be changed.":"This action cannot be undone.";
  var okLabel=isRound?"Yes, submit!":"Confirm";
  var overlay=document.createElement("div");
  overlay.className="modal-overlay";
  overlay.innerHTML=
    '<div class="modal">'+
    '<div class="modal-icon">&#9888;&#65039;</div>'+
    '<div class="modal-title">'+title+'</div>'+
    '<div class="modal-body" style="margin:12px 0">'+body+'</div>'+
    '<div style="display:flex;gap:10px;margin-top:4px">'+
      '<button class="btn btn-outline" id="confirmCancel" style="flex:1">Cancel</button>'+
      '<button class="btn btn-navy" id="confirmOk" style="flex:1">'+okLabel+'</button>'+
    '</div>'+
    '</div>';
  document.body.appendChild(overlay);
  document.getElementById("confirmCancel").onclick=function(){overlay.remove();};
  document.getElementById("confirmOk").onclick=function(){overlay.remove();onConfirm();};
}
