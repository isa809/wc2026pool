function bindTab(){
  const pr=ST.predRound;
  const submitted=getUserRound(CU.key,pr).submitted;

  /* Round 3 final submit button */
  const r3SubmitBtn=document.getElementById("submitBtn");
  if(r3SubmitBtn && pr===3) r3SubmitBtn.onclick=submitRound;

  /* group picks */
  document.querySelectorAll("[data-gp]").forEach(btn=>{
    btn.onclick=()=>{
      if(VIEWING) return;
      if(submitted||pr!==1) return;
      const d=getDraft();
      if(!d.group)d.group={};
      d.group[btn.dataset.gp]=btn.dataset.v;
      saveST();
      // re-render just the bracket portion for cascade update
      setTab();
    };
  });

  /* ko picks — click on brd-slot or final-slot */
  document.querySelectorAll("[data-ko]").forEach(el=>{
    if(el.classList.contains("disabled")) return;
    el.onclick=(e)=>{
      if(VIEWING) return;
      // Don't fire if user clicked the t3 dropdown itself
      if(e.target&&(e.target.tagName==="SELECT"||e.target.tagName==="OPTION")) return;
      if(submitted) return;
      const key=el.dataset.ko;
      const team=el.dataset.team;
      if(!team) return;
      const rnd=key.split("_")[0];
      if(!(PR_OPEN[pr]||[]).includes(rnd)) return;
      const d=getDraft();
      if(!d.ko)d.ko={};
      d.ko[key]={team:team,round:pr};
      saveST();
      setTab();
    };
  });

  /* T3 team selector dropdowns */
  document.querySelectorAll(".t3-sel").forEach(sel=>{
    sel.onchange=()=>{
      if(VIEWING) return;
      if(submitted) return;
      const t3key=sel.dataset.t3key; // e.g. "r32_2_t3"
      const d=getDraft();
      if(!d.ko)d.ko={};
      if(sel.value) d.ko[t3key]=sel.value;
      else delete d.ko[t3key];
      // If user selected a T3 team, auto-select them as winner too
      const winKey=t3key.replace("_t3","");
      if(sel.value&&(!d.ko[winKey]||d.ko[winKey]==="__t3__"||(d.ko[winKey]&&d.ko[winKey].team==="__t3__"))) d.ko[winKey]={team:"__t3__",round:pr};
      saveST();
      updateMissCount();
      // re-render just the bracket portion to update highlighting
      const tc=document.getElementById("tc");
      if(tc) tc.innerHTML=renderTab();
      bindTab();
    };
  });

  /* round toggle — view submitted rounds */
  document.querySelectorAll(".round-tab[data-viewround]").forEach(btn=>{
    btn.onclick=()=>{
      const r=parseInt(btn.dataset.viewround);
      if(r===ST.predRound) return; // already viewing current round
      // Show a read-only view of a past round
      const pastDraft=getUserRound(CU.key,r).picks||{group:{},ko:{}};
      const tc=document.getElementById("tc");
      if(!tc) return;
      let html=renderRoundToggle(r);
      html+=renderPointsBreakdown(CU.key,r);
      const pastSub=getUserRound(CU.key,r).submitted;
      if(r===3){
        html+=renderFinalPickOnly(pastDraft,pastSub,r);
      } else if(r===1){
        html+=renderGroupPicks(pastDraft,true)+renderBracket(pastDraft,true,r,koScoreMeta(CU.key));
      } else {
        html+=renderBracket(pastDraft,true,r,koScoreMeta(CU.key));
      }
      tc.innerHTML=html;
      // Re-bind the toggle buttons only
      document.querySelectorAll(".round-tab[data-viewround]").forEach(b=>{
        b.classList.toggle("round-tab-active", parseInt(b.dataset.viewround)===r);
        b.onclick=()=>{
          // clicking active tab goes back to current round
          if(parseInt(b.dataset.viewround)===ST.predRound){setTab();return;}
          b.dispatchEvent(new Event("click",{bubbles:true}));
        };
      });
      // Rebind the current-round tab
      const curBtn=document.querySelector(".round-tab[data-viewround='"+ST.predRound+"']");
      if(curBtn) curBtn.onclick=()=>setTab();
    };
  });

  /* Results tab: By round / By date toggle */
  document.querySelectorAll("[data-results-view]").forEach(b=>{
    b.onclick=()=>{ RESULTS_VIEW=b.dataset.resultsView; setTab(); };
  });

  /* standings → expand/collapse a player's inline pick panel */
  document.querySelectorAll("[data-expand-user]").forEach(row=>{
    row.onclick=()=>{ const k=row.dataset.expandUser; EXPANDED[k]=!EXPANDED[k]; if(EXPANDED[k]){ delete PLAYER_BR_ROUND[k]; delete GROUP_OPEN[k]; } setTab(); };
  });
  /* Re-render a standings panel body (mode-aware) and RE-WIRE its in-body toggles
     (they live inside the replaced HTML, so their handlers must be re-attached or
     they'd stick after one click). In the Results tab there's no panel body → the
     caller re-renders the whole tab via setTab. */
  function rerenderPanel(k){
    const body=document.getElementById("lbpanelbody_"+k);
    if(body){ const mode=PLAYER_VIEW[k]||"round"; body.innerHTML=(mode==="date"?renderByDate(k):renderPlayerByRound(k)); rewirePanel(body); return true; }
    return false;
  }
  function rewirePanel(scope){ wireBrRound(scope); wireGroupToggle(scope); }
  /* per-player panel sub-toggle (By round / By date) */
  document.querySelectorAll("[data-pview]").forEach(b=>{
    b.onclick=(e)=>{
      e.stopPropagation();
      const parts=b.dataset.pview.split(":"); const k=parts[0], mode=parts[1];
      PLAYER_VIEW[k]=mode;
      rerenderPanel(k);
      document.querySelectorAll('[data-pview^="'+k+':"]').forEach(x=>{
        const on=x.dataset.pview===k+":"+mode;
        x.style.background=on?"var(--navy)":"transparent";
        x.style.color=on?"#fff":"var(--navy)";
      });
    };
  });
  /* R1/R2/R3 knockout toggle — bidirectional */
  function wireBrRound(scope){
    (scope||document).querySelectorAll("[data-brround]").forEach(b=>{
      b.onclick=(e)=>{
        e.stopPropagation();
        const parts=b.dataset.brround.split(":"); const k=parts[0], rnd=+parts[1];
        PLAYER_BR_ROUND[k]=rnd;
        if(!rerenderPanel(k)) setTab();
      };
    });
  }
  /* Group-stage collapse/expand toggle (By round + By date) */
  function wireGroupToggle(scope){
    (scope||document).querySelectorAll("[data-group-toggle]").forEach(b=>{
      b.onclick=(e)=>{
        e.stopPropagation();
        const k=b.dataset.groupToggle;
        GROUP_OPEN[k]=!GROUP_OPEN[k];
        if(!rerenderPanel(k)) setTab();
      };
    });
  }
  rewirePanel(document);

  /* admin unlock */
  const apBtn=document.getElementById("apBtn");
  if(apBtn) apBtn.onclick=()=>{
    if(document.getElementById("apI").value===ST.adminPin){ADMIN_ON=true;setTab();}
    else document.getElementById("apErr").textContent="Wrong PIN.";
  };

  /* advance round & tournament status — injected into placeholder divs */
  const advArea=document.getElementById("advRoundArea");
  if(advArea){
    const pr2=ST.predRound;
    const rName=r=>r===3?'Round 3 (Final Pick)':'Round '+r;
    let inner='';
    if(pr2<3){
      inner+='<button class="btn btn-green" id="advBtn" style="margin-bottom:8px">'+
        (pr2===1?'&#128274; Lock Group Stage &amp; Open Round 2 Predictions':pr2===2?'&#128274; Lock Round 2 &amp; Open Round 3 — Final Pick':'Lock Round '+pr2+' &amp; Open Round '+(pr2+1))+'</button>';
    } else {
      inner+='<div class="notice-blue" style="margin-bottom:8px">Round 3 is the final prediction round.</div>';
    }
    // Unlock the CURRENT round in place — lets everyone resubmit without rolling
    // the pool back. This is the one to use when players need to redo the open round.
    inner+='<button class="btn btn-outline" id="unlockCurBtn" style="margin-bottom:0">&#128275; Unlock '+rName(pr2)+' for all players</button>'+
      '<p style="font-size:11px;color:var(--muted);margin:6px 0 '+(pr2>1?'10px':'0')+'">Reopens the current round so everyone can edit and resubmit it. The round stays open.</p>';
    if(pr2>1){
      inner+='<button class="btn btn-outline" id="reopenBtn" style="margin-bottom:0">&#9665; Roll back to '+rName(pr2-1)+'</button>'+
        '<p style="font-size:11px;color:var(--muted);margin:6px 0 0">Closes the current round and reopens the previous one (unlocked) for all players.</p>';
    }
    advArea.innerHTML=inner;
    const advBtn=document.getElementById("advBtn");
    if(advBtn) advBtn.onclick=()=>{
      const newPr=ST.predRound+1;
      const msg="Lock "+rName(ST.predRound)+" and open "+rName(newPr)+" for all players? (You can reopen it later if needed.)";
      showConfirmModal(msg,function(){
        ST.predRound=newPr;
        if(CURRENT_POOL) CURRENT_POOL.predRound=newPr;
        saveST();setTab();
      });
    };
    const unlockCurBtn=document.getElementById("unlockCurBtn");
    if(unlockCurBtn) unlockCurBtn.onclick=()=>{
      const t=ST.predRound;
      showConfirmModal("Unlock "+rName(t)+" for ALL players? Everyone's "+rName(t)+
        " submission will be reopened so they can change and resubmit it. The round stays open.",function(){
        unlockRoundForAll(t);
        setTab();
      });
    };
    const reopenBtn=document.getElementById("reopenBtn");
    if(reopenBtn) reopenBtn.onclick=()=>{
      const target=ST.predRound-1;
      const msg="Roll the pool back to "+rName(target)+" for ALL players? The current round ("+rName(ST.predRound)+
        ") will close and every player's "+rName(target)+" submission will be unlocked so they can change and resubmit it.";
      showConfirmModal(msg,function(){
        reopenRoundForAll(target);
        setTab();
      });
    };
  }

  const tsArea=document.getElementById("tournStatusArea");
  if(tsArea){
    if(ST.tournament==="active"){
      tsArea.innerHTML='<button class="btn btn-outline" id="endBtn">Mark Tournament Complete</button>';
      const endBtn=document.getElementById("endBtn");
      if(endBtn) endBtn.onclick=()=>{
        showConfirmModal("Mark tournament complete? The leaderboard will be finalized.",function(){
          ST.tournament="done";saveST();setTab();
        });
      };
    } else {
      tsArea.innerHTML='<div class="notice-green" style="margin-bottom:8px">Tournament complete — standings are final.</div>'+
        '<button class="btn btn-outline" id="reopenTournBtn">&#8617; Reopen tournament (undo complete)</button>';
      const reopenTournBtn=document.getElementById("reopenTournBtn");
      if(reopenTournBtn) reopenTournBtn.onclick=()=>{
        showConfirmModal("Reopen the tournament? Standings will no longer be marked final and you can keep entering results.",function(){
          ST.tournament="active";saveST();setTab();
        });
      };
    }
  }

  /* group results */
  document.querySelectorAll("[data-gr]").forEach(sel=>{
    sel.onchange=()=>{
      const mid=sel.dataset.gr;
      if(sel.value){
        // Preserve existing goal data if already set
        const existing=ST.results.group[mid];
        if(existing&&typeof existing==="object"){
          existing.result=sel.value;
          ST.results.group[mid]=existing;
        }else{
          ST.results.group[mid]={result:sel.value,hg:"",ag:""};
        }
      }else{
        delete ST.results.group[mid];
      }
      saveST();
    };
  });

  /* ko inputs */
  const autoFillBtn=document.getElementById("autoFillBtn");
  if(autoFillBtn) autoFillBtn.onclick=()=>{
    const filled=autoFillR32Matchups();
    setTab();
  };

  /* demo tools (super admin only) */
  if(isSuperAdminUser()){
    const wire=(id,fn)=>{const b=document.getElementById(id);if(b)b.onclick=()=>{fn();setTab();};};
    wire("demoGroupsBtn",demoFillGroups);
    wire("demoR32Btn",demoFillR32);
    wire("demoR16Btn",()=>demoFillKo("r16"));
    wire("demoQfBtn",()=>demoFillKo("qf"));
    wire("demoSfBtn",()=>demoFillKo("sf"));
    wire("demoFinalBtn",()=>demoFillKo("final"));
    const clr=document.getElementById("demoClearBtn");
    if(clr) clr.onclick=()=>showConfirmModal("Clear all results (groups + knockout)? Players and their picks are kept.",()=>{
      ST.results={group:{},ko:{},koMatches:{}};saveST();setTab();
    });
  }

  document.querySelectorAll("[data-koh],[data-koa]").forEach(inp=>{
    inp.oninput=()=>{
      const key=inp.dataset.koh||inp.dataset.koa;
      const field=inp.dataset.koh?"home":"away";
      const[rnd,idx]=key.split("_");
      if(!ST.results.koMatches[rnd])ST.results.koMatches[rnd]=[];
      if(!ST.results.koMatches[rnd][idx])ST.results.koMatches[rnd][idx]={home:"",away:""};
      ST.results.koMatches[rnd][idx][field]=inp.value;
      saveST();
    };
  });
  document.querySelectorAll("[data-kor]").forEach(sel=>{
    sel.onchange=()=>{
      const key=sel.dataset.kor;
      if(sel.value)ST.results.ko[key]=sel.value;else delete ST.results.ko[key];saveST();
    };
  });

  /* admin bracket — click slot to set result */
  document.querySelectorAll("[data-admin-result]").forEach(el=>{
    el.onclick=(e)=>{
      e.stopPropagation();
      const key=el.dataset.adminResult;
      const team=el.dataset.adminTeam;
      if(!team) return;
      // Toggle: if already the result, clear it; otherwise set it
      if(ST.results.ko[key]===team){
        delete ST.results.ko[key];
      } else {
        ST.results.ko[key]=team;
      }
      saveST();
      setTab();
    };
  });

  /* admin bracket — pencil icon to toggle team name inputs */
  document.querySelectorAll("[data-edit-match]").forEach(btn=>{
    btn.onclick=(e)=>{
      e.stopPropagation();
      const key=btn.dataset.editMatch;
      const form=document.getElementById("edit-"+key);
      if(form) form.style.display=form.style.display==="none"?"block":"none";
    };
  });

  /* copy pool link */
  const copyLinkBtn=document.getElementById("copyLinkBtn");
  if(copyLinkBtn) copyLinkBtn.onclick=()=>{
    const link=window.location.origin+window.location.pathname+"?pool="+CURRENT_POOL_CODE;
    navigator.clipboard.writeText(link).then(()=>{
      copyLinkBtn.textContent="&#10003; Copied!";
      setTimeout(()=>copyLinkBtn.innerHTML="&#128203; Copy link",2000);
    });
  };

  /* admin sub-tab navigation */
  document.querySelectorAll("[data-admintab]").forEach(btn=>{
    btn.onclick=()=>{
      ST._adminTab=btn.dataset.admintab;
      setTab();
    };
  });

  /* goal inputs for group matches */
  document.querySelectorAll("[data-grg]").forEach(inp=>{
    inp.oninput=()=>{
      const mid=inp.dataset.grg;const side=inp.dataset.side;
      if(!ST.results.group[mid]||typeof ST.results.group[mid]==="string"){
        const old=ST.results.group[mid]||"";
        ST.results.group[mid]={result:old,hg:"",ag:""};
      }
      const val=inp.value===""?"":parseInt(inp.value)||0;
      if(side==="h")ST.results.group[mid].hg=val;
      else ST.results.group[mid].ag=val;
      saveST();
    };
  });

  /* player reset PIN */
  document.querySelectorAll("[data-resetpin]").forEach(btn=>{
    btn.onclick=()=>{
      const key=btn.dataset.resetpin;
      const inp=document.getElementById("pin_"+key);
      if(!inp){return;}
      const newPin=inp.value.trim();
      if(!/^\d{4}$/.test(newPin)){
        const msg=document.getElementById("playerMsg");
        if(msg){msg.className="err";msg.textContent="PIN must be 4 digits.";}
        return;
      }
      if(!ST.users[key]){return;}
      ST.users[key].pin=newPin;
      saveUserNode(key);
      inp.value="";
      const msg=document.getElementById("playerMsg");
      if(msg){msg.className="ok";msg.textContent=ST.users[key].displayName+"'s PIN updated to "+newPin;}
    };
  });

  /* super admin: submit any round (R1/R2/R3) on behalf of a player who made
     picks but hasn't submitted. Only flips the submitted flag — never alters
     picks. (Some players make picks but miss the submit button.) */
  document.querySelectorAll("[data-submit-round]").forEach(btn=>{
    btn.onclick=()=>{
      const [key,rStr]=btn.dataset.submitRound.split(":");
      const r=parseInt(rStr,10);
      const u=ST.users[key];
      const msg=document.getElementById("playerMsg");
      const fail=t=>{ if(msg){msg.className="err";msg.textContent=t;} };
      const name=(u&&u.displayName)||key;
      const rLbl=r===3?"Final Pick":"Round "+r;
      if(!u||!u.rounds||!u.rounds[r]){ fail(name+" has no "+rLbl+" data to submit."); return; }
      if(u.rounds[r].submitted===true){ fail(name+" has already submitted "+rLbl+"."); return; }
      const picks=u.rounds[r].picks||{};
      const n=(picks.group?Object.keys(picks.group).length:0)+(picks.ko?Object.keys(picks.ko).length:0);
      if(n===0){ fail(name+" has no "+rLbl+" picks to submit."); return; }
      showConfirmModal("Submit "+rLbl+" picks for "+name+"? Their picks will be locked.",function(){
        u.rounds[r].submitted=true;
        if(!u.history) u.history=[];
        u.history.push({ts:Date.now(),predRound:r,picks:JSON.parse(JSON.stringify(u.rounds[r].picks)),submittedBy:"superadmin"});
        // Persist THIS player's node (saveST only writes the current/admin user).
        saveUserNode(key);
        setTab();
      });
    };
  });

  /* unlock a single player's submitted round */
  document.querySelectorAll("[data-unlock]").forEach(btn=>{
    btn.onclick=()=>{
      const [key,rStr]=btn.dataset.unlock.split(":");
      const r=parseInt(rStr);
      const u=ST.users[key];
      if(!u||!u.rounds||!u.rounds[r]) return;
      const name=u.displayName||key;
      const rLbl=r===3?"Final Pick":"Round "+r;
      const note=r===ST.predRound?"":" Note: "+rLbl+" isn't the current round, so they'll be able to edit it only once it's the open round again (e.g. after you reopen it).";
      showConfirmModal("Unlock "+name+"'s "+rLbl+"? Their submission will be reopened so they can change and resubmit it."+note,function(){
        u.rounds[r].submitted=false;
        saveUserNode(key);
        setTab();
      });
    };
  });

  /* remove player */
  document.querySelectorAll("[data-removeuser]").forEach(btn=>{
    btn.onclick=()=>{
      const key=btn.dataset.removeuser;
      const name=ST.users[key]?ST.users[key].displayName:key;
      showConfirmModal("Remove "+name+"?",function(){
        delete ST.users[key];
        removeUserNode(key);
        setTab();
      });
    };
  });

  /* pin */
  const npBtn=document.getElementById("npBtn");
  if(npBtn) npBtn.onclick=()=>{
    const p1=document.getElementById("np1").value;
    const p2=document.getElementById("np2").value;
    const msg=document.getElementById("npMsg");
    if(!/^\d{4}$/.test(p1)){msg.className="err";msg.textContent="Must be 4 digits.";return;}
    if(p1!==p2){msg.className="err";msg.textContent="PINs don't match.";return;}
    ST.adminPin=p1;saveST();msg.className="ok";msg.textContent="PIN updated!";
  };

  /* reset */
  const crBtn=document.getElementById("clrResBtn");
  if(crBtn) crBtn.onclick=()=>{
    showConfirmModal("Clear all results?",function(){
      ST.results={group:{},ko:{},koMatches:{}};saveST();setTab();
    });
  };
  const caBtn=document.getElementById("clrAllBtn");
  if(caBtn) caBtn.onclick=()=>{
    showConfirmModal("Wipe ALL data including players and picks?",function(){
      poolRef().remove().then(()=>{
        ST={users:{},results:{group:{},ko:{},koMatches:{}},adminPin:"0000",predRound:1,tournament:"active"};
        CU=null;VIEW="login";ADMIN_ON=false;render();
      });
    });
  };
}

/* ══ STARTUP ══
   Show loading screen, connect to Firebase, then render the app.
   If Firebase config is not filled in yet, falls back to localStorage
   so the app still works during development.
*/
function showLoadingScreen(){
  document.getElementById("root").innerHTML=
    '<div style="display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:80vh;gap:16px">'+
      '<div style="font-size:48px">⚽</div>'+
      '<div style="font-family:Bebas Neue,sans-serif;font-size:24px;color:var(--fifa-blue);letter-spacing:.06em">World Cup 2026 Pool</div>'+
      '<div style="font-size:14px;color:var(--muted)">Connecting...</div>'+
      '<div style="width:40px;height:40px;border:3px solid var(--border);border-top-color:var(--fifa-blue);border-radius:50%;animation:spin .8s linear infinite"></div>'+
      '<style>@keyframes spin{to{transform:rotate(360deg)}}</style>'+
    '</div>';
}

/* ══ FIREBASE POOL FUNCTIONS ══
   These are the Firebase implementations of all pool operations.
   In localStorage mode, window.* overrides replace these.
*/
function loadPool(code, callback){
  if(!db){callback("Firebase not initialized");return;}
  DB_READY=false;
  db.ref("pools/"+code).once("value").then(snapshot=>{
    const data=snapshot.val();
    if(!data){callback("NOT_FOUND");return;}
    CURRENT_POOL_CODE=code;
    CURRENT_POOL={
      code, name:data.name||APP_NAME,
      adminPin:data.adminPin||"0000",
      joinPassword:data.joinPassword||"",
      adminKey:data.adminKey||"",
      predRound:data.predRound||1,
      tournament:data.tournament||"active",
      locked:!!data.locked,
      announcement:data.announcement||""
    };
    ST.users     =data.users     ||{};
    ST.results   =normResults(data.results);
    ST.adminPin  =data.adminPin  ||"0000";
    ST.predRound =data.predRound ||1;
    ST.tournament=data.tournament||"active";
    ST.announcement=data.announcement||"";
    ST._adminTab =data._adminTab ||"rounds";
    DB_READY=true;
    callback(null,data);
  }).catch(err=>callback(err.message));
}

function createPool(code,name,adminPin,joinPassword,adminName,adminPinUser,callback){
  if(!db){callback("Firebase not initialized");return;}
  db.ref("pools/"+code).once("value").then(snapshot=>{
    if(snapshot.exists()){callback("Pool code already taken. Choose a different one.");return;}
    const adminKey=nk(adminName);
    const poolData={
      name,adminPin,joinPassword,adminKey,
      createdAt:Date.now(),predRound:1,tournament:"active",
      users:{[adminKey]:{displayName:adminName,pin:adminPinUser,rounds:{},history:[],isAdmin:true}},
      results:{group:{},ko:{},koMatches:{}}
    };
    db.ref("pools/"+code).set(poolData).then(()=>{
      callback(null,adminKey);
    }).catch(err=>callback(err.message));
  });
}

function saveST(){
  if(!DB_READY||!CURRENT_POOL_CODE||!db) return;
  const base="pools/"+CURRENT_POOL_CODE;
  // Granular write: shared pool fields + ONLY the current user's own node.
  // We never write the whole users tree, so a stale device (e.g. the admin busy
  // entering results) can't overwrite another player's freshly-submitted round.
  // Each player saves their own node; everyone else stays current via the
  // realtime listener.
  const updates={
    [base+"/adminPin"]:   ST.adminPin,
    [base+"/results"]:    ST.results,
    [base+"/predRound"]:  ST.predRound,
    [base+"/tournament"]: ST.tournament,
    [base+"/_adminTab"]:  ST._adminTab||"rounds"
  };
  if(CURRENT_POOL){
    updates[base+"/name"]=CURRENT_POOL.name||"";
    updates[base+"/joinPassword"]=CURRENT_POOL.joinPassword||"";
    updates[base+"/adminKey"]=CURRENT_POOL.adminKey||"";
    if(CURRENT_POOL.createdAt) updates[base+"/createdAt"]=CURRENT_POOL.createdAt;
  }
  if(CU&&CU.key&&ST.users[CU.key]) updates[base+"/users/"+CU.key]=ST.users[CU.key];
  db.ref().update(updates).catch(err=>console.error("Firebase save error:",err));
}

/* Persist a single user's node (used by admin actions on OTHER players, e.g.
   PIN resets) without touching the rest of the users tree. */
function saveUserNode(key){
  if(!DB_READY||!CURRENT_POOL_CODE||!db){ saveST(); return; }
  if(ST.users[key]) db.ref("pools/"+CURRENT_POOL_CODE+"/users/"+key).set(ST.users[key]).catch(err=>console.error("Firebase save error:",err));
}

/* Remove a single user's node from the pool (admin "Remove player"). */
function removeUserNode(key){
  if(!DB_READY||!CURRENT_POOL_CODE||!db){ saveST(); return; }
  db.ref("pools/"+CURRENT_POOL_CODE+"/users/"+key).remove().catch(err=>console.error("Firebase remove error:",err));
}

/* Admin: unlock a prediction round for every player so they can edit and
   resubmit it. Does NOT change which round is current. */
function unlockRoundForAll(targetRound){
  Object.keys(ST.users).forEach(k=>{
    const u=ST.users[k];
    if(u&&u.rounds&&u.rounds[targetRound]) u.rounds[targetRound].submitted=false;
  });
  saveAllUsersAndShared();
}

/* Admin: roll the whole pool back to an earlier prediction round and unlock that
   round for every player so they can edit and resubmit. */
function reopenRoundForAll(targetRound){
  ST.predRound=targetRound;
  if(CURRENT_POOL) CURRENT_POOL.predRound=targetRound;
  unlockRoundForAll(targetRound);
}

/* Persist predRound + every user node at once. Used only for deliberate admin
   bulk operations (e.g. reopening a round); ordinary saves stay granular. */
function saveAllUsersAndShared(){
  if(!DB_READY||!CURRENT_POOL_CODE||!db){ saveST(); return; }
  const base="pools/"+CURRENT_POOL_CODE;
  const updates={[base+"/predRound"]:ST.predRound,[base+"/results"]:ST.results,[base+"/tournament"]:ST.tournament,[base+"/adminPin"]:ST.adminPin};
  Object.keys(ST.users).forEach(k=>{ updates[base+"/users/"+k]=ST.users[k]; });
  db.ref().update(updates).catch(err=>console.error("Firebase save error:",err));
}

function loadAllPools(callback){
  if(!db){callback("Firebase not initialized");return;}
  db.ref("pools").once("value").then(snapshot=>{
    const data=snapshot.val()||{};
    callback(null,Object.entries(data).map(([code,pool])=>({code,...pool})));
  }).catch(err=>callback(err.message));
}

let _updateListener=null;
function listenForUpdates(){
  if(!db||!CURRENT_POOL_CODE) return;
  listenForGlobalAnnouncement(); // app-wide message lives outside the pool node
  if(_updateListener) db.ref("pools/"+CURRENT_POOL_CODE).off("value",_updateListener);
  _updateListener=db.ref("pools/"+CURRENT_POOL_CODE).on("value",snapshot=>{
    if(!DB_READY) return;
    const data=snapshot.val();
    if(!data) return;
    const prevPredRound=ST.predRound;
    const prevTournament=ST.tournament;
    const prevAnnounce=ST.announcement||"";
    ST.results   =normResults(data.results||ST.results);
    ST.adminPin  =data.adminPin  ||ST.adminPin;
    ST.predRound =data.predRound ||ST.predRound;
    ST.tournament=data.tournament||ST.tournament;
    ST.announcement=data.announcement||"";
    if(CURRENT_POOL){
      CURRENT_POOL.predRound =ST.predRound;
      CURRENT_POOL.tournament=ST.tournament;
      CURRENT_POOL.locked    =!!data.locked;
      CURRENT_POOL.announcement=ST.announcement;
    }
    const remoteUsers=data.users||{};
    let ownChanged=false;
    Object.keys(remoteUsers).forEach(k=>{
      if(!CU||k!==CU.key){ ST.users[k]=remoteUsers[k]; return; }
      // Own node: keep local picks (don't clobber in-progress edits), but sync an
      // admin-driven submitted flag change — an UNLOCK (true→false) or a
      // submit-on-behalf (false→true) — so it reflects live on this device.
      const localU=ST.users[k], remoteU=remoteUsers[k];
      if(localU&&localU.rounds&&remoteU&&remoteU.rounds){
        Object.keys(localU.rounds).forEach(rn=>{
          const lr=localU.rounds[rn], rr=remoteU.rounds[rn];
          if(lr&&rr&&typeof rr.submitted==="boolean"&&lr.submitted!==rr.submitted){ lr.submitted=rr.submitted; ownChanged=true; }
        });
      }
    });
    // Drop locally-cached players that were removed remotely (keep yourself and
    // the virtual super-admin account, which isn't persisted as a real player).
    Object.keys(ST.users).forEach(k=>{
      if(CU&&k===CU.key) return;
      if(isSuperAdminEntry(k,ST.users[k])) return;
      if(!(k in remoteUsers)) delete ST.users[k];
    });
    // Re-render on round changes (either direction) and admin unlocks so players
    // see a reopened round live, plus the usual standings/results refresh.
    if(TAB==="lb"||TAB==="results"||ownChanged||prevPredRound!==ST.predRound||prevTournament!==ST.tournament||prevAnnounce!==ST.announcement) setTab();
    const scoreEl=document.getElementById("scoreDisplay");
    if(scoreEl&&CU) scoreEl.textContent=calcScore(CU.key)+" pts";
  });
}

function startApp(){
  // Check if URL has a ?pool=code parameter
  const urlPoolCode = getPoolCodeFromURL();

  if(urlPoolCode){
    // Someone arrived via a pool link — load that pool then go to join screen
    showLoadingScreen();
    loadPool(urlPoolCode,(err)=>{
      if(err==="NOT_FOUND"){
        document.getElementById("root").innerHTML=
          '<div style="padding:40px 20px;text-align:center">'+
          '<div style="font-size:48px;margin-bottom:12px">&#128531;</div>'+
          '<div style="font-family:Bebas Neue,sans-serif;font-size:24px;color:var(--fifa-blue)">Pool Not Found</div>'+
          '<p style="color:var(--muted);margin:10px 0">The pool code <strong>'+urlPoolCode+'</strong> does not exist.</p>'+
          '<button class="btn btn-outline" style="margin:0 auto;max-width:200px" id="notFoundBack">Back to Home</button>'+
          '</div>';
        return;
      }
      if(err){
        console.error("Pool load error:",err);
        VIEW="landing";render();
        return;
      }
      // Pool loaded — go to join/login screen
      VIEW="join";
      listenForUpdates();
      render();
    });
  } else {
    // No pool in URL — show landing page
    VIEW="landing";
    render();
  }
}

if(db){
  showLoadingScreen();
  startApp();
} else {
  // Firebase not configured (or init failed) — localStorage fallback.
  // Still shows the full multi-pool UI using localStorage as the backend.
  console.warn("Firebase unavailable — using localStorage fallback");

  const STORE="wc26_";
  // Expose LS globally so super admin functions can access it
  window.LS={
    get:k=>{try{const v=localStorage.getItem(STORE+k);return v?JSON.parse(v):null}catch{return null}},
    set:(k,v)=>{try{localStorage.setItem(STORE+k,JSON.stringify(v))}catch{}}
  };
  const LS=window.LS;

  // Override Firebase functions to use localStorage instead
  // Pool registry stored as {code: {name, adminPin, joinPassword, ...}}
  window.loadPool=function(code, callback){
    const pools=LS.get("pools")||{};
    const pool=pools[code];
    if(!pool){callback("NOT_FOUND");return;}
    CURRENT_POOL_CODE=code;
    CURRENT_POOL={code,...pool};
    ST.users     = pool.users     ||{};
    ST.results   = normResults(pool.results);
    ST.adminPin  = pool.adminPin  ||"0000";
    ST.predRound = pool.predRound ||1;
    ST.tournament= pool.tournament||"active";
    ST._adminTab = pool._adminTab ||"rounds";
    DB_READY=true;
    callback(null, pool);
  };

  window.createPool=function(code, name, adminPin, joinPassword, adminName, adminPinUser, callback){
    const pools=LS.get("pools")||{};
    if(pools[code]){callback("Pool code already taken. Choose a different one.");return;}
    const adminKey=nk(adminName);
    pools[code]={
      name, adminPin, joinPassword, adminKey,
      createdAt:Date.now(), predRound:1, tournament:"active",
      users:{[adminKey]:{displayName:adminName,pin:adminPinUser,rounds:{},history:[],isAdmin:true}},
      results:{group:{},ko:{},koMatches:{}}
    };
    LS.set("pools",pools);
    callback(null, adminKey);
  };

  window.saveST=function(){
    if(!CURRENT_POOL_CODE) return;
    const pools=LS.get("pools")||{};
    // Preserve all existing pool fields (especially joinPassword, adminKey, name)
    const existing=pools[CURRENT_POOL_CODE]||{};
    pools[CURRENT_POOL_CODE]=Object.assign(existing,{
      users:ST.users, results:ST.results,
      adminPin:ST.adminPin, predRound:ST.predRound,
      tournament:ST.tournament, _adminTab:ST._adminTab||"rounds",
      // Always re-save these from CURRENT_POOL so they never get dropped
      name:        CURRENT_POOL?CURRENT_POOL.name:existing.name,
      joinPassword:CURRENT_POOL?CURRENT_POOL.joinPassword:existing.joinPassword,
      adminKey:    CURRENT_POOL?CURRENT_POOL.adminKey:existing.adminKey
    });
    LS.set("pools",pools);
    if(CURRENT_POOL){
      CURRENT_POOL.predRound=ST.predRound;
      CURRENT_POOL.tournament=ST.tournament;
    }
  };

  window.loadAllPools=function(callback){
    const pools=LS.get("pools")||{};
    callback(null, Object.entries(pools).map(([code,pool])=>({code,...pool})));
  };

  window.listenForUpdates=function(){/* no-op for localStorage */};

  DB_READY=true;
  // Show landing page — full multi-pool flow works via localStorage
  const urlCode=getPoolCodeFromURL();
  if(urlCode){
    loadPool(urlCode,(err)=>{
      if(err==="NOT_FOUND"){VIEW="landing";}
      else{VIEW="join";}
      render();
    });
  } else {
    VIEW="landing";render();
  }
}
</script>
